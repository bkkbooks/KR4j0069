canonical_identifier: bkk:krp/KR4j0069/krp/v1/juan/6
seq: 6
front:
  text: 跋吳騷者何崑曲也曲何以言騷尊其體也是書為武林張楚叔旭初昆季所輯録楚叔廣收共成三集旭初嚴核合並一編書刻于崇禎十年丁丑分宮實詞體皆側艷又得項南洲為之刊圖精雅可玩余藏此書垂三十年始欲刊列曲叢而滬戰勃發所儲存涵芬樓諸曲焚熸至二十八種此書幸免劫灰彌自珍惜已固安劉伯峯先生新得此書屬刊入四部叢刊續編於是海上同人命撰斯跋余謂散曲總集莫富于雍熙而莫精于南詞韻選他如南北宮詞紀太霞新奏詞林逸響諸書不過承流接武而已是編稍後出故崑山梁氏吳江沈氏吳縣龍氏山陰王氏諸作采録至多而嶺樵騷隱二家評語散見各詞後者又皆有所依據如云詞隱新譜者為沈伯明自晉之南九宮新譜
  hash: sha256:63bfd58b74164cd29494a4e04a4f7d64e8be31ee741020914843a82451d6515b
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4j0069_SBCK_006-1a}
body:
  text: 也云墨憨齋者為馮子猶猶龍之南詞譜也云三籟者為凌初成濛初之南音三籟也諸書不盡傳得此略見一二不亦善乎若夫分析正贈辨訂牌調正板式之􆁚訛考集曲之字句尤較許宇陳所聞等為詳是為散曲中盡善之作韻選而外首屈一指矣惟竊有未解者雍熙中南曲大抵皆古南詞為詞家之瓌寶書中徵引舊詞凡十五篇其出自雍熙者為羅江怨二曲十樣錦字字錦七賢過關各一曲餘皆采自他書此其故何也豈別有深意耶海內賢達能解余之惑乎此又余所日夕企望者矣甲戌七月長洲吳梅
  hash: sha256:a0fd20deb6f81d97805d19f29b865d2124b5ac1a57c8a49fd9ac5854e85bb008

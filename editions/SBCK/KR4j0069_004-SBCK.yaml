front:
  text: 白雪齋􅃟訂樂府吳騷合編卷之四
  hash: sha256:c00588b79919e7cef2177c3ad49b40d11e40f4f50bae6297a9f7e2dba5033e9f
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4j0069_SBCK_004-1a}
body:
  text: 騷隱居士􅃟輯半嶺道人删訂仙吕入􅀟調題情周秋汀夜行船序用車􅃒韻翠擁紅􅃒錦香叢勾住採花蝴蝶迷戀處只爲多情難捨風月頓使綢繆偏令愛惜愈加疼􅀬􅂸也准僃下􅀑門關心願對海神同設前腔換頭應藉夙世􅁈業但逡廵一見兩情牽掣歌臺上一曲霓裳淸絕嬌怯粉黛輕匀蛾睂淡掃晩粧初卸覻者便是那潘妃丰韻比他何别黑䗫序換頭舊名闘寶蟾誤曽寫鸚鵡新詞向尊前花下把彩雲歌徹斷人腸誰送一􅁓書摺虚說石榴花巳開玉人音信截那時節悶殺人離愁萬種寸心千結前腔歡悅剗地歸來似天仙降下蕊珠宫闕喜􅁫分再整絃斷重接聽說花枝挿在瓶湘􅄕放下些叙離别喜殺人書幃半掩把燈吹滅錦衣香喜的他心兒􅀬怕的他性兒劣便教一句開言不許差迭端詳濟楚又貞潔全無半􅀧假意虚撇更聰明俊雅酒兒中件件淸切洒落風流也竟與人别氷肌玉骨皎然朗澈漿水令想當初相逢狹邪武陵溪短棹輕楫歌聲宛轉髩欹疊近船呼出醉眼乜斜天涯去雲水賖陽臺夢魂空飛越誰承望誰承望到底和恊今日裏今日裏始得寧貼尾聲從今共把山盟設不許負心薄劣這叚情詞留在帕兒上寫冬閨巳刻陳秋碧黑䗫序用蕭豪韻舊名闘寶蟾誤􅀧簡梅花見南枝春信漏泄今宵雪糢糊可堪半壓寒稍飄颻暗香動且浮疎英嫩又嬌正無聊着意看花􅁍又被花相惱前腔清曉眉黛慵描整殘粧無語向花微笑惜花人此時音信寥寥蕭條天寒縞袂薄風輕繡帶飄自今朝一捻腰肢寛掩翠裙多少忒忒令任雪花梅英鬬巧憔悴人暗傷懷抱此情若與天知道離恨比天更高果然是天知道和天也瘦了五􅉆養青山頓老誰收拾滿地瓊瑤蒼􅃼冬暮景舉目總蕭條笑我因花起蚤聽滿耳靈禽喧噪不報些兒喜惹煎熬北風吹面利如刀好姐姐一交黃昏静悄孤另另銀缸相照把燈兒慢挑和衣剛睡着誰驚覺聲寒指冷難成調偷弄飛瓊碧玉簫川撥棹難猜料自來這讀書人心性喬蚤殢上金屋多嬌蚤殢上金屋多嬌頓􅁯了臨卭故交漢相如恩愛薄卓文君緣分少錦衣香瓓珊了錦字詩差錯了瑤琴操􅁫分了交股金帶折了連環套鳳凰􅆪蹀爕玲瓏那得堅牢桃花源上不通潮傷心總是雨葉風條連枝樹近來也生成恨種愁苗魚雁無消耗水濶山高紅絲繫足誰把氷刀􅀟攪漿水令不索把穹蒼禱告一任他􅅖人笑嘲盟香夜夜􅍟天燒憂情未訴意攘心勞從前誓都􅁯􅁍只求眼下他來郅鴛鴦被鴛鴦被重薰麝腦銷金帳銷金帳共飮香醪尾聲愁容等得生歡笑愁甚麽暮冬天道畨成月夕花朝題情巳刻馮二酉黑䗫序用先天韻兩字鴛鴦惹心頭夢裏多少牽纒怪分飛偏憎月下燈前堪憐月圓人不見衾寒夜怎眠悞芳年人隔三秋又蚤寸腸千轉忒忒令比人間紅樓畵船似天上銀河月殿分明咫尺無分緣如隔太行一線秋水盈春山怨怪情丢意淺五􅉆養犯山高水遠恨知音曲中斷絃琴心空有調詩句共誰聮我想桃花人面隔朱門春風轉盻别來虚歲月何處指盟言月上海棠怎得人心乆長不變好姐姐魚雁水沉風㨵書和信雲遮霧罥花飛月冷塵􅀩舊簡篇愁和怨愁深隱隱當心坎怨結悠悠在眼前玉交枝梧桐幾片閙秋風飄零翠軒翻來捲去如相戀動人無限熬煎記月明疎影共留連又霜寒夜瓦驚時變最無聊孤燈影懸最傷心青衫淚濺川撥棹無繇見陽臺上巫峽邊似如今􅀑病纒綿似如今􅀑病纒綿到不如丢開在先偷香手誰見援傅粉心誰與傅尾聲風流孽瘴還不免畢竟是爲他牽纒怎能彀春生庭院把孔雀屏􅃒離恨天惜别未刻王伯良惜奴嬌用眞文韻山抺微雲聽連天畵角聲斷譙門聊停征葢花前共飮離尊難分舊事蓬萊回頭迅見炊烟紛紛盡日漸曛遙指寒鴉數􅀧水遶孤村前腔換頭銷魂此際征人想香囊暗解羅帶輕分靑樓休道贏得薄倖名存傷神此去何時重親近惹啼痕羅襟􅃳惆悵頻又是高城望斷燈火黃昏止二闋無煞離情巳刻沈伯英步步嬌用先天韻别鳳離鸞驚時變新景􅄈新怨雕窗裊篆烟靑瑣虚凉翠幄空展􅁍憶俏嬋娟酬不了當初願江兒水常想西江夜艤畵船芳菲北苑開春宴七換凉州歌喉顫一聲金縷香風轉怕􅍟羞人鶯㷼舊恨從頭十二闌干凭遍園林好昏􅆭􅆭愁城似天遠迢迢長日勝年記一笑春風嬌面燈兒下􅁂雲偏急回首巳􅃼然五􅉆養犯别來想見見月缺多時也有團圓畵堂深窈窕歸翼枉蹁躚怕玉鉤未捲一天愁着誰消遣訴一晌心間事寫一幅斷腸篇月上海棠等一箇􅈐頭􅀌雁回旋川撥棹􅀟眸倦看這􅃩陽時三月天􅍟一杯悶酒尊前􅍟一杯悶酒尊前少一箇人兒在眼前害相思張解元盻神仙歸洞天錦衣香春衫和淚穿猶是伊針線玉簫深夜吹多是君愁怨傲殺槎頭金盤􅀟薦笑他竝蒂兩紅蓮香雲迢逓蝶浪蜂顚縱東風難見怕顚倒風吹花片不與些兒便怎生留戀看看瘦得沈腰一線漿水令煞靜悄垂楊庭院虚􅉆養綠暗紅嫣銀鉤屈曲指駢聯淋漓錦袖細艸鸞箋剛删訂相思傅遲遲月上桃花扇香羅帕䦨珊了舊盟新愿流蘓帳冷落了粉露花烟尾聲愁人怎把閒情遣一恁啼春兩淚懸誰管領春山􅀟翠淺閨情已刻劉東生步步嬌用魚模韻月夕花朝成虚度把往事難憑據東風舊院宇塵滿瑤臺悶扃朱戸六曲畵闌干總是傷情處孝南枝孝順歌􅀜山路信也疎鴛鴦繡衾香也無蟬􅁂爲誰枯蛾眉爲誰蹙只有天知我苦也不揮毫也不聯詩句也不開樽也不歌金縷鎖南枝燈也􅀌人也孤枕又孤月也恨長孤香柳娘嘆離愁幾許嘆離愁幾許勝似大江東去將心比心如何辜負想昔日共笑語想昔日共笑語情似水中魚愛惜如掌中珠我欲待要􅀉書我欲待要􅀉書􅀉與薄情看取淚痕如雨園林好不記得彈絲品竹不記得偎香􅀝玉不記得臨行時囑付不記得醉糢糊不記得臥流蘓江兒水盻殺門前
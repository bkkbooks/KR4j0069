地談天那胸次將翠幙雲屏更設施把錦帳鴛衾重鋪肆說海誓山盟舊日思遂􅀝翠偎紅少年事解合歡帶兒鬆同心結子還記得喘吁吁立不定燈前那一個􅂮仙呂贈妓未刻舊辭􅀧絳唇用江陽韻月戸雲窗翠屏朱幌靑樓上楚楚紅粧國色眞堪賞混江龍鳴珂里巷悄名兒占斷錦排塲歌傳金縷舞按霓裳才貌絕勝蘇小小風流不讓呂雙雙聽嬿婉尊前唱比花解語玉生香油葫蘆杏臉桃腮宫様粧步凌波羅韈涼眞箇是春風一曲杜韋娘覻了這羞花閉月嬌模様識不盡撩雲撥雨虚情況安排下假志誠施逞些巧伎倆包藏着賺郞君掇子弟暪天謊外貌兒甚端詳天下樂兀的不惱亂蘇州刺史腸司空休泛常若是楚襄王見了也勞夢想怎禁他動人情的翠黛長蕩人情的雲髻光那更這透人懷的玉腕香金盞兒靠東墻近西廂隹人才子時相􅅖芳心密意怎相􅁯引惹得崔生頻覓槳逼臨得韓壽暗偷香因此上棲遲風月所留戀雨雲鄕賺尾個中人心上想怕不道年少花容正芳只恐人心不乆長蚤尋取畫閣蘭堂尙兀自鳳去凰翔怎不量回首星星兩􅁂霜少不得月缺也浮雲蔽藏花謝也狂風飄蕩那其間蜂蝶誰賞好春光中呂贈妓未刻蘭楚芳粉蝶兒用家麻韻他生得如月如花蕩湘裙一鈎羅襪寳􅁫橫雲􅁂堆鴉翠睂灣櫻唇小堪描堪畵剛隔着碧窗紗􅀝幃屏繡簾低下醉春風香細裊紫金爐酒頻斟白玉斚銀燈影裏殢人嬌他生得可喜殺殺更性兒宜喜宜嗔便有那閒愁閒悶見了他且休且罷迎仙客傍芝蘭吸露􅂠遊宇宙步􅈣霞我只見窄􅃓􅃓藕芽兒剛半扎踐香塵踏落花淺印在輕沙印一􅍟相思卦紅繡鞋有他時一刻千金高價有他時一生興旺人家有他時村沙的化得不村沙臨風三勸酒􅍟月一烹茶說蓬萊都是假普天樂卽黃梅雨信步到海棠軒閒行至荼䕷架引得些蜂喧蝶攘來往交加粉臉襯桃杏腮雲髻把花枝抹看嬝嬝婷婷花陰下他若是不言語何處尋他他比黃金足色明珠没價美玉無瑕耍孩兒般涉調卽魔合羅透春情說幾句知心話只􅀍你拖逗殺我心猿意馬寒窗寂寞廢琴書苦思量曉夜因他傲風霜分不開連枝樹宜雨露栽培出竝蒂花見一日買幾遍龜兒卦似這般短促促携雲握雨幾時得穩拍拍立計成家二煞捧金盃勸醁醑按銀箏那玉馬似展開幅吳道子觀音畵他那裏倚闌翠袖凝秋水暎日紅裙襯曉霞但見處人驚訝端的是沉魚落鴈閉月羞花一煞咲一面不覺得春自生行一步看得人眼倦花十分愛常帶着三分怕愛的是風流旖旎嬌千種怕的是間阻飄零那半霎天生下一虎口淩波襪堪與那俏子弟寒時煖手村郞君飽後挑牙尾聲與中呂煞尾同若要咱稱了心只除是娶到家學知些柴米油鹽價恁時節悶減愁消受用殺南呂詠遇未刻陳秋碧一枝花用􅄕纎韻嬌滴滴千金玉體輕窄􅃓􅃓半虎羅鞋㜞長挽挽兩彎􅈡黛巧顫巍巍一揑柳腰纎禮數謙謙歌白雪櫻唇艶撥檀槽春笋尖俏儀容㷼㷼堪同美聲價鶯鶯不忝梁州第七那裏有一毫兒破綻端的無半米兒憎嫌溫柔瑩潔絕瑕玷宜嗔宜喜知恥知亷諸餘可愛所事相兼惹得些蜜蜂兒攘動雕簷引得些蝴蝶兒飛近粧奩恨只恨歸去後佩聲兒空館遙聞喜只喜相見時脚步見殘紅半掩愁只愁别離間唾津兒香帕猶粘意懽語甜知音不是恩情欠您蘇􅀸俺􅀟漸暪不過慣打聽風聲阿母嚴步步拘鉗隔尾丢不開放不下難成合繾綣終常念染的重感的深無倒斷相思積漸添有一日軟玉温香許咱贍放下花撲撲繡簾靠着喜孜孜杏臉恁時節方纔把撥雨撩雲意收歛􅀟調秋閨巳刻祝枝山新水令用江陽韻鴛鴦夢斷藕絲鄕晝沉沉水心亭上柳絲牽舊恨花纈鬬新粧立盡斜陽悄無語幾惆悵駐馬聽客路修長一度書來一度想金風蕩􅃞一畨雨過一番涼生前業債甚年償眉尖悶鎖何時放聽誰家砧韻響一聲聲偏搗在愁心上雁兒落好似那無根蓬欠主張漫天絮閒遊蕩逐浮萍任去畱隨風柳多偏向得勝令呀空寫下舊事兩三行故􅁓百千張把些箇諕􅀑瞞神誓番做了唆秦騙趙謊害軟了心腸􅍟人前口强心不强病染膏肓那里醫良藥不良川撥棹一弄兒助淒涼没來繇閒閙攘兩兩寒螿草下堦􅅖也會把離人話講絮聒聒多半响七兄弟他那裏遠方異鄕着我費思量且休提動止渾無恙便些兒破綻有何妨莫輕將美愛都全􅁯呀􅁍思今還念往梅花酒問月在西廂待月在東墻􅍟月在南窗匆匆的秋又來呀迢迢的漏偏長遲遲的夜未央塵􅀩了􅁚牙􅇃火冷了玉爐香零落了錦香囊冷淡了舞衣裳金縷也不成腔金縷也不成腔收江南呀爲誰消痩減容光蛾眉空想畵張郞薄倖繫馬向垂楊知他在那廂知他在那廂高燒銀燭照紅籹離亭宴帶歇揭煞枕邊悄語成虗􅄭從來好事多魔障積儹下恩多怨廣鏡奩兒羞照舊時容袖梢兒不乾今日泪裙腰兒減盡前春様捱徹了孤辰寡宿年再整理殢雨尤雲況跳出了愁城恨􅃠將養的比翼羽毛成醖釀的竝頭花朶就滋培的連理枝條旺忙鋪設翡翠屏重拂綽鮫綃帳滿捧着瓊觥玉觴三秋月儘情看四時花隨意賞春閨巳刻周秋汀新水令用東鍾韻碧桃花外一聲鐘繡衾寒喚四春夢香消金獸冷花落翠屏空雨雨風風攛斷的病兒重駐馬聽帶結頻鬆瘦骨不禁愁冗冗睂峯難縱黛蛾深鎖恨重重瑤臺人遠信勞鴻彩雲聲斷簫閒鳳惡相思千萬種百般難把愁來送雁兒落冷落了春風銅雀宮間阻了夜雨陽臺夢闌珊了停雲燕子樓寂寞了流水桃源洞得勝令單守着四扇矮屏風三尺舊絲桐總費囊中藥全消鏡裏容簾櫳步月無人共花叢尋春誰與同川撥棹我這里恨匆匆晝偏長更又永許多時歌歇梧桐帳冷芙蓉酒盡瑤觥不見了紅圍翠擁望藍橋無路通七弟兄􅍟着這落紅舞風畵欄東怯餘寒􅄕簌金鈎控􅀉閒情琴在錦囊封揾啼痕袖濕瓊珠迸梅花酒減雀徽畵裏容怕曉角昏鐘恨芳艸靑驄怪浪蝶狂蜂秋來呵江上别花落也未相逢又不知吉與凶我只索含着泪告蒼穹陪着笑問靑銅側着耳聽歸鴻緘着口怨東風收江南呀懨懨不比舊時同綠窗針線廢春工殘雲剰雨自西東全無有定踪巫山十二總成空本調煞好姻緣都虗哄惡相思將人磨弄還説甚前生栽種憶所見巳刻毛蓮石夜行船用皆來韻缺月風􅄕碎影篩碧紗厨酒乍醒來雲髩風鬟柳腰花面憶多情恁時安在風入松杏花深處小亭臺猶作夢魂猜東風邂逅逢嬌態麝蘭散滿閒堦羅襪凌波半窄更春衫可體新裁落梅風睂尖上眼挫側先畱下幾分恩愛怕有人知佯不採徐行過玉闌干外胡十八不下懷自驚怪悲間阻想和諧巫山頂楚雲埋雁帖魚書手倦裁一身擔無限愁十日􅁍九畨害塡不滿離恨窩還不了相思債撥不斷細裁劃命合該姻緣頃刻多成敗􅀑病千般强打捱凄凉萬種難擔載幾曽得片時輕快離亭宴煞楚陽臺步步荆榛隘擔閣下兩廂情色相思卷何年結束糊突謎甚日明白傳示你權寧耐切莫把鯫生見責是送煖的意兒虗非􅅮香的性兒歹爲妓白蓮賦巳刻沈青門夜行船用先天韻太乙峯頭玉井蓮等閒移入梁園繡屋􅃒藏錦屏圍護不許路人窺見風入松劉郞心性與花便獨自掌花權高燒銀燭重開宴好風光壓盡桃源􅈣靄輕籠婀娜更月明冷浸嬋娟喬牌兒惜花人正少年共花恣畱戀朱顔相􅍟如花面美姻緣天下鮮雁兒落花香散舞筵花影迷歌扇花輸才子看花許騷人羡得勝令人是惜花仙不吝買花錢痛飮花前醉狂吟花㡳眠天然果遂今生願堪憐還應宿世緣鴛鴦煞名題月老合同劵情畱張珙相思卷山海盟深膠漆心堅暢道是綠嫩紅柔香嬌玉軟兩意相投巳謝􅁍閒鶯燕風月無邊諧老芳聲播楊遠商調秋懷巳刻陳秋碧集賢賔用車􅃒韻憶吹簫玉人何處也今夜病較􅄈些白露冷秋蓮香謝粉牆低皓月光斜止不過暫時間鏡破􅆪折到勝似數十年信斷音絕􅍟西風􅀝樓空自嗟望不斷嶺樹重疊怕的是流光奔去馬雁陣擺長蛇逍遙樂歡娛前夜喜報燈花香生帶結誰承望又蚤離别常記得相靠相偎笑語喋畵堂中那日驕奢受用些尊中綠蟻扇㡳紅牙枕上蝴蝶醋葫蘆我和他初相逢臉帶羞乍交歡心上怯半粧酒醉半粧呆兩下情濃難棄捨鴛衾方􅀬把一枝鳳凰􅆪掂做兩三截么篇我爲他桃着燈將好句裁背着人將心事說直等到碧梧窗外影兒斜惜花心怕將春漏泄蒼苔輕躡露珠常汚了踏青靴么篇我爲他朋情上將謊語兒丢他爲我母親行將嬌様兒者我爲他在家中費盡了巧喉舌他爲我褪湘裙杜鵑花上血我爲他耳輸兒常􅀬他爲我面皮紅羞把扇兒􅃒梧葉兒一箇是相府内懷春女一箇是君門前彈劒客半路里恰逢者剛幾箇千金夜怱喇叭抛去也我怎肯恁隨邪又去把牆花亂折後庭花仙呂夢了些虗飄飄枕上蝶聽了些吉丁當簷外鐵剛纔得合上温郞鏡􅁍又蚤攔廻卓氏車我這里痛傷嗟香消蘭麝望陽臺道路賖靑歌兒同上風亂掃堦前黃葉雲半􅃒柳梢殘月這離恨更比太山轉陡些待桑田重變海枯竭還不了風流業浪裡來煞這愁呵剛不在眼角踅又來到睂上惹恨不的猜三尸肺腑細鐫竭有一日繡幃中玉肌重厮貼我將他指尖來輕揑􅈂說到那樓頭北斗柄兒斜北詞名作雖多而强半不能合譜卽集中所收亦未敢盡稱可法其曲中板眼綠北調向無確載而時俗臆爲増減緩急虗實頗堪反唇今攷之嘯餘諸譜止載名詞而無板法寧弗杜􅁧不敢臆増此則闕疑之意良有以也兹亦不復點板以俟知音者自爲揣摹至如醉花陰端正好􅀧絳唇粉蝶兒一枝花新水令等套則又歌壇素所習聞試細心參酌自得其竅從事絃索者其加諸意焉嶺樵白雪齋􅃟訂樂府吳騷合編卷之四終

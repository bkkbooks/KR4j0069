canonical_identifier: bkk:krp/KR4j0069/SBCK/v1/juan/6
seq: 6
front:
  text: 跋吳騷者何崑曲也曲何以言騷尊其體也是書爲武林張楚叔旭初昆季所輯錄楚叔廣收共成三集旭初嚴覈合幷一編書刻于崇禎十年丁丑分宮實詞體皆側艶又得項南洲爲之刊圖精雅可翫余藏此書垂三十年始欲刊列曲叢而滬戰勃發所儲存涵芬樓諸曲焚熸至二十八種此書幸免刼灰彌自珍惜已固安劉伯峯先生新得此書屬刊入四部叢刊續編於是海上同人命譔斯跋余謂散曲總集莫富于雍熙而莫精于南詞韻選他如南北宮詞紀太霞新奏詞林逸響諸書不過承流接武而已是編稍後出故崑山梁氏吳江沈氏吳縣龍氏山陰王氏諸作采錄至多而嶺樵騷隱二家評語散見各詞後者又皆有所依据如云詞隱新譜者爲沈伯明自晉之南九宮新譜
  hash: sha256:58c8bf00b7b1651cff796cad4567badbc61766db2442551abd984a3fdcc37a8d
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4j0069_SBCK_006-1a}
body:
  text: 也云墨憨齋者爲馮子猶猶龍之南詞譜也云三籟者爲凌初成濛初之南音三籟也諸書不盡傳得此略見一二不亦善乎若夫分析正贈辨訂牌調正板式之􆁚譌考集曲之字句尤較許宇陳所聞等爲詳是爲散曲中盡善之作韻選而外首屈一指矣惟竊有未解者雍熙中南曲大抵皆古南詞爲詞家之瓌寶書中徵引舊詞凡十五篇其出自雍熙者爲羅江怨二曲十様錦字字錦七賢過關各一曲餘皆采自他書此其故何也豈別有深意耶海内賢達能解余之惑乎此又余所日夕企望者矣甲戌七月長洲吳梅
  hash: sha256:189126d3b0f6dddbbf7acfe0a763ae9f0b438e346772146a7a28afe872c74cfc

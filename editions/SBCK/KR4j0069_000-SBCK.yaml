front:
  text: 吳騷合編小序曲之爲義也緣於心曲之微蕩􅃞盤折而幽情躍然故其言語文章别是一色從來稱擅塲者引商刻羽娬􅆺天成每好句入人夢思咀之愈多味之不盡㫖哉其爲曲也然而曲有遇焉作家者流昔以長言單辭舒一時怨愬幸而後來人士起焉玄賞詠其曲恍見其人都雅雍容盈諸口􅊁悠揚欵乃應於肺附作者謌者後先稱兩相知詎非曲之遇歟爾乃遊腔襍拍信口酣闐唫笑溷塲句讀割裂則曲之竆于唱也晚近淺俗見聞側陋且以香奩湮没之詞目爲新裁以詞塲手授之曲謬日附會則曲之竆於觀也甚至終日爭作者誰行而於曲學爲指月或僞摭他人之剰唾而於譜法爲操戈則曲之竆于傳也若夫檀口空餘藥欄寂寞行雲夜冷珠串無聲則曲之竆於景也至使梨棗濫觴傳訛附影塵蒙本色閉嗇新詞則曲之竆于􅃟也責在我輩矣是集也余始博收之今仲弟旭初嚴覈之惟其詞弗計其人課其法斯收其曲非他刻汜汜比也丙子冬杪余病臥無聊因手拈新本閱之快然破悶而師齡姪知音以授諸􅎚越二月􅎚成余喜書其端因撫卷日此於曲苑可謂無遺憾矣崇禎丁丑春仲騷隱居士楚叔

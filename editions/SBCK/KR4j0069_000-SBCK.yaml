body:
  text: 父題於小墨墨居白雪齋􅃟訂樂府吳騷合編目次第四卷仙吕人􅀟調夜行船序翠擁紅􅃒題情周秋汀黑䗫序點簡梅花冬閨陳秋碧兩字鴛鴦題情馮二酉惜奴嬌出抺微雲惜别止二闋王伯良步步嬌月夕花朝閨情劉東生昨夜春歸閨怨舊詞樓閣重重怨别唐伯虎一夜梧桐秋日懷舊梁少白簾控金鈎閨思文衡山暗想當年閨怨元詞半夜蕭疎同胥姬坐雨感舊梁少白沉醉東風海棠花開還未開春閨鄭虚舟嬌鶯兒春寒成陳四時題情各韻計四闋陳秋碧園林好常相􅅖淮南小山贈徐飛􅀸叅禪汪伯玉攤破金字令芳容竝月遇虞山張姬於虎丘作梁少白二犯江兒水減盡了花容月􅃩四時閨怨陳秋碧看姐姐風流聰俊贈石城美人小令梁少白覻着俺娘行清秀贈戴膩兒小令梁少白記得他霧鬟雲􅁂紀情小令周幼海江頭金桂最苦是深閨人靜春閨騒隱生桂花遍南枝前生􅁈債爲顧郎芙初戲筆張旭初附錄譜内新增體并各宮花犯曲小措大暗潮泊岸旅思古調􅃻氷進舫旅思史叔考桂堂東畔懷馬湘蘭梁少白六犯淸音瑣窗人靜宫詞李日􅂠小窗雲重冬閨虞交俞玄陰觱發冬閨何西來􅂠林百種贈魏湘鴻梁少白七犯玲瓏新紅上海裳四時閨情祝枝山凝粧上翠樓閨思楊升菴琳宫驀地逢過陳芳蘭於虎丘作梁少白芙蓉翠館仙再􅀉陳芳蘭梁少白七賢過關雕簷風馬馳代王姬錫山惜别梁少白春風花草香春思元詞九廻腸一從他春思牽掛題情計二闋張伯起􅍟燈兒幾畨思想懷舊計一闋孫百川爲一􅀧香生九畹贈李姬湘蘭一闋史叔考巫山十二峯院落清明左右春日題情梁少白一片情雲引弄友人談夢戲贈沈伯英十二紅伴孤燈曉夜閨情陳秋碧照孤衾閨情林石岡鷄聲兒題情吳載伯冷蕭蕭紀情王玉陽附錄譜外變調漁燈兒没來繇惹相思閨情陸包山從那日冷桃源秋夜懷程文􅀸沈孚中附錄南北間調新水令一春無事爲花愁閨怨祝枝山水沉消盡瑞爐􅈣閨情唐伯虎一聲孤雁送新秋閨情沈靑門半窗殘月夢初醒閨情沈靑門夜窗相􅍟一燈微話舊凌初成附錄北調黃鐘醉花陰窗外芭蕉戰秋雨秋思陳秋碧春困書齋夢初醒春懷舊詞正宫端正好珊枕畔麝蘭香懷舊陳秋碧仙呂􅀧絳唇月戸雲窗贈妓舊詞中呂粉蝶兒如月如花贈美蘭楚芳南呂一枝花嬌滴滴千金玉體輕詠遇陳秋碧􅀟調新水令鴛鴦夢斷藕絲鄕秋閨視枝山碧桃花外一聲鐘春閨周秋汀􅀟調夜行船缺月風􅄕碎影篩憶所見毛蓮石太乙峯頭玉井蓮爲妓白蓮賦沈青門商調集賢賔憶吹簫玉人何處也秋懷陳秋碧吳騒合編卷四目次終

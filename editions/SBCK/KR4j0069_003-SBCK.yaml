紅葉流向阿誰邊黃鶯兒錦瑟倦調絃􅍟春風泣杜鵑開􅄕羞覩雙飛鷰他那裏歌臺夜喧我這裏舞衣晝眠􅁍緣何一宫咫尺温涼變會無年鼎湖龍去除是共登仙前腔粉黛浪三千念當初寵最先爲甚十年不識君王面非君故偏似妾故專而今追悔又難重見會何年翠􅂠雲暗除是共陵園琥珀猫兒墜􅈣橫閣道日落斷傳宣魚鑰隨收金鎖穿花房夜搗守宫鮮天天又蚤是門掩黃昏銀燭空燃前腔君恩浩蕩豈是誤嬋娟自恨孤身多命蹇今生巳矣遠結再生緣天天又蚤是月落烏啼玉漏空傳尾聲傷心過處還消遣自甘受一生微賤聖主從教億萬年代伎謝雙送别瀑泉王孫未刻高深甫二郞神用眞文韻西風緊恨留不住幾摺征㠶此夜人黯黯離愁心上􅃘寒鷄殘月催人似妬我良姻三唱聲沉影一痕報曉窗鵲傳初信驀地裏消魂霎時間天涯海角枕畔平分集賢賔朝烟一帶迷遠村蒹葭露冷江濆無計從君舟楫穩水中夹空惜離羣菱花妬粉任憔悴别來靑髩鱗鴻信五雲高路隔朱門鶯啼序霜花露草遺泪痕甘自眼前承認佃心頭種種恩情怕日後都化做愁根有誰怜三秋永夜弔隻影一鈎殘燼君須憫芙蓉花搖落風塵啄木兒黃鍾慚風月隔笑顰烏鵲盟寒枕簟春漫自喜帶日寒鴉蚤飛􅅖聽雨長門君心去留渾無准妾身死生能相信望眼將傳石上神黃鶯兒芳草戀王孫遍天涯付轉輪你是迷香洞掌鶯花印生平此身知心是君相逢莫作尋常論意兒眞分鞋破鏡憐取眼前人琥珀猫兒墜姻緣兩字空自計朝昏紈扇情多易怨嗔巫山巫峽夢無因溫存怎得箇君能爲雨我作行雲尾聲堪憐柳色章臺嫩莫把這桃花當避秦須索要蚤向春風一問津秋夜病中懷舊有引未刻張旭初病􅀑牽􅆞愁魔竊發況復秋聲聒耳驚搖欲絕之魂春夢勞神痛洒將枯之血腰瞿同沈瘦嘆枯楷之不如􅁂亂􅀋潘絲惜霜􅂠之輕􅀧瞢騰無主事事傷心潦倒難堪沉沉刻骨因借宮商之韻漫排憂鬰之􅂨爰有是作二郞神用蕭豪韻寒衾峭嘆瘦骨棱棱痛怎熬恍惚魂隨天外繞翻來覆去無端幽恨重挑心事偏將心病炒􅀬身軀倍増炮烙惡根苗只落得枕邊紅淚頻抛前腔換韻蕭條沉沉永夜漏傳偏杳况哽咽寒蛩鳴砌草似聲聲啼怨將人暗地吹􅃻悔容易當初彈别調怎怪得牽衣咶噪病根苗添得箇胸前愁塊難消集賢賔參苓徒費奪命膏似水石頻澆笑殺玄霜空自擣記前秋病裏劬勞黃昏淸蚤藥共食親司罏竈相看好笑盈盈道記添衣襖前腔别來夢裏常會着依希光景如昨楊柳樓頭新月小飛碎玉共醉葡萄頻移寒燠轉眼處紅香零落顰與笑􅈫都是黃糧一覺黃鶯兒霪􅀨嘆連宵怪狂颷轉怒號驚掀斗帳寒威􅁀碎琉璃那遭剷瓊枝那朝風波一似今畨惡枉神勞想從來好事强半不堅牢前腔燈滅篆烟銷再吹藜伴寂寥還嫌􅃗影空相弔剜柔腸似刀炙憂心似􅘮飄搖狼藉如衰蓼嘆柔條懨懨殘息偏遇雪霜高琥珀猫兒墜鄰鷄初唱夜色尚迢遙隱隱鐘聲出麗譙幾回睜眼望明朝徒勞推不去剰􅀨殘雲耳畔瀟瀟前腔林梢欲曙宿鳥正離巢歷亂偏從簷際擾朦朧合眼又驚覺焦懆博得箇渾身透濕汗雨如澇尾聲强擡身披衣靠嘆癡情綿纒不了只怕病淺愁深難自保秋閨巳刻吳崑􅅢集賢賔用尤侯韻芭蕉冷落秋夜幽蕭蕭獨抱寒稠欹枕俄驚窗􅀨驟一聲聲惹起閒愁珠抛玉澑幾側耳幾添僝僽空自守這淒楚爲誰擔受黃鶯兒風颺繡􅄕鈎和蕉聲帶􅀨浮夢回幾陣殘更候似蛩聲更啾似砧聲更稠淅零零苦把淒涼奏思悠悠都將别恨收拾上眉頭猫兒墜芭蕉色褪蔭綠減深秋況復輕分彩鳳儔那禁蕭瑟􅀨颼颼合堪憂最苦是長夜如年漏滴譙樓前腔短檠半減應怯照人羞空把明珠暗裏投淋滴滴翠淚雙流合前尾聲西風吹􅀨紗窗透魂斷處香消金獸忽聽鷄聲報曉籌秋怨張伯起改巳刻沈靑門集賢賔用江陽韻梧桐露冷生嫩黃半簷秋浸紗窗玉馬無情頻闘響頓驚開夢裏鴛鴦教人暗想怨只怨西風狂蕩空悒怏怎能彀倩魂重往前腔記别時話兒都是謊好教人暗裏徬徨莫不是信着他人閒論講他那壁廂背後輪鎗難􅃒怎擋俺只有青天在上君細訪枉了人􅈫甚高强黃鶯兒消痩杜韋娘􅃤離情淚兩行幾回怕入芙蓉帳衣殘麝香樓空畵梁愁來暗覺如天様細思量天猶較短不比這愁長前腔砧韻度東墻月中庭漏漸長秋來倍覺􅄈惆悵詩閒錦囊衾閒􅁚床相思暗把濃愁釀最心傷數聲歸雁淒楚過瀟湘琥珀猫兒墜想去秋厮傍醉倚石頭床覻着睂兒畵短長花前携手說高唐蕭郞又不知甚處迷留軟玉温香前腔傾心吐膽􅀶得個假􅆾張有話何人遠􅀉將看今年不似舊行藏參商爲甚的負􅁍初心頓􅃘相􅁯尾聲夢兒裏頻相向還不了生前孽帳爲雨爲雲枉斷腸此曲前四闋散見沈靑門唾窗絨內予兄楚叔托名伯起續而成套誠如貫明月之珠合苕􅂠之璧矣予兄精於曲學凡吳騷舊本所載某某改刻除江東白苧詞外皆其手筆特表而出之以政同調嶺樵附筆秋思巳刻馮海浮集賢賔用魚模韻離愁滿天没處躱下香堦權當騰那離了重幃還較可見牛郞阻隔銀河空躭寂寞眼睜睜一邉一箇他和我百殷的離不了愁窩前腔靑山淺描雙黛鎖向天邉望斷秋波遠樹寒空􅈣淡抹畵睂郞那答兒磨陀靑春擔閣要相逢陽臺一樂無結褁糊突夢當甚麽嘍囉黃鶯兒烏兎轉如梭急煎煎把俺磨一年好景都零落風兒寒奈何雁兒呌怎麽雨絲兒哨的窗兒破冷呵呵香腮紅沁只疑是醉顔酡前腔瘦影伴姮娥呆答孩怎動那幾椿兒慣把人折挫疎刺刺帳羅虚空空被窩慘淒淒長夜捱不過眼强合難禁枕冷又添上淚痕多琥珀猫兒墜雲鬟重整宫様綰靑螺何日粧臺展翠蛾幾時繡榻兩情和因他悄一似倩女離魂病染沉痾前腔扁舟閒繫盡日􅃞金波水冷霜淸舞敗荷江湖滿地一漁簑蹉跎􅁍不道孤負幽
front:
  text: 白雪齋􅃟訂樂府吳騷合編卷之三
  hash: sha256:31aef46e42587b4c8126f1e0ea418221518038876861badeff193066d077503c
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4j0069_SBCK_003-1a}
body:
  text: 騷隱居士􅃟輯半嶺道人刪訂黃鐘四時閨怨巳刻王渼陂絳都春序用車􅃒韻情濃乍别爲多才寸心千里縈結吐膽傾心把海誓山盟曾共設風流空惹下相思業又擔上風花雪月滿懷心事這離思教我對誰分說岀隊子花開花謝又蚤春光輕漏泄紅深綠嫩一似錦屏列觸處繁􅂠都綻徹嬌滴滴海棠花無心去折閙樊樓陽􅀜數曲宫商别鳳簫聲斷楚臺程涉霧鎖黃金闕夢遶秦樓月側楞箏絃斷撲鼕的瓶墜􅆪折咭丁當把菱花碎跌滴滴金尋芳緩步聞鶗鳺柳外黃鸝聲弄舌花飛碎玉呈郊野料東君歸去也傷情慘切悶無言倦將􅄕半揭此情哽咽滚滚楊花似雪畵睂序淸和􅅖隹節㽔館涼生枕簟設奈無情來往戀香蛺蝶逐和風􅀧水蜻蜓池沼內輕浮新葉可惜虗度納涼夜鮫鮹上淚痕啼血浣溪沙犯譜中無此一體不知所本浣溪沙新蟬噪聲哽咽浸氷盤藕絲堆雪羅帕上題詩將心事寫仗南薰傳信也啄木兒不思量舊日氷肌貼不念我枕簟同懽悅玉漏遲不記得同心雙結竟不想爲薄情種瘦怯三叚繡按譜中無此一體不知所本三叚子井梧墜葉到重陽情興别金英萬疉遶東籬丰味絕繡衣郞天香散麝傷秋宋玉悲何切盻征鴻在天外行列煩􅀉􅁍魚書雁帖滴溜子又名雙聲疊韻又名鬪雙鷄紗窗外紗窗外桂魄皎潔銀臺上銀臺上燒燈半滅實鼎餘香猶􅅡西風翠被寒蛩韻切暗數盡譙樓上更籌未徹下小樓嘆嗟花殘月缺挨連宵風雨節姻緣分定受磨折幾度思量欲見爭奈路遠途賖永團圓犯中呂永團圓寒侵繡幄嚴威冽舞鵞毛飄粉蝶逋仙探梅閒游冶暗香來難尋折烹茶謾啜相思擔兒何時歇漸減桃腮頰懨懨瘦怯愁和悶幾時撇閙樊樓寛褪羅裙摺粉黛飄香屑望吾鄕雲鬟亂金鳳拆展轉形憔劣永團圓只恐髩堆雪此調犯體譜中向無明註三籟分列近是今照刻尾聲窗前暗把音書扯罵薄倖弄巧成拙再不把閒情來去惹題情巳刻高􅀷甫綘都春序用車􅃒韻春愁萬結怪終朝睂頭心上堆疊􅀧簡相思共衰柳黄花憔悴也傷秋淚洒楓林血更難脫懨􅆞歲月别離天遠恨湘烟縹渺楚雲空濶出隊子相逢相别屈指光陰如電掣花星喜宿偏照那時節幾句新詩將心事寫平白地慇懃雙魚佩結閙樊樓三星在戸梨花夜繍窗燈暗獸爐香滅犬吠朱門歇人約黃昏絕響叮鼕更漏風淅瀝月冷霜洌悄摩娑􅅖廻廊下躱凹滴滴金猛然一見魂飛越怪寒侵羅袂身似鐵戰兢兢􅋉把羅幃揭膽兒寒心兒怯恩深意切喜香温翠軟方寕貼誓盟共說剰得如今那些畵睂序魂夢遶蝴蝶窗外花陰影搖拽見寒燈一􅀧􅁓窗風射眼中人無影無形心上事難抛難撒爲他常是病兒惹眞個弄巧成拙沙上啄木兒譜中亦無此體浣溪沙情牽掛事磨折絞柔腸幾回寸裂推不去懨煎將愁怨賖驟心車還覆轍啄木兒看窗前不見山回折枕邊淚似江濤㵼咫尺江山將魚雁截三叚繡註前三叚子當初見月待黃昏情意熱如今見月怕黄昏形影孑繡衣郞因他去也一般風景還分别兩邊愁各自空掙拽甚日得有圓無缺滴溜子迢迢夢迢迢夢心帆幾摺悠悠恨悠悠恨愛河巳決天上香車七葉一年一度秋星橋接偏我和他今生斷絕下小樓空接魚書雁帖反教人添哽咽看時只把鞋跟跌料想無繇見者又何勞撥草尋蛇永團圓犯中吕註前永團圓相逢不乆􅋉抛撇嘆佳期成永訣祅神火戮鴛鴦牒泣春風枝上鴃簫聲巳徹彩雲散處琉璃刼往事空饒舌巫陽夢涉臉消紅􅁂飛雪閙樊樓病似相如怯願結韓平穴望吾鄕嘆三生總虗說都是前生孽永團圓羸得淚枯竭尾聲待丢開難割捨只落得情牽意惹心癢空揉似隔靴此詞首闋向刻瑞烟濃而後復訛甚今悉查明改刻較之舊本可謂各得其所矣頗爲稱快麗情巳刻虞竹西畵睂序用蕭豪韻花下見妖嬈彷彿仙姝離蓬島看睂橫翠黛臉暈紅桃步香塵羅襪輕盈歌麗曲鶯聲嬌巧見人未語先含笑朱唇綻破櫻桃黃鶯兒商調楊柳鬭纎腰露春蔥十指嬌琵琶撥盡相思調能詩似薛濤賽江東小喬雙生何必尋蘇小鳳鸞交偎紅倚翠無福也難消集賢賔同上也曽焚香告天把蘭麝燒也曾把詩寫鮫綃也曾向芍藥欄前閒􅃲草也曾在月下吹簫他有文君雅操正遇着相如才調同傾倒相隨趂月夕花朝琥珀猫兒墜同上千金一刻難買是春宵白髮相催人易老貴人頭上不曾饒今朝不如典􅁍鸘裘解下金貂尾聲一團嬌紅迎俏鎭日裏追歡買笑只恐人老花殘空懊惱題情巳刻祝枝山畵睂序用江陽韻一見杜韋娘惱亂蘇州刺史腸似奇花解語軟玉生香彩雲輕舞袖翩韆金縷細歌喉淸亮料應夙世曾爲伴今生裏再得成雙黃鶯兒商調偏愛素羅裳煞娉婷忒恁狂丹靑怎畵得嬌模様行思坐想恩情怎當俏􅁈家牽掛在心兒上細思量一時不見如隔九秋霜集賢賔同上一味至誠非勉强他有鐵石心腸月下星前言不爽我何曾着意關防憑君移放自不許蜂喧蝶嚷秋江上芙蓉花到老含芳琥珀猫兒墜同上合歡未久無柰往他方渭北江東道路長暮雲春樹兩􅃼􅃼悽惶一種相思分做兩處悲傷尾聲歸來依舊同歡賞月下花前再舉觴只怕歲月無情兩髩霜秋日登濲水驛樓感舊有序巳刻梁少白余幼有遊僻毎一興思則奮然高舉癸丑之歲南遊永嘉道經蘭谿徘徊江岸淩麗譙之􅀌聳見塞羽之長征川原迢逓舊會難同雲樹周遭故園不見情來引泣事往會悲因動仲宣之懷敢擬登樓之作畵睂序用齊微韻金風動南國撫景悲秋感疇昔笑年􅂠荏苒似梭輕擲光陰記昨日明朝懽會想去年今夕合倚樓無限􅀜心事都付數聲長笛前腔銀瓶曉空汲金井沉沉斷千尺盻秦臺縹緲暮雲􅃒隔追前恨别雁新聲傳往信離鸞殘翼合前前腔花陰訪踪跡苔徑留痕未收拾想珮環何處畵圖空憶宮腰細帶眼驚鬆香袖冷淚花愁積合前前腔􅂠堂屢經歷咫尺簾櫳限南北翠雲緘封就欲投無􅂩羡當時一霎能逢恨今日萬方難覔合前滴溜子又一體餘註前又不是從前兩人未識更非􅀜别後兩情不一爲甚不知個虛實教人倩着誰問端的未必他心頓􅁯往日鮑老催追思艶質紅榴繡帶餘麝液烏絲小牋留翰墨恨彩鳳單錦鴛孤文鸞隻伯勞東去無儔匹海㷼西飛絶伴侶塞鴻北渡沉消息滴滴金花開錦􅀣芳香襲零落辭枝悔何及東風橫烈春無主將竝蒂分連枝劈今生未必雖然一年花事畢難道明春蜂釀房無􅁡鮑老催江南倦客圖書積來空四壁扁舟遊處經數驛奈一字無兩年别五侯宅􅀌雲天際征鴻急斜陽江上烟波疾怎對􅁍西風立雙聲子昏鴉集昏鴉集白露下丹楓濕寒􅆉喞寒􅆉喞淸霜冷黃花泣書未得書未得歲巳逼歲巳逼似落花飛絮暮秋寒食尾聲花間有日門兒闢月暗房櫳歸處黑把受過淒涼相對悉客懷白雪齋刪改照原刻異文三橋畵睂序用先天韻白露破靑􅈣曙色波光宛如練見蕭條景物易把愁牽家鄕裏空自畱連山水興總難消遣滿懷無限淒涼處芙蓉冷落誰憐黃鶯兒商調茅舍兩三間􅅖危橋淺水邊蓬窗獨􅀝空長嘆寒江接天寒山影懸征人怕覩孤飛雁悄無言驪歌在耳不覺又經年集賢賔同上層巒萬疉如翠纒飛泉瀉石涓涓蕭寺疎鐘人漸遠頃刻間行過前川遙聞籬犬幾度把靑帘頻盻灣再轉凝望處白雲千片琥珀猫兒墜同上碧灘風冷紅樹咽啼鵑似寫長途離恨篇巫山夢斷雨雲閒無緣甚日得重回舊家庭院尾聲異鄕風景都嘗遍回首教人思慘然怎能彀歸夢剛剛到枕前秋思譜張宗瑞疎􅄕淡月詞沈伯英降黃龍用齊微韻雨細堦墀滴向梧桐被風驚碎􅃳逼衣篝線裊金罏殢人沈水天涯優游歲月一分秋一分憔悴紫簫吹魚牋恨斷夜寒鴻起前腔換頭淒淒客裏思歸草閣圍靑竹溪空翠西風落葉吹老人間幾畨塵世棲遲江湖諳盡聽商歌魂消千里醉休提疎簾淡月照人無寐止二闋無煞題情巳刻杜圻山啄木兒用尤侯韻從别後淚暗流心上人兒怎捨丢想前生宿世曾修幸今生得會鸞儔指望如魚似水恩情厚天長地乆相厮守豈料分薄緣慳不到頭前腔悶中悶愁上愁自古情濃終不乆病懨懨着甚來繇痩怯怯愁鎖睂頭記當初共設神前呪如今一旦成虗謬只聽得燕送春歸語畵樓三叚子靜中自躊張郞眉爲伊常皺悶中自求沈郞腰因他消瘦相思病要妥無能勾陽臺夢重會無繇就回首巫山雲雨收滴澑子恩情美恩情美畨爲怨尤風雲態風雲態變成禍讐有日姻緣重偶相思一筆勾仍諧鳳友再訂前盟願天長地久尾聲相逢再把􅂨腸剖往日相思付水流怎能勾永效鶼鶼同白首詠幽閨女郞巳刻梁少白啄木兒用家麻韻誰家女兩髻丫滿臉嬌羞將破􅆶聽淸聲如柳外雛鸎覻香鬟似日暮寒鴉􅃟良姻不便輕婚嫁守淸規常自甘孤寡好似一朶蔵風葉底花賣花聲羽調此曲卽浪淘沙與越調者不同獨閉房櫳有誰歡狎伴侶相邀暫同戲要繡鞋剛三寸些兒太細腰身捻就無一把避東風􅄕多下歸仙洞羽調步花徑欄檻狹防人覻常驚諕荆棘抓裙靫倒閃在荼􅐘架勾引得嫩枝吚啞討歸路尋空罅仗舊家巢燕引入窗紗闌干外花正開見景無心對鏡臺下蒼苔柳態輕盈趂綠陰蓮步徘徊探身折朶花兒戴薔薇􅎲得烏雲解笑倩才郞挿鳳􅁫三叚子流鶯弄􅆾踏紅英落來滿堦狂蜂浪猜撲香風飛來滿懷春光九十應難再深深笑把東皇拜切莫使風雨無情打陣排前腔幽閒小齋喜佳人飛來楚臺妖嬈俊才怕羞花半􅃒粉腮眼前現有觀音在人生何必超三界端的是一刻能消萬刼灾歸朝歡花陰下花陰下香肩竝挨頓􅁯了有拘束腰間的令宰今生裏今生裏良緣蚤諧勝跳出無境岸沉身的宦海黃昏皓月凭闌待滿身香露霑淸彩只要的斗轉星移睡去來不用尾聲􅀉金姬未刻王伯良啄木兒用江陽韻相思債不耐償又爲娘行成技癢記年時挈伴尋春猛然間馬到驚香綠楊轉西深深巷紅樓數間靑天上此是行雲小洞房前腔天生俏新様粧絲作情緣花作想又誰知片語相投一時間綰住柔腸鎖窗夜長芙蓉帳金塘水深鴛鴦舫春去秋來幾作狂三叚子笑他擾攘是誰教蜂喧蝶􅋉替他忖量這些時風邊雨􅅖有情自來多磨障好花怎保春無恙埋没風流眞個是枉歸朝歡紅衫上紅衫上淚痕幾行磣可可心香入想羅巾內羅巾内繡鞋一雙曲彎彎當蓮花在掌問雪衣何日金籠放武陵溪偏是多風浪一字燈前一斷腸無尾閨情白雪齋藏本與坊刻稍異劉東生畵睂上海棠用庚青韻鸚鵡報春晴汗濕酥胸夢初酲把􅄕鈎輕捲散步閒行畱不住幾樹花香踏不折一枝梅影月上海棠形孤另可惜辜負新春懶裁雙勝錦堂月雙調晝錦堂心驚荳􅞦微生丁香暗結教人覩物傷情懊恨東君把三分春色飄零月上海棠二分付流水浮萍一分襯馬蹄芳徑傷春病因此上閒􅁍花鈿慵整集賢聽黃鶯商調集賢賔殷勤把酒多至誠勸東君須要長情明歲重來期巳訂到不如就此畱停同歡同慶免秋到碧梧金井黃鶯兒再叮嚀留春不住相送過洛陽城黃鶯帶一封同上黃鶯兒回首悶無憑托香腮涙暗傾見雕梁新㷼常相竝這㷼兒幾聲那㷼兒數聲他把春愁說盡難回應一封書冷清清倚圍屏交頸鴛鴦繡不成一封羅仙吕一封書紅光溜小亭蘸胭脂春草青欲待尋芳穿曲徑又恐踏碎殘紅不敢行皁羅袍惜春良計誰來助情惜花怨苦誰來辨明悄無言立盡鞦韆影皁羅歌同上皁羅袍墻外趷的趷蹬是誰家公子策馬閒行金九花下打流鶯偷香手叚原端正排歌君無意妾有情隔墻空自眼睜睜看不見恨轉増夕陽揮泪杜鵑聲甘州解酲同上八聲甘州東方月又明辦盟香金鼎下拜䖍誠姮娥缺處幾時得許我圓成解三酲淸光照人􅀌另影羞覩牛郞織女星驀然聽是誰家庭院銀甲彈箏解酲姐姐同上解三
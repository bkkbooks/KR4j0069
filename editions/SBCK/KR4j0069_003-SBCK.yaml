琴罷􅁍求凰奏可正是紅葉誰人􅀉御溝陽臺夢杳苦追踪問跡似無還有解三酲仙吕俗以醒誤忘不了共携纎手忘不了西園秉燭遊忘不了同心帶結鴛鴦扣忘不了羅襪雙鈎忘不了香囊雜彩新挑繡忘不了百寳珍珠絡臂鞲閒窮䆒把嬌懽美愛盡付東流尾聲好姻緣還成就繡幃錦帳傚綢繆月底新詩再和酬惜别巳刻曹含齋金梧桐用蕭豪韻相思借酒消酒醒相思到月夕花朝容易傷懷抱懨懨病轉深未審他知道要得重生除是他醫療他行自有靈丹藥東甌令南吕情山遠意波遙咫尺粧樓天􅃞高月圓苦被陰雲􅇁偏不把離愁照玉人何處教吹簫辜負了這良宵浣溪沙同上我自招隨人笑自古來好物難牢我做了謁漿崔護違前約採藥劉郞没下梢心懊惱再休想畵堂中綺筵前夜將紅燭高燒尾聲我青春他年少玉簫终乆遇韋臯萬苦千辛休忘了冬日閨情王百榖改巳刻陳秋碧金梧桐用魚摸韻漫漫瑞雪鋪密密彤雲布兩兩漁簑粧􅀧江天暮慚無謝女才空想梁園賦學弄梅粧又恐天孫妬無言半晌深扄戸東甌令南吕思前事想當􅀄有個人兒對擁爐雲屏霧障重重護􅁍易把流年度如今人去影兒孤教我怎支吾劉潑㡌同上見白鷴皓鶴失鮮素雲靉靆雪蚤模糊攔截遊子歸來路折柳亭埋緊凍合停橈渡奈子花同上金鳬冷水漬氷壺空閒􅁍錦繡氍毹闌􅃢鍱零落流蘇愁糊突夢中難遇吞吐問前盟半􅀧虗無浣溪沙同上風月招姻緣簿到如今一筆消磨癡心倩女成躭誤薄倖相如下狠毒心正苦恠兩個寒禽兒向梅稍頻頻厮喚相呼金錢花同上拈來彩筆生疎寫就雪蕉畵圖把病容愁臉細臨摹􅀉與君怕君難覩崔家女不是舊規模尾聲晚來時添淒楚嘶馬橋邊雪滿湖正是夫戍蕭關妾在吳冬閨之曲詞林最乏善調而秋碧作者凡幾牢騷淒切俱屬可傳韻􅃟無劉潑㡌奈子花金錢花三曲今照舊稿増入卽一二句法未合亦不足爲全瑜之玷也騷隱相思曲翻北詞未刻沈伯明金梧桐用江陽韻相思本自雙未必雙思想兩下難憑與相字兒渾無當他情有盡頭俺意難丢放獨自牽思這單字應非謊單相思另是一箇相思様東甌令南吕單憔悴自淒惶怎把單字兒連相厮混講只爲多情打不破情兒障加一字在相思上替他思想爲他􅋉又似各牽腸大勝樂同上牽腸處還自斟量這相思何必兩果然咱想他亦想只當􅁍兩相􅁯偏是箇落花􅀧􅀧他自飄殘浪方顯得流水潺潺我只汎舊香思之惚恍須索把無情有意總付愁鄕解三酲仙吕他想我似鏡中留像我想他似藕㫁絲長他笑我恁懸懸倒􅀍生撇􅃞我笑他也禁不得夢魂􅅖只道是將咱留戀我便不繫腸倒不如撒地丢開教我越慘傷心搖蕩絶勝似相思淚洒兩地汪汪尾聲轉愁煩􅄈悒怏焉知不想殺那邊廂又道我無心向你行携孫姬雁來繡鞋有序巳刻馮千秋㷼姬孫月小字雁來棋酒娛人琴書自樂時人共傾其佳麗夙昔自負乎情癡弱足纎腰是吳門之趙女淸歌妙舞眞北方之佳人予落魄詞塲偶浪遊麗館解我紉蘭之佩􅀼彼綠絲之屩戲咏新詞聊以慰牢騷云爾金梧桐春風蘇小家夜月徐卿榻携得春歸香惹鮫鮹帕似奇葩瓣欲飄半月光初發白彀輕緗底様些兒大千金一􅑃眞非假東甌令南吕心兒念口兒誇􅋉裏偷看分外佳鳳頭啣出珠兒滑滿繡猶如畵芳蘭一朶襯梅花綠蕚映紅霞大勝樂同上向燈前影弄窗紗道成雙還是假記前朝竝立紅裙下似一對牡丹芽抵多少芙蓉帳底鈎春話揚柳樽前舞玉珈到手非容易也且虗空摹擬權當杯斚解三酲仙吕料他們春眠􅂊罷把香衾仔細搜查江南枕上雖行踏些箇事落誰家怎知我留香賺玉剛多霎翻做􅃗影􅀌鸞路巳賖情無那守着他半絲紅線兩處波查尾聲明晨再續花前話依舊雙飛在碧沙權守今宵一夜寡傷秋巳刻許彦輔金梧桐用尤侯韻堪悲宋玉秋秋老梧桐瘦月滿疎林又是黃昏後砧聲幾處牧敗葉敲南牖雁唳鴉驚颯颯寒風透人兒不見空僝僽東甌令南吕捱更漏數更籌􅁓帳梅花相厮守蛩吟四壁聲偏驟呌出箇愁時候支床不寐思悠悠無語擁衾禂大勝樂南呂憶當初邂逅綢繆在花間携素手尋芳拾翠消白晝閒鬬草戲藏鈎只指望朝朝暮暮陽臺右誰知道前世燒香􅀧㫁頭天涯人遠似銀河阻隔織女牽牛解三酲仙吕想着恁龎兒依舊想着您那聲咳􅎳想着您燈見前鬆􅁍鴛鴦扣想着您欹枕凝眸想着您睂彎雙蹙頻頻皺想着您􅁂軃雲鬟一叚羞愁還又兀的是雲消楚館夢㫁秦樓尾聲洛陽花章臺柳想殺人卿卿知否何日把兩字相思一筆勾春思墨憨齋改刻古調梧桐樹用皆來韻繁􅂠滿目開錦􅀍空閒在劣性􅁈家悞得人忒毒害前生少欠今生債不了相思教人禁害廢寢􅁯餐􅀝定着門兒待房櫳靜悄如何捱東甌令南吕詩慵就謎難猜一别三春音信􅆾多應他那裏貪歡愛忘􅁍個人兒在空勞魂夢到陽臺展轉惱情懷大勝樂同上把一牀絃索塵埋兩睂峯不展開香肌痩損愁無奈懶刺繡􅅖粧臺鶯期燕約今都懈蝶使蜂媒不再來臨鸞鏡也照得我朱顔未改郞意先改解三酲仙吕頓􅁯了誓山盟海頓􅁯了眼去睂來同生同􅂮言猶在抛􅀬語臉相挨頓忘了盈盈笑解香羅帶頓忘了緊緊雙勾紅繡鞋今難再便􅅖人聽了珠淚盈腮尾聲把局兒牢鋪擺思君不久便歸來美滿前程百歲諧春日題情巳刻梅禹金梧桐樹用魚模韻鶯啼柳外聲燕遶梁間語萬紫千紅水面飄香絮凭欄細把花期數九十春光一􅀧知何處一寸柔腸萬縷還千緒那堪幾陣無情雨東甌令南吕天涯路老蘼蕪舊日王孫歸去途吳歌越吹靑樓暮多少銷魂處東風無力倩誰扶羞傅粉怨調朱皁羅袍仙吕冷落綠窗朱戸漸凋零紫陌寶馬香車荼䕷香霧怯羅襦桃花歌扇閒金縷一􅄕春夢偏驚杜宇􅀌幃冷落誰堪伴侣芳心似共春無主尾聲把歡娛休孤負只待滿身花影倩人扶醉倒黃公舊酒壚懷􅂠亭秋水作巳刻梁少白金絡索用先天韻金梧桐瑤臺一綘仙原住朝雲殿嬝娜腰肢秋水雙眸剪塵緣未掃除東甌令思牽􅆞謫向人間十八年暫辭王母離眞境針線箱􅂓逐東風上舞筵解三醒垂楊線懶畵睂睂兒葉葉更堪憐􅀉生子爲傷春怕立􅄕邊蚤落盡桃花片五更轉南吕羡畵梁棲雙㷼奈姻親獨未完檀郞慢自慢自多畱戀好事蹉跎光陰如箭念往回空逗畱無方便蒼天甚日從人願月轉廻廊夜香庭院簇御林今迢逓路幾千笑花神未有權任風開落飄蒼蘚但芳心至死香不變恨綿綿幾多心事都付十三絃琥珀猫兒墜那人何處消渴在文園羸得文君眼望穿陰雲終散月終圓嬋娟須有日飛向蓬萊還寤生前尾聲淸宵白晝難消遣含羞未敢向人言只恐靑樓作話傳四時閨情巳刻常樓居金絡索用家麻韻金梧桐東風轉歲􅂠院院燒燈罷陌上淸明看細雨紛紛下天涯蕩子心東甌令盡思家只見人歸不見他合歡未乆難抛舍針線箱追悔從前一念差解三酲傷情處懶畵睂懨懨獨坐小窗紗􅀉生子只見片片桃花陣陣楊花飛過了鞦韆架前腔用先天韻楊花亂滚綿蕉葉初成扇翠葢紅衣出水新蓮現金爐一縷微􅅡沉􅈣睡起紗厨雲髻偏無端好夢誰驚破風外鶯聲柳外蟬羞臨鏡千愁萬恨對誰言只見舊恨睂尖新淚腮邊界破殘粧面前腔用尤侯韻閒堦細雨收翠幙新涼透衰柳殘荷正値愁時候近來都減􅁍舊風流爭奈新愁接舊愁白雲望斷天涯遠人在天涯無盡頭相思病無明徹夜幾時休只見雁過南樓月下西樓人比黃花痩前腔用東鐘韻銀臺綘蠟籠翠幄金鈎控錦帳紅爐獨自無人共月明初轉過小房櫳不放淸光照病容愁聽畵角聲三弄吹落梅花一夜風􅀜山夢魚沉雁杳信難通孤眠人最怕隆冬正值嚴冬做不就鴛鴦夢代吕姬霏茵賦别改刻騷隱生金絡索用先天韻金梧桐郵亭繫赤騶别酒頻斟勸執手叮嚀兩下相畱戀思君萬種情東甌令憶君言滿望生死皈依共百年被孽風吹散于飛翼針線箱鋼鏟分開竝蒂蓮解三酲天涯遠懶畵睂那堪繡被冷紅鴛􅀉生子從今後衰草平川何處把行踪盻前腔同前韻人離在眼前别恨和心纒剰雨殘雲都是相思劵歸期在那些待君旋莫使深閨望眼穿恠一鞭鞍馬驚幽夢何處鱗鴻覔錦箋空悲怨非君分淺是妾無緣從今後翠冷花鈿更香燼黃金篆前腔用寒山韻斜暉映落霞野樹連秋漢颯颯金風生拆雙飛雁觸處可憐人滯君難打迭離魂逐去鞍奈半肩行李重催促一曲驪歌唱欲䦨愁無限淮陰匹馬甚時還從今後夢裏巫山只落得空牽絆前腔同前韻寒衣贈白裘别語盟靑案無限離情叮囑千千萬􅏰􅏰淚眼看背君彈想去後思君病漸怕春深花落重門悄夜永蘭膏照影單空長嘆相看心事一般般從今後痩損朱顔甚日得重歡宴􅀉别未刻龍子猶金絡索用江陽韻金梧桐曾叨金屋光自小章臺養學得靑謳聲繞芙蓉帳連環輕解開東甌令做野鴛鴦惆悵東風没主張抵多少夢回王謝堂前燕針線箱抵多少魂逐臨卭弦􅁲凰解三酲無名網懶畵睂背人深處儘思量􅀉生子正是舊恨難􅁯新恨難降亂滚滚桃花浪前腔劉郞續阮郞濮上兼梁上風月塲頭自把年華誑流光似水花眼前􅋉滋味靑樓也算嘗也有个千金難買燈前笑也有个一面能牽去後腸空勞攘離亭羞贈舊時香這是前世餘殃今世承當折罰在平康巷前腔五陵裘馬狂七步才􅂠廣那富貴風流浪宕终難仰當時遇可人在金閶海水難將升斗量俊眸慙妾非紅拂俠骨知君似李郞把眞情講十年脂粉付滄浪􅁍不道柳折須長花採須芳這緊慢教人望前腔春郊女伴將月夜遊人訪怯舞辭歌覿面渾如强孤燈夜永時自徬徨覔得甜桃懶去甞情癡妾似離魂女負義君非李十郞頻來往相思病種入膏盲只怕今日西廂明日東墻蚤晚無的當宛轉歌原注云譜所載末云一聲聲呌得淒涼愁鎖在睂尖上本只二句卽琵琶記空爭着閒是閒非祗落得垂雙淚亦二句也唱者郤増偏要爭閒是閒非句陋甚而時曲只見片片桃花陣陣楊花浣紗記那時節異國飄零音信難憑俱用三句不知何據譜分註􅀉生子而􅀉生子本調竟缺今從俗終爲未安尚須查正子猶識招夢未刻沈伯英金甌線解酲用戈歌韻金梧桐相思没奈何離恨難消破欲倩遊魂入夢尋則箇當初苦憶他東甌令眼難合但合眼依稀得見多如今夢裏也潜逃躱針線廂怨殺那不做美無情狠睡魔解三酲把芳魂鎖慣呵雲叱雨特地張羅浣溪樂南吕浣溪沙你曽送神女來高唐左與襄王結就絲蘿偏生把我多摧挫􅀡恁地書生緣分薄大勝樂如何是可把降魔寶劒暗裡摩挲春太平宜春令我心􅂊動他􅁍笑呵道何須煩君太阿你自體疲力倦赤繩枉向君邊過假饒他倩女離魂也搖不動你希夷高臥醉太平但得你少眠一和須教送與㣲步淩波奈子落瑣窗奈子花謝尊神呼醒南柯奈狂生才愧東阿洛神擬賦愁懷無那閣筆處涙珠雙墮瑣窗寒儘教收入變聲歌做成一串珠顆尾聲酒在樽茶畱火不醒不醉睡温和不信芳魂不見過三籟止載浣溪沙春太平二曲於宜春令套曲之後謂二曲偶從譜末帙中得之得句頗俊苦無全套收之然與驀忽地一套筆致如出一手故附錄於此不知此亦詞隱先生筆刻情癡䆿語中三籟能辨之似非門外漢矣子猶先生筆按商性屬金於令屬秋故昔人謂此調貴乎悲傷宛轉良有以也夫傷離冩恨自餘感悼情有固然但其間必有一種眞正蕭瑟寂歷之氣淒楚動人庻乎近是本調名筆繁多懸此以爲􅃟的遺珠錯落更俟續收嶺樵漫筆雙調夜思巳刻陳海樵鎖南枝用庚青韻黃昏後鼓一更知君讀易臨小亭燈火隔􅄕明人聲四隣靜停樽待掃徑迎猛可的月移花渾疑是君影前腔用魚模韻天街靜二鼔餘思君此時猶讀書庭草未曽除囊螢燦如許門雙掩榻半虗猛可的竹生風長疑是君語前腔用先天韻三更轉夜半天知君此時猶未眠鐵馬􅅖風傳銀河繞簷轉臨􅇃畔當案前試展􅀉來書渾如對君面前腔用東鐘韻譙樓鼓剛四咚思君不來尊巳空鬼病害得我帶圍鬆佳期數得我指頭痛燈初暗睡正濃可喜的共君眠原來是一夢前腔用齊微韻殘更㫁星斗稀思君出門來也未隔水一鷄啼喧林亂鴉起人將至喜上睂休問我夜來情但看我枕邊淚題東未刻龍子猶鎖南枝用支思韻曽留下柬帖兒千恩萬愛彼一時恨不得把全副肝花嘔向這幾箇鴛鴦字就是鐵人見心也慈害相思都爲此前腔換頭將他謹藏笥不許他人瞷我私毎遇悶時開看只當一度相逢一度懽娛事强婚帖賽誓詞再不消費第二張􅁓前腔燭流淚􅁞掛絲只道恩情到底常似兹誰知日乆見人心漸漸不如始雖柬帖時有之比當初渾不似前腔換頭當初血瀝瀝幾行字如今虚飄飄一片詞他的話比先前加美細勘眞情百分無一二一塲好枉被􅅓情願抱當初柬帖兒死金閶紀遇有序未刻龍子猶白氏爲花館名家而來姬尤後來之最秀東山許元爕則其破􅀲之交也元爕作金閶紀遇傳自詫奇緣余譜爲新詞傳諸好事來姬字掌珍葢元爕所贈云珠性圓走而掌又有翻覆之義元爕愼守寶矣佳人再難得其勿效章臺柳往事哉錦堂月用庚靑韻晝錦堂花滿金庭春深玉柱誰爭五湖􅈣景生長繁􅂠風流少年馳騁月上海棠􅄃蘇臺西苧餘香咏銅雀東風司令頻追省休得要秋到傷春老來索鏡堂上集賢賔晝錦堂換頭寂靜淨几明窗翻今閱古别有酒狂詩興天上人間除非草木無情月上海棠鳳尾草也解榮枯連理木偏能齊整集賢賔倘藍橋幸玉杵價豈辭高等集賢賔商調下三曲同偶春花鳥來使星問秦淮柳色誰青屈指尋常桃與杏但無雙不産金陵自有􅈣花首領論小字夜來厮稱他都是靈秀禀就是珠十斛也買不出這娉婷集賢聽黃鶯集賢賔盈盈二七方待齡似荳􅞦香凝妙舞淸歌都絕頂更步打塲中超乗琴棋井井凡百技諸般佳品黄鶯兒小妖精豪門巨室歡喜竟何曾黃鶯兒金屋乆聞名信還疑喜又驚白家蠻素剛同姓泛扁舟幾程歷􅈣波幾汀恨金閶不比天涯近到蓬瀛閒花怎惹許自有飛瓊黃鶯帶一封黃鶯兒我是黃卷課靑燈暫偷閒訪玉京奈娘行做出喬行徑眼兒望得盲脚兒站得疼等閒的未許通殷聘一封書鏡中形谷中聲三復關雎心未平一封書仙吕下六曲同終宵自飮氷把䖍誠感巨靈重來到錦營覩光輝百倍榮畵閣深深頻􅃱請萬喚千呼不肯行似蘭馨似珠明捧出雕盤眞水晶一封羅一封書羞答答臉頳悄低頭􅀝畵屏梨花一枝春帶雨縱飛㷼新粧不恁爭皁羅袍金􅁫十二端詳可憎靑樓十二􅉆他使令從前春夢到此安排定皁羅袍珍重娘行伸敬這姻緣天大怎教我造次應承他是玉皇殿上校書丞怕書生福淺難僥倖欲行還往可喜香浮酒淸欲畱還去可憐好事未成把佳期來日從容訂皁羅歌皁羅袍意馬心猿紛競悔登時腼腆推調紅䋲􅀝閭人望得眼睜睜一封書怎敢違尊命排歌畱無計蚤恨轉増長條攀折巳無憑人難再城可傾香衾覆枕闘心兵甘州歌八聲甘州高唐神有靈借巫雲一片教他野渡舟横十分不穩穩的是􅃗形孤影魂顚夢倒神未寕忽聽得雨驟風狂閙五更排歌披衣起合掌聽千聲方便謝神明想是明河㵼洛木升從天降下美前程甘州解酲甘州歌靑鵶喜笑迎儘東山􅄚齒􅁯􅁍伶俜時來心肯不惜買花錢贈傾囊聊表􅁫鈿情肆席重陳山海盟解三酲雙雙竝對氤氲使者禮拜通誠解三酲唱一曲今宵歡慶把前身認做鶯鶯畵堂中萬福聲相應杯到處巳酩酊今日裏花燭洞房把嬌客稱賽過那玉殿爐傳金㮄登魂消賸看不盡温柔窈窕向燈下停睛解酲姐姐此調及下二犯曲皆譜中不載解三酲只爲兒女情長憐夜短縱有歌舞如雲無暇評惜花人耳畔私央倩一句句巳應承正蘭湯試浴看他雲髻傾又蚤攅簇蛾睂愁未經好姐姐妾薄命一􅀧在素綃君親證墮落風塵忒煞輕好姐姐仙呂入􅀟調宛轉鴛鴦交頸有的是惜玉憐香權柄霎時到手勸君聊住停昏還醒千金不換須􅁷頃魂遶陽臺第幾層姐姐撥棹好姐姐自慙這麗質怎勝從此後心腸難硬俺和伊情分一似海様盈川撥棹甚日得雙鸞共乗願今朝天慢睛願天天且莫明撥棹入僥僥川撥棹蚤聽得疎鐘遠寺鳴見窗􅂩㣲光枕畔呈淚斑兒兀自熒熒涙斑兒兀自熒熒僥僥令只見他星眼朦朧餘羞態又見他鬂縱橫倍可矜僥僥令雙調風流原有種今日總輸卿一任風波休輕散須記着賀新郞第一聲尾聲貪花採得花中聖五湖年少不虗生喚作明珠掌上擎雙調徤㨗激裊蓋如文章家之以筋力勝而不欲其以浮靡見長者也聲音之道可想見焉本調名目有限詞亦如之不能僃美中如子猶先生金閶紀遇一套似亦賣弄家私而故爲破格鋪排者如以尋常章法律之殊非作者之意而亦非􅃟者之心矣原評錄後嶺樵附識凡紀事之詞全要節次清楚而過脉絶無痕迹如太史公伯夷屈原等傳以事實議論相御而行其叙事又須明顯使人一覧而知方妙此是子猶勝塲硯齋主人原評白雪齋􅃟訂樂府吳騷合編卷之三終

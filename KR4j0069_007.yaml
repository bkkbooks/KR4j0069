body:
  text: 填詞訓古士大夫聽琴瑟之音弗離於前性情之通絃歌而治吟詠可巳歟客日詞餘之興也多以情癖大抵皆深閨永巷春傷秋怨之語豈鬚睂學士所宜有況文辭之貴期於渾涵若夫雕心琢句柔脆纎巧披靡淫蕩非鼓吹之盛事曲固可廢也騷隱生日嘻子陋矣尼山説詩不廢鄭衛聖世采風必及下里古之亂天下者必起於情種先壞而慘刻不衷之禍興使人而有情則士愛其緣女守其介而天下治矣且子亦知夫曲之道乎心之精微人不可知靈竅隱深忽忽欲動名日心曲曲也者逹其心而為言者也思致貴於綿渺辭語貴於迫切長門之詠宜於官樣而帶岑寂香閨之語宜于暗藏而饒綺麗倚門嚬笑之聲務求纎媚而顧盻生姿學士騷人之賦須期慷慨而嘯歌不俗故詠春花勿牽秋月吟朝雨莫溷夜潮瑤臺玉砌要知雪部之套辭芳草輕煙總是郊原之泛句又如命題雜詠而直道本色則何取于寓言觸物興懷而雜景揣摹則安在其即事甚且士女之吻無辨暌合之意多乖文情斷續而忽入俚言筆致拗違而生吞成語又曲之最病者也乃若傳竒之曲與散套異傳竒有答白可以轉換而清曲則一線到底傳竒有介頭可以變調而清曲則一韻到底人苐知傳竒中有嬉笑怒罵而不知散曲中亦有離合悲歡古傷逝惜别之詞一披咏之愀然欲淚者其情真也故曲不貴托實而貴流麗不貴尖酸而貴博雅不貴剽襲而貴冶創不貴熟爛而貴新生不貴文飾而貴真率肖吻不貴平敷而貴選句走險有作者起必首肯吾言矣客日子之為辭未必其無弊也乃執月旦以平章曲府司三寸管而低昻之得無過當乎居士日人之妍􅑦人也不必其巳之妍也雙眸具在存其論而巳矣今日者之評次雖謂作家之豸史亦誰日不可作家偶評騷賦者三百篇之變也騷賦難入樂而後有古樂府古樂府不入俗而後以唐絶句為樂府絶句少宛轉而後有詞自金元入中國所用胡樂嘈雜緩急之間詞不能按乃更為新聲以媚之作家如貫酸齋馬東籬輩咸富于學兼喜聲律擅一代之長昔稱宋詞元曲非虛語也大江以北漸染胡語而東南之士稍稍變體别為南曲高則成氏赤幟一時以後南詞漸廣二家鼎峙大抵北主徑切雄壯南主淸峭柔脆北字多而調促促處見筋南字少而調緩緩處見眼各有三昧難以淺窺譬之同一師承而頓漸分受不可同日語也乃製曲者往往南襲北辭殊為可笑今麗曲之最勝者以王實甫西廂壓卷日華翻之為南時論頗弗取不知其翻變之巧頓能洗盡北習調協自然筆墨中之罏冶非人官所易及也國初作者王子一輩十六人僅傳其名詞未及見後起如楊升菴頗有才情所著有洞天玄記陶情樂府流膾人口但楊本蜀人調不甚諧而摘句多佳楊夫人亦饒才學最佳者如黃鶯兒積兩釀輕寒一曲字字絶佳楊别和三詞俱不能勝固奇品也北人如王渼陂康􅍟山翩翩隹致其後推山東李伯華伯華以傍粧臺百闋為􅍟山所欣賞今其詞尚在不足道所為寶劒登壇記亦是改其鄉先輩之作固自平平而自負不淺弇州嘗譏其腔律未協非苛求也大聲金陵將家子所為散套尚多借襲而才情亦淺然句字流麗可入絃索如三弄梅花一闋頗稱作家固知好句不在多得王舜耕西樓樂府較為警健題贈亦善調謔而少風人之學士氣故伯起重之伯起之撰紅拂潔秀俊美但不無輕弱之嫌陸南門散詞有一二可觀語亦雋爽先輩如李空同王浚川諸公皆長于北聲不入南調大扺曲之稱當行者首重譜韻次論詞章近日玉茗堂杜麗娘劇非不極美但得吳中善按拍者調協一畨乃可入耳惜乎摹畫精工而入喉半拗深為致慨若士兹編殆陳子昻之五言古耶名家苦心作家頗難得豫後學何知漫舉而評隲之非有他也蓋謂曲學深奧見從來作者之難若諸君聲價久巳實録詞壇不可泯滅余抑何敢以管窺之見漫為低昻也耶曲譜辨心感物而成聲聲逐方而生變音之所以分南北也君子審聲以知音而律呂辨矣古律數九九八十一以為宮三分而損益之以為徵商羽角此律吕之大較也復之一陽始生律應黃鐘遞而推之為大呂太簇夾鐘姑洗仲呂㽔賔林鐘夷則南呂無射應鐘凡十有二律所謂氣始于長至周而復生聖人合符節調鐘律造度數繇此其選也樂府之制字辨陰陽調協平亥然未有舍十二律而自為神明者今按之曲譜大抵譸張附會者什之八九夷考其調僅有黃鐘南吕二家諸如仙呂大石越調雙調之名不知從何根據如謂舍十二律别有流暢則此黃鐘南吕猶然十二律中之名義也而曲譜竟别創為仙呂諸調又何説耶如仍出諸十二律則宫調之首當敘自黃鐘始今南曲譜獨首仙呂又何説耶且也黃鐘為官不必更有正宮之名矣夾鐘姑洗無射應鐘為羽不必更有羽調之名矣夷則為商不必更有商調之名矣今譜之有宫商羽三調而又無角徵二聲獨何歟説者日軒轅之法及今渺矣此流傳者之殘闕也但不知仙呂大石越調雙調究竟自誰伊始余竊揣之意者十二律之仲呂或因仲字與中字仙字相肖遂誤傳為中呂仙呂乎又或呂字與石字相似遂誤傳大呂為大石乎善讀書者盡信不如其無則九宫譜之謂矣然則何以處曲乎日曲者末世之音也必執古以泥今迂矣曲者俳優之事也因戲以為戲得矣然則譜可廢乎日因其道而治之適于自然亦巳無憾何必不譜也蓋九九者天地自然之數也律吕因此諧腔調繇此出譬如今日此曲之腔唱為彼曲聽者笑之謂其失於自然也然則按譜而作之亦按譜而唱和之期暢血氣心知之性而發喜怒哀樂之常斯巳矣況譜法之妙專在平亥間究心乃學之而陋焉者僅如其字數逐句櫛比而所以平亥之故卒置弗講似此者如土偶人止還其頭面手足而心靈變動毫弗之有於譜奚當焉及學之而失焉者每一套中以此調之過曲忽接他調譬諸冬行夏令南走北轅即名家大手􅉨􅉨有之於譜又奚禆焉昔人歌㽔賔之聲而景風至震易水之響而白虹貫所云動巳而天地應焉聲音之感豈其微哉古之談曲者日曲如折止如稿木曲之道思過半矣客日今子伯仲之選本其于譜書固兢兢矣而重翻此義可謂世行世法我行我法者夫余然其言遂併識之情癡窹言今之所稱多情皆其匿情而獵名者也悲憤調笑慰勞寒喧若伶人之搬演落場即巳掉臂去之轉眼秦越聚散搏沙耳膠漆戈矛耳其為辭也浮遊不衷必多雕琢虛偽之氣欲自掩飾之而不能心之與聲有異致乎人之有生也睂宇現乎外血性注乎內情緣煎其中豈惟兒女子雖彼豪傑通儒豁逹自負者無所感則巳一涉此途行且靡心就其維繫誰能漠然而遊於􅐯漾之鄉哉説者日至人處靜不枮處動不喧居塵出塵無縳無解而且柳生其肘右鳥巢其頂門此亦冥忘汱寥之極矣今乃以萍蹤浪迹愁病銷磨癡矣哉噫彼之忘情割河而斬筏者人而至焉者也我非至人苐求其至於人夫人情種也人而無情不至於人矣曷望其至人乎情之為物也役耳目易神理忘晦明廢飢寒窮九州越八荒穿金石動天地率百物生可以生死可以死死可以生生可以死死又可以不死生又可以忘生遠遠近近悠悠漾漾杳弗知其所之而處此者之無聊也借詩書以間攝之筆墨磬㵼之歌詠條暢之按拍紆遲之律吕鎮定之俾飄颻者返其居鬱沉者逹其志漸而濃郁者幾於淡豈非宅神育性之術歟余于情識淡然矣挾一真率有情之侶與俱不勝其嚮往也間一拂情又不能違心以就世法人亦多笑之弗顧也自率其情巳矣世路之間有疑吾情者緣之艱也吾無庸疆其信斯情者我輩亦能癡焉但問一腔熱血所當酬者幾人耳信乎意氣之感也卒然中之形影皆憐靜焉思之夢魂亦淚鐘情也夫傷心也夫此其所以癡也如是以為情而情止矣如是之情以為歌詠聲音而歌詠聲音止矣凡例一往時選刻吳騷苦無善本所行者惟南詞韻選及遴奇振雅諸俗刻所載清曲大略雷同韻選一書又為金湯韻學而設僅惟小令散見而套數則落落晨星余特搜諸殘簡蠧餘零星舊本及各家文集中積漸羅致雖巳刻者有三集而所見之詞不啻廣矣其後坊刻效步似亦柏梁餘材武昌剩竹耳終不能出其範圍也是集更彚精美用公見聞一是集專録麗情散曲惟幽期歡會惜别傷離之詞得以與選其他雜詠佳篇俱俟續刻槩弗溷收一歌先審調不知何調則音律亂矣兹選照譜所序宮調分列各宫正曲居先犯調列後而南北調以及北調附列終篇俾知音者便於查核一詞場佳句多矣然於曲體及用韻溷亂者雖美不貴日以彚帙未僃漫為寬收者有之兹則逐套研窮必求合譜依韻而越格者弗録也其名人好辭坊刻訛傳者悉照原本釐正有偶為出入而填詞佳麗不忍棄置者必謬為斟酌琢瑕留瑜為宫商之全璧云一曲中襯貼字眼須辨虗實非死煞也俗刻臆分大小自稱當行徒貽識者之笑兹則細加理會辨晰微渺殊費苦心一字有鼻音唇音舌音喉音齒音及撮口開口閉口等音不能盡標即詞隱先生止圈閉口而閉口侵尋監咸亷纎三韻亦明載中州韻書知音者按之自能一一分辨兹帙止圈去上兩聲其餘槩不蛇足一是選但衡其曲不問其人間有姓氏相傳確乎有據者則一一還其故物有託名誤刻而素無可考者亦不敢妄為翻案獲罪前人蓋移珠借玉亦屬詞林常有之事如從此推𫾣必盡起地下而問之矣奚其能況詞以人重人以詞重寧任其咎以留闕文之遺意可也若云杜撰則吾豈敢一好曲熟爛人吻儘有為人唱壞者是編剗去汜濫近補新聲名日合編雖依據舊本而仍寓增刪之法非依樣葫蘆巳也一各調逐詞或有疑案或有原評附載編中以供詞林鼓吹以佐譜書法輪一清曲中圖像自吳騷始非悅俗也古云詩中畫畫中詩開卷適情自饒逸趣是刻計出相若干幅竒巧極工較原本各自創畫以見心思之異一坊選傳奇諸曲頗為厭人嗣兹刻後當另出手眼用公玄賞一是選雖未空羣亦稱鴻覽其他名家著作雖多一時不能悉購俟容廣搜以成續刻倘得聞風辱教猶拜明賜白雪齋主人謹識凡例終魏良輔曲律一擇具最難聲色豈能兼僃但得沙喉響潤發于丹田者自能耐久若啓口拗劣尖粗沉鬱自非質料勿枉費力一初學先從引發其聲響次辨别其字面又次理正其腔調不可混雜強記以亂規格如學集賢賔只唱集賢賔學桂枝香只唱桂枝香久久成熟移宫換吕自然貫串一五音以四聲為主四聲不得其宜則五音廢矣平上去入逐一考究務得中正如或苟且舛誤聲調自乖雖具繞梁終不足取其或上聲扭做平聲去聲混作入聲交付不明皆做腔賣弄之故知者辨之一生曲貴虛心玩味如長腔要圓活流動不可太長短腔要簡徑找絶不可太短至如過腔接字乃關鎖之地有遲速不同要隱重嚴肅如見大賔之狀一拍乃曲之餘全在板眼分明如迎頭板隨字而下徹板隨腔而下絶板腔盡而下有迎頭慣打徹板絶板混連下一字迎頭者此皆不能調平仄之故也一曲須要唱出各樣曲名理趣宋元人自有體式如玉芙蓉玉交枝玉山供不是路要馳驟針線箱黃鶯兒江頭金桂要規矩二郎神集賢賔月雲高念奴嬌序刷子序要抑揚撲燈蛾紅繡鞋麻婆子雖疾而無腔然而板眼自在妙在下得勻淨一雙疊字上兩字接上腔下兩字稍離下腔如字字錦思思想想心心念念又如素帶兒他生得齊齊整整裊裊停停之類至單疊字比雙疊字不同全在頓挫輕便如尾犯序一旦冷清清之類要抑揚於此演繹方得意味一清唱俗語謂之冷板凳不北戲場藉鑼鼓之勢全要間雅整肅清俊溫潤其有專于磨擬腔調而不顧板眼又有專主板眼而不審腔調二者病則一般惟腔與板兩工者乃為上乘至如面上發紅喉間筋露搖頭擺足起立不常此自關人器品雖無與于曲之工拙然去此方為盡善一北曲以遒徑為主南曲以宛轉為主各有不同至于北曲之絃索南曲之鼓板猶方圓之必資於規矩其歸重一也故唱北曲而精于呆骨朵村里迓鼓胡十八南曲而精于二郎神香遍滿集賢賔鶯啼序如打破兩重禪關餘皆迎刃而解矣一北曲與南曲大相懸絶有磨調絃索調之分北曲字多而調促促處見筋故詞情多而聲情少南曲字少而調緩緩處見眼故詞情少而聲情多北力在絃索宜和歌故氣易粗南力在磨調宜獨奏故氣易弱近有絃索唱作磨調又有南曲配入絃索誠為方疷圓蓋亦坐中無周郎耳一曲有三絶字清為一絶腔純為二絶板正為三絶一曲有兩不雜南曲不可雜北腔北曲不可雜南字一曲有五不可不可高不可低不可重不可輕不可自做主張一曲有五難開口難出字難過腔難低難轉收入鼻音難一曲有兩不辨不知音者不可與之辨不好者不可與之辨一聽曲不可喧譁聽其吐字板眼過腔得宜方可辨其工拙不可以喉音清亮便為擊節稱賞大抵矩度既正巧繇熟生非假師傳實關天授一絲竹管絃與人聲本自諧合故其音律自有正調簫管以尺工儷詞曲猶琴之勾剔以度詩歌也今人不知探討其中義理強相應和以音之高而湊曲之高以音之低而湊曲之低反足淆亂正聲殊為聒耳陳可琴云簫有九不吹不入調非作家唱不定音不正常換調腔不滿字不足成羣唱人不靜皆不可吹正有鑒於此也曲律終

front:
  text: 序吳騷初集夫世間一切色相儔有能離情者乎顧情一耳正用之爲忠憤爲激烈爲幽宛而抑之爲憂思爲不平爲枯稿憔悴至於纚纚一腔難以自巳遂暢之爲詩歌爲騷賦而風雅與三閭諸篇竝重於世昔史遷之傳三閭也悲其值而大其志謂足以兼國風小雅而班固氏亦美之日弘博麗雅爲詞賦宗此皆窺見平情而深乎其味者然情寧獨平哉佳人幽客好事多磨繾綣縈懷撫時觸景聮牀同調兩地吊天我輩鍾情豈同稿木故竅發於靈而響呈其籟代不乏矣漢以歌唐以詩宋以詞迨勝國而宣於曲迄今盛焉總之以風雅爲宗而憤激幽情錦心慧口相伯仲也南國謳唫不減江臯諷咏三吳丰韻類延晉代風流詞本於騷而地别于楚故因弁其騷日吳嗟嗟今樂府濫觴極矣自有兹帙也洛陽𥿄貴收盡陽春氷玉蛟螭刻成天巧豈非造物之情至此而一暢耶世不乏有情人而知吳騷之足尚也旹萬曆甲寅秋日清懶居士書於尚白齋中序吳騷二集蓋自楚三閭大夫以騷著而楊子雲氏于是乃爲作反騷嗟乎騷可廣卽廣矣可更廣反亾爲也反反騷所爲作也何也夫人莫情眞情莫怨眞而離騷其言哀其志切其托諷遠怨矣哉所云情之所鍾政在我輩三閭大夫其人也大夫其有情癡也哉太史公謂其作離騷蓋從怨生也有味其言之也雖然大夫騷于楚楚有騷我吳亦有騷也吳騷廣楚騷者也曩初集行巳𥿄貴洛陽海内復渇想次集遂復輯次集以廣初集夫兩集皆曲也曷爲而騷之日體異而情同也情曷爲而同其摛詞不必盡怨矣他弗具論間且歡日繇怨而歡歡復致怨者人間世聚散之常也總之怨其情種也獨不日作者類不必盡吳人乎曷爲而冠之吳也日地異而寄情于響者大都屬吳音卽不盡吳音而按拍無如吳人工也然則吳之騷曷爲而不騷其體顧曲也日諸君子見當吾世而詞賦自命者示之騷定睂酸于把卷卽開卷苦不得句也方將敝帚委之寧冀有淮南王安通其義而劉向諸人岀尊其言爲經也則其文且湮没不傳而悠悠此情終不獲表見于天下後世以故文生于情而情恐不能以文訴人則變而衍爲曲庻幾考之樂府亾慮知與不知并亾慮善按拍不善按拍而情不自巳人人其式歌且舞也今日者卽起三閭大夫泪羅中其能不以曲易之仍騷哉則吳騷之集于初也洵足爲楚騷廣次以是集稱廣廣騷夫誰日不可王孝伯有知當又以痛飮酒熟讀前後兩吳騷爲快矣千載下應不乏賈長沙有爲文吊諸君子耳爲子雲氏者其爲誰花裀上人許當世題序吳騷三集懷沙寫志幽憂無巳蓋繼三百而作者自宋子師之而漢賈生擬感鵩之論凡幽人志士不平而喜爲古言辭者人非楚而楚其辭撡筆而從子雲之後者不乏人也然賦體浮誇引用古字稱長學士經生亦多未解世因變之爲詞曲語近本色遂與里耳相通總之體異而志同也居士號騷隱復集樂府而弁以騷良有深意乎今好事者聞其名號便覺鬰沈之色都爲振起且欲卽覩其全而未可得兹復手輯佳本授之剞劂至再而三其韻嚴其響和其節舒其慷慨類俠滑稽類誕怨思類憤悲歌惜若挾三閭大夫而出佩蘭沈潭之貌吐其九歌天問哀郢之辭也廼居士少孤食貧意氣違俗所如多不合宐其沾沾以騷著耶是刻也長夏掩扉散髮痛飮手拈數闋長謳再過實岑寂中知巳耳若九宫之辯有譜法在何庸贅半嶺主人題

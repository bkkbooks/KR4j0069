地談天那胸次將翠幕雲屏更設施把錦帳鴛衾重鋪肆説海誓山盟舊日思遂倚翠偎紅少年事解合歡帶兒鬆同心結子還記得喘吁吁立不定燈前那一個死仙呂贈妓未刻舊辭點絳唇用江陽韻月戶雲窗翠屏朱幌靑樓上楚楚紅粧國色真堪賞混江龍鳴珂里巷悄名兒占斷錦排場歌傳金縷舞按霓裳才貌絶勝蘇小小風流不讓呂雙雙聽嬿婉尊前唱比花解語玉生香油葫蘆杏臉桃腮宫樣粧步凌波羅襪涼真箇是春風一曲杜韋娘覻了這羞花閉月嬌模樣識不盡撩雲撥雨虛情況安排下假志誠施逞些巧伎倆包藏著賺郎君掇子弟暪天謊外貌兒甚端詳天下樂兀的不惱亂蘇州刺史腸司空休泛常若是楚襄王見了也勞夢想怎禁他動人情的翠黛長蕩人情的雲髻光那更這透人懷的玉腕香金盞兒靠東墻近西廂隹人才子時相傍芳心密意怎相忘引惹得崔生頻覓槳逼臨得韓壽暗偷香因此上棲遲風月所留戀雨雲鄉賺尾個中人心上想怕不道年少花容正芳只恐人心不久長蚤尋取畫閣蘭堂尚兀自鳳去凰翔怎不量回首星星兩鬢霜少不得月缺也浮雲蔽藏花謝也狂風飄蕩那其間蜂蝶誰賞好春光中呂贈妓未刻蘭楚芳粉蝶兒用家麻韻他生得如月如花蕩湘裙一鈎羅襪寶叉橫雲鬢堆鴉翠睂灣櫻唇小堪描堪畫剛隔著碧窗紗倚幃屏繡簾低下醉春風香細裊紫金爐酒頻斟白玉斚銀燈影裏殢人嬌他生得可喜殺殺更性兒宜喜宜嗔便有那間愁間悶見了他且休且罷迎仙客傍芝蘭吸露華遊宇宙步煙霞我只見窄弓弓藕芽兒剛半扎踐香塵踏落花淺印在輕沙印一􅍟相思卦紅繡鞋有他時一刻千金高價有他時一生興旺人家有他時村沙的化得不村沙臨風三勸酒􅍟月一烹茶説蓬萊都是假普天樂即黃梅雨信步到海棠軒間行至荼䕷架引得些蜂喧蝶攘來往交加粉臉襯桃杏腮雲髻把花枝抹看裊裊婷婷花陰下他若是不言語何處尋他他比黃金足色明珠沒價美玉無瑕耍孩兒般涉調即魔合羅透春情説幾句知心話只𬒳你拖逗殺我心猿意馬寒窗寂寞廢琴書苦思量曉夜因他傲風霜分不開連枝樹宜雨露栽培出並蒂花見一日買幾遍龜兒卦似這般短促促携雲握雨幾時得穩拍拍立計成家二煞捧金杯勸醁醑按銀箏那玉馬似展開幅吳道子觀音畫他那裏倚闌翠袖凝秋水映日紅裙襯曉霞但見處人驚訝端的是沉魚落鴈閉月羞花一煞笑一面不覺得春自生行一步看得人眼倦花十分愛常帶著三分怕愛的是風流旖旎嬌千種怕的是間阻飄零那半霎天生下一虎口淩波襪堪與那俏子弟寒時暖手村郎君飽後挑牙尾聲與中呂煞尾同若要咱稱了心只除是娶到家學知些柴米油鹽價恁時節悶減愁消受用殺南呂詠遇未刻陳秋碧一枝花用簾纎韻嬌滴滴千金玉體輕窄弓弓半虎羅鞋㜞長挽挽兩彎首黛巧顫巍巍一揑柳腰纎禮數謙謙歌白雪櫻唇艷撥檀槽春笋尖俏儀容燕燕堪同美聲價鶯鶯不忝梁州第七那裏有一毫兒破綻端的無半米兒憎嫌溫柔瑩潔絶瑕玷宜嗔宜喜知恥知亷諸餘可愛所事相兼惹得些蜜蜂兒攘動雕簷引得些蝴蝶兒飛近粧奩恨只恨歸去後佩聲兒空館遙聞喜只喜相見時腳步見殘紅半掩愁只愁别離間唾津兒香帕猶粘意歡語甜知音不是恩情欠你蘇卿俺雙漸暪不過慣打聽風聲阿母嚴步步拘鉗隔尾丢不開放不下難成合繾綣終常念染的重感的深無倒斷相思積漸添有一日軟玉溫香許咱贍放下花撲撲繡簾靠著喜孜孜杏臉恁時節方才把撥雨撩雲意收斂雙調秋閨巳刻祝枝山新水令用江陽韻鴛鴦夢斷藕絲鄉晝沉沉水心亭上柳絲牽舊恨花纈鬬新粧立盡斜陽悄無語幾惆悵駐馬聽客路修長一度書來一度想金風蕩漾一畨雨過一番涼生前業債甚年償眉尖悶鎖何時放聽誰家砧韻響一聲聲偏搗在愁心上雁兒落好似那無根蓬欠主張漫天絮間遊蕩逐浮萍任去留隨風柳多偏向得勝令呀空寫下舊事兩三行故𥿄百千張把些箇唬鬼瞞神誓番做了唆秦騙趙謊害軟了心腸􅍟人前口強心不強病染膏肓那里醫良藥不良川撥棹一弄兒助淒涼沒來繇間閙攘兩兩寒螿草下階傍也會把離人話講絮聒聒多半響七兄弟他那裏遠方異鄉著我費思量且休提動止渾無恙便些兒破綻有何妨莫輕將美愛都全忘呀却思今還念往梅花酒問月在西廂待月在東墻􅍟月在南窗匆匆的秋又來呀迢迢的漏偏長遲遲的夜未央塵蒙了象牙牀火冷了玉爐香零落了錦香囊冷淡了舞衣裳金縷也不成腔金縷也不成腔收江南呀為誰消瘦減容光蛾眉空想畫張郎薄幸繫馬向垂楊知他在那廂知他在那廂高燒銀燭照紅籹離亭宴帶歇揭煞枕邊悄語成虗妄從來好事多魔障積儹下恩多怨廣鏡奩兒羞照舊時容袖梢兒不乾今日泪裙腰兒減盡前春樣捱徹了孤辰寡宿年再整理殢雨尤雲況跳出了愁城恨網將養的比翼羽毛成醖釀的並頭花朵就滋培的連理枝條旺忙鋪設翡翠屏重拂綽鮫綃帳滿捧著瓊觥玉觴三秋月儘情看四時花隨意賞春閨巳刻周秋汀新水令用東鍾韻碧桃花外一聲鐘繡衾寒喚四春夢香消金獸冷花落翠屏空雨雨風風攛斷的病兒重駐馬聽帶結頻鬆瘦骨不禁愁冗冗睂峯難縱黛蛾深鎖恨重重瑤臺人遠信勞鴻彩雲聲斷簫間鳳惡相思千萬種百般難把愁來送雁兒落冷落了春風銅雀宮間阻了夜雨陽臺夢闌珊了停雲燕子樓寂寞了流水桃源洞得勝令單守著四扇矮屏風三尺舊絲桐總費囊中藥全消鏡裏容簾櫳步月無人共花叢尋春誰與同川撥棹我這里恨匆匆晝偏長更又永許多時歌歇梧桐帳冷芙蓉酒盡瑤觥不見了紅圍翠擁望藍橋無路通七弟兄􅍟著這落紅舞風畫欄東怯餘寒簾簌金鈎控寄間情琴在錦囊封揾啼痕袖濕瓊珠迸梅花酒減雀徽畫裏容怕曉角昏鐘恨芳草靑驄怪浪蝶狂蜂秋來呵江上别花落也未相逢又不知吉與凶我只索含著泪告蒼穹陪著笑問靑銅側著耳聽歸鴻緘著口怨東風收江南呀懨懨不比舊時同緑窗針線廢春工殘雲剩雨自西東全無有定蹤巫山十二總成空本調煞好姻緣都虗哄惡相思將人磨弄還説甚前生栽種憶所見巳刻毛蓮石夜行船用皆來韻缺月風簾碎影篩碧紗厨酒乍醒來雲鬢風鬟柳腰花面憶多情恁時安在風入松杏花深處小亭臺猶作夢魂猜東風邂逅逢嬌態麝蘭散滿間階羅襪凌波半窄更春衫可體新裁落梅風睂尖上眼挫側先留下幾分恩愛怕有人知佯不採徐行過玉闌干外胡十八不下懷自驚怪悲間阻想和諧巫山頂楚雲埋雁帖魚書手倦裁一身擔無限愁十日却九畨害填不滿離恨窩還不了相思債撥不斷細裁劃命合該姻緣頃刻多成敗鬼病千般強打捱凄涼萬種難擔載幾曽得片時輕快離亭宴煞楚陽臺步步荆榛隘擔閣下兩廂情色相思卷何年結束糊突謎甚日明白傳示你權寧耐切莫把鯫生見責是送暖的意兒虗非搏香的性兒歹為妓白蓮賦巳刻沈青門夜行船用先天韻太乙峯頭玉井蓮等間移入梁園繡屋遮藏錦屏圍護不許路人窺見風入松劉郎心性與花便獨自掌花權高燒銀燭重開宴好風光壓盡桃源煙靄輕籠婀娜更月明冷浸嬋娟喬牌兒惜花人正少年共花恣留戀朱顔相􅍟如花面美姻緣天下鮮雁兒落花香散舞筵花影迷歌扇花輸才子看花許騷人羡得勝令人是惜花仙不吝買花錢痛飮花前醉狂吟花底眠天然果遂今生願堪憐還應宿世緣鴛鴦煞名題月老合同劵情留張珙相思卷山海盟深膠漆心堅暢道是緑嫩紅柔香嬌玉軟兩意相投巳謝却間鶯燕風月無邊諧老芳聲播楊遠商調秋懷巳刻陳秋碧集賢賔用車遮韻憶吹簫玉人何處也今夜病較添些白露冷秋蓮香謝粉牆低皓月光斜止不過暫時間鏡破簪折到勝似數十年信斷音絶􅍟西風倚樓空自嗟望不斷嶺樹重疊怕的是流光奔去馬雁陳擺長蛇逍遙樂歡娛前夜喜報燈花香生帶結誰承望又蚤離别常記得相靠相偎笑語喋畫堂中那日驕奢受用些尊中緑蟻扇底紅牙枕上蝴蝶醋葫蘆我和他初相逢臉帶羞乍交歡心上怯半粧酒醉半粧呆兩下情濃難棄捨鴛衾方熱把一枝鳳凰簪掂做兩三截么篇我為他桃著燈將好句裁背著人將心事説直等到碧梧窗外影兒斜惜花心怕將春漏泄蒼苔輕躡露珠常汚了踏青靴么篇我為他朋情上將謊語兒丢他為我母親行將嬌樣兒者我為他在家中費盡了巧喉舌他為我褪湘裙杜鵑花上血我為他耳輸兒常熱他為我面皮紅羞把扇兒遮梧葉兒一箇是相府內懷春女一箇是君門前彈劒客半路里恰逢者剛幾箇千金夜匆喇叭拋去也我怎肯恁隨邪又去把牆花亂折後庭花仙呂夢了些虗飄飄枕上蝶聽了些吉丁當簷外鐵剛才得合上溫郎鏡却又蚤攔回卓氏車我這里痛傷嗟香消蘭麝望陽臺道路賖靑歌兒同上風亂掃階前黃葉雲半遮柳梢殘月這離恨更比太山轉陡些待桑田重變海枯竭還不了風流業浪裡來煞這愁呵剛不在眼角踅又來到睂上惹恨不的猜三尸肺腑細鐫竭有一日繡幃中玉肌重厮貼我將他指尖來輕揑直説到那樓頭北斗柄兒斜北詞名作雖多而強半不能合譜即集中所收亦未敢盡稱可法其曲中板眼緑北調向無確載而時俗臆為增減緩急虗實頗堪反唇今考之嘯餘諸譜止載名詞而無板法寧弗杜撰不敢臆增此則闕疑之意良有以也兹亦不復點板以俟知音者自為揣摹至如醉花陰端正好點絳唇粉蝶兒一枝花新水令等套則又歌壇素所習聞試細心參酌自得其竅從事絃索者其加諸意焉嶺樵白雪齋選訂樂府吳騷合編卷之四終

雨此際總徬徨想是前生帳斷頭冤債合相償尾聲巫峽迷藍橋漲隔斷處紅塵千丈只落得煙樹蒼蒼雲水茫春日懷蕭楚雲巳刻楊升菴綿纒道用江陽韻心悒怏縮不就相思地長何處訪蕭娘珮環聲依然只在湘江怎能勾趂東風騎着鳳凰一霎時喜相逢齊赴高唐雲雨謾商量把角門兒輕輕關上縱巫山路渺茫也落得一宵歡暢怕鐘聲隱隱到書窗太師引南呂換頭桃花依舊遮門巷問紅顔今宵那方特地把瑶琴三弄又誰知涙雨千行抛琴挹涙空惆悵聊聽取玉樓歌唱芭蕉影紛紛過墻只道是那人轉向廻廊三學士南吕春風不管人魔障偏來助我悽惶花枝縱有他嬌模様那裏有軟玉溫柔不斷香若使他和花共語花便肯冩書降解三酲仙吕不繇人眠思夢想不繇人割肚牽腸枉臨風􅍟月生悽愴舒𧖟繭冩詩章不繇人啼衾怨枕到天兒亮不繇人罵柳嗔花送夕陽誰相傍把離愁當酒心坎爲觴尾聲伴靑燈梅花帳今夜歡娛罷講怕離恨牽人夜未央寄顧姬未刻王伯良錦纏道用尤侯韻憶年時掛靑㠶向維揚浪遊正値錦塘秋夜沉沉花明一葉蘭舟恰正是載西施廻橈浦口又做個醉胡姬移席壚頭窈窕更風流喜窗外月明如晝何妨作逗遛笑吟吟暗鬆金釦怪起來紅日在簾鈎普天樂軟腰肢纎纎柳巧梳粧亭亭藕相偎傍日日朱樓縱烏絲百幅難酬鸞班鳳儔似美人圖簇擁觥籌古輪臺中吕恨悠悠一江煙水動離愁斷腸人别黃昏後不堪回首嘆紫馬青裘又作長安生受花落銀牀西風依舊天涯月色共燈篝照人消瘦休再提酒盞茶甌軟綃淚點香囊詩句依然在手信阻白蘋洲卿知否悔將書劒覔封侯尾聲病兒沉心兒陡莫教朱字問箜篌爲你百錬剛成繞指柔四時閨思白雪齋集四詞家小令李日華玉芙蓉用蕭豪韻殘紅水上飄靑杏枝頭小這些時眉兒淡了誰描因春帶得愁來到春去緣何愁未消人别後山遙水遙我爲他數歸期劃損掠兒梢前腔金白嶼長天暑未消長恨何時了玉肌柔教人倦倚水綃粧臺羞􅍟花如貌舞袖空憐柳似腰人不到把盟香暗燒這些時粉香消常是淚珠抛前腔沈靑門風簾玉馬敲月砌莎鷄閙冷淸淸繡閣人孤難熬無憑又是燈花爆嬾上牙牀三四遭姻緣事全無下稍想應他卜金錢偏遇反吟爻前腔張伯起餘香冷綘綃半壁燈光照繡衾兒獨擁夜寒偏峭秦臺寂寞煙空繞何日雙吹碧玉簫關情處噹噹麗譙猛可的熱心腸一陣水兒澆按前三曲傳之舊本卽韻選亦所並載後得伯起一闋以成全璧而三籟疑之抑未之見耶靑樓貽恨翻北詞卜大荒玉芙蓉用尤侯韻紅舒臉上桃翠展眉間柳覻肌溶粉膩鬂嚲雲稠纎長帶綰金雙釦窄小鞋弓玉半鈎腰圍瘦約珍珠臂鞲據丰標止應蘭館貯嬌羞刷子序歌臺賺留經年殢取酒觶茶甌昨夜新歡今朝又阻行舟温柔這里紅裙翠袖那壁廂蜂迷蝶瘦緊摩弄火熱心腸業障兒無了無休雁來紅後三句疑卽朱奴兒今照譜刻雁過沙機關勸你收捨身崖莫更投迷魂洞作急丢開手陷人坑趂蚤忙回首色褪三春不耐秋紅娘子宜速搆雲深小樓是葉落歸根候朱奴兒愛潭女詞憐少遊癡通叔硬趕蘇舟兩箇竒緣意表兠没添貨偶然厮就纔消受鸞衾鳳裯再肯向鳴珂走尾聲無擬秋閨思巳刻沈青門普天樂用蕭豪韻建安才河陽貌從一去無消耗别時節淑景初交驀又把芳時過了三秋易到可意人難到觸處無端成懊惱􅍟瑤琴玉軫愁調向粧臺蛾眉怕掃寄香囊繡字慵挑雁過聲換頭無聊況復凑巧風和雨縱橫正飄時間鐵馬偏咶噪夢難成恨難熬更漏聲將盡譙鼔頻敲鷄聲偏又早寒蛩抵死在窗前哨不繇愁悶攢更直到曉傾盃序換頭蕭條爽漸生暑漸消塞雁又呀呀呌看滿徑黃花滿林紅葉滿地蒼苔教人心碎難熬有誰憐瘦損幾畨夢醒畵眉人杳不繇人怨殺暮暮更朝朝玉芙蓉參差玉珮搖恍惚銀甌掉好姻緣做了有下無稍峯頭夢斷難重到洞口花開怎再邀把些恩和愛如鹽在浪淘奈江深没底枉徒勞小桃紅與越調異或作山桃犯誤寫罷了回文稿打叠起離鴻調愁來待把菱花照須知不似前春好畵圖雖寄應難肖傍丹靑時復擎管羞描尾聲孤辰限豈自招于飛願天應作保且把香來着意燒閨怨巳刻李東陽普天樂用蕭豪韻四時歡千金笑從别後多顚倒俺這里玉減香消他那里珠圍翠遶婚姻簿内想是名不到却把鸞釵輕分了恨茫茫水遠山遙悶沉沉雲深霧杳困騰騰使人夢斷魂勞雁過聲換頭終朝院落靜悄徒然有龍香鳳膏鸞笙象管無心好萬般愁萬般焦這悶懷端的教我難熬空教人易老那堪暮雨花簷前閙比着俺淚珠兒兀自少傾盃序換頭思着掩翠屏冷絳綃寂寞向誰行告捱幾個黃昏幾畨明月幾度靑燈和我知道把歸期暗數寶釵劃損畵欄雕巧不繇人罵他薄倖絮叨叨玉芙蓉金爐香篆消寶鏡塵埋了數歸期一夕又還一朝薄衾小簟殘鐘曉暮雨梨花魂暗消這相思病多應是命招算人心不比往來潮小桃紅註前誤約在蓬萊島冷落了巫山廟愁雲怨雨羞花貌精神不似當初好雁來鴻去無消耗委實的教我心癢難猱尾聲凄涼運莫再交但願得鴛鴦會蚤莫待秋霜染鬢毛秋閨巳刻文三橋普天樂用蕭豪韻閉月容羞花貌這幾日懶把菱花照憶多才山長水遙恨薄倖魚沉雁杳謾􅍟景傷懷抱更有甚心情將這蛾眉掃最苦是明月初高最苦是殘燈倦挑最苦是隣鷄又蚤報曉雁過聲愁聽落葉亂攪愁聽那砧聲夜𫾣愁聽四壁寒蛩閙更愁聽雁嘹嘹愁聽窗外雨灑芭蕉愁聽枝上鳥因他幾様將人惱瘦得奴腰肢兒兀自小傾杯序前宵鶯燕友鳳鸞交帳裡相偎靠好似悞入桃源喜逢洛浦樂賦高唐怎知您别調把離情謾簡這回却比舊時多少算將來愁腸積累似山高玉芙蓉垂楊映畵橋小逕迷芳草急回頭又蚤秋滿林臯薄情遠别長安道目斷關河魂暗消懨懨病甚藥可調只恐怕芳容不比昔年嬌小桃紅註前黙黙地將人惱魆魆地催人老巴巴望眼空凝眺一腔愁緒何時了這般滋味有誰知道幾時得使我離却煎熬尾聲星前月下頻頻禱願莫負深盟舊好記取江心把舵牢旅懷未刻沈伯英普天樂用皆來韻片時情三生債只索自寕心待眼見得病骨如柴辜負了春光如海當初取次岀鶯花寨生把連枝輕拆解海山盟霧鎖雲埋翠紅鄕天寛地窄􅉅蘭芳枉教結佩縈懷雁過聲換頭難捱分違半載吳山阻音塵漸乖那堪客路在吳山外漫行行自裁劃這别離也是天遣神差將生辰還細擺花星兀自多妨碍想着俺這孤辰何日改傾盃序換頭天涯旅病身且自挨怕景物供愁態奈幾曲江流幾重煙樹幾帶雲山添我無賴枉憂風怨雨綠愁紅慘夢勞魂駭怎能彀月明千里故人來玉芙蓉西湖想鏡臺鷲嶺思睂黛看蘓堤沙軟好印弓鞋綠茸茸蔓草疑羅帶紅灼灼夭桃憶粉腮當杯處倩覊懷好開又猛隨他風雨上心來小桃紅與越調異應接到山陰側蚤似有巫峯在無端又渡曹蛾界錢塘却望空煙靄梁溪何處紆襟帶急回頭猶恐迷了天台尾聲看武夷歸蘭舟載無人知是荔枝來莫做楊妃病齒猜按普天樂首曲南九宮譜原以拜月亭呌得我氣全無一闋爲則而歷觀名作其格律大都不能一一合法且向復名之日四塊玉豈别有所本而相沿乃爾耶然據其腔調頗爲合拍或亦可以僃新増一體云嶺樵漫筆暮秋閨怨巳刻梁少白白練序用尤侯韻西風裏見點點昏鴉渡遠洲斜陽外景色不堪回首寒驟謾倚樓奈極目天涯無盡頭消魂乆淒涼水國敗荷衰柳醉太平換頭羅袖琵琶半掩是當年夜泊月冷江州虛窗别館難消受暮雲時候嬌羞腰圍寛褪不宜秋問靑鏡爲誰憔瘦海盟山呪都隨一江逝水東流白練序換頭凝眸古渡頭雲帆暮收牽情處錯認㡬人歸舟悠悠事巳休總欲致音書何處投空追䆒光陰似昔故人非舊醉太平換頭颼颼霜林鬬葉更風簷驟馬夜堂飛漏白雲天遠那堪値雁南歸後衾裯空餘蘭麝伴薰篝冷落了竊香韓壽背燈獨守寒生兎窟露凝鴛甃尾聲荏苒韶華逢九九登臨怕惹無限愁在開遍黃花不上鈎春閨巳刻關九思白練序用尤侯韻沉吟乆奈好事從來不自繇芙蓉帳未煖又還分手别後萬種愁歎曉夢高唐一旦休添僝僽梨花細雨燕子空樓醉太平換頭消瘦纎腰似柳近日來絳裙羅帶頻收這閒衾易冷人在小小雲兠堪羞淒淒孤影伴燈篝倚窗下倦聽銀漏這般時候三更酒醒滿枕春愁白練序換頭綢繆兩配偶同歡共遊在花陰下渾如閬苑瀛洲無繇願再酬恨飛絮飄香逐水流成拖逗釵分鳳拆線斷銀鈎醉太平換頭悠悠靑霄路有奈繡鞍歸晩山盟虗謬似分開雙璧不能勾兩情依舊頻修銀箋錦字到皇州一字字淚痕湮透甚時相守金杯滿酌豔曲低謳尾聲思沉沉如病酒又値落紅時候何日春歸十二樓秋閨巳刻陳石坡白練序用歌戈韻相思擔漸覺道秋來重許多憔悴了解語一枝花朶重山壓翠蛾千萬結愁腸無奈何偏難過黃昏細雨綠窗深鎖醉太平換頭追慕丰姿俊雅在奴行未敢醉酒高歌燈前枕畔幾回把花月消磨灾魔平空鴛帳起風波比目魚雙雙分破忽驚秋暮魂斷空階敗葉殘荷白練序換頭香雲散一窩臨鸞懶梳思君恨堆積起塞海塡河光陰暗裏過霜落梧桐冷鳳窠今宵個玉釵𫾣斷有誰知我醉太平換頭婆娑簾虚桂影見水簾輕碾碧天秋破清光到處不知他那里如何嗟哦淒涼最是月中娥也得照客窗人臥紅綃淚抺桃花萬點玉珠千顆尾聲􅍟青燈呆呆坐煙冷金爐獸火愁聽寒蛩聲絮聒離情未刻沈子勺白練序用尤侯韻殘月冷漸一帶清輝下小樓金風剪陡覺露凝雙袖寒岫供遠愁見銀漢參橫雲半浮飛淸漏隔林曉鏡􅍟籠纎柳醉太平換頭僝僽相思一點蚤離愁幾許撮上心頭花殘酒剰輕發付舊日風流悠悠知他何日債緣勾且生受一塲消痩望天還佑發來的願兒怎肯輕丢尾聲嘆從來多掣肘冤家到底常聚頭方信恩情險處乆按白練序首曲起句應用四字自窺青眼一曲盛行作者遂爾相習無復遵譜矣可爲三嘆四時閨怨巳刻劉東生刷子帶芙蓉用家麻韻刷子序雲雨阻巫峽傷情斷腸人在天涯奈錦字無憑虚度荏苒韶華嗟呀春晝永朱扉低亞東風靜湘簾閒掛玉芙蓉黛睂懶畵軃宮鴉鬢邊斜挿小桃花山漁燈犯或作虞美人犯誤燕將雛逢初夏夢斷華胥風弄簷馬閒扄了刺繡窗紗香消寶鴨那人在何處貪歡耍空辜負沉李浮瓜寂寞厭池塘閙蛙庭院日長偏憐我枕簟上夜涼不見他多嬌姹愛風流俊雅玉芙蓉倚欄干猛思容貌勝荷花普天帶芙蓉普天樂景淒涼人瀟灑何日把雙鸞跨怨薄情空寄魚箋相思句盡續琵琶彈粉淚濕香羅帕暗數歸期在斜陽下動離情征雁呀呀無奈心事轉加玉芙蓉􅍟西風病容憔悴似黃花朱奴揷芙蓉朱奴兒漸迤邐寒侵繡榻蚤頃刻雪迷了鴛瓦自恨今生分緣寡紅爐畔共誰閒話詀啼罷托香腮悶加玉芙蓉膽瓶中懶添雪水浸梅花尾聲重相見兩意佳憶昔傳杯弄斚斷送了年時四季花酬魏郡穆仲𥙿内史未刻王伯良刷子帶芙蓉用先天韻刷子序白眼看青天悠悠更誰同調相憐嘆流水高山空斷幾叠危弦金鞭趂紫馬黃河一線覔燕市紅雲半面玉芙蓉狗屠不見算翩翩酒人只有穆生賢雁過聲換頭西園好風似剪初調笑紅牙錦箋當塲肝胆投一片度新聲夜忘眠儘輸他燈下花前杯傳不放淺春朝秋夕成留戀何處他鄕路幾千傾杯序換頭難言别靑門倍黯然看日近長安遠誰在江東誰居渭北一縷春𧖟兩處絲牽苦書沉雲雁信疎驛使五年似撚幾畨家夢魂中斷月明邉玉芙蓉你回車又入燕我鼓棹重逢阮喜今宵浮萍兩葉仍圓綈袍不負靑霜院彩筆還驕淥水篇多歡忭狂來似顚那問他酒巵狼籍濕紅氊小桃紅越調異想光陰如飛電悵聚散眞蓬轉尊前莫怪頻酬勸黃塵海水須臾變茫茫後㑹鶯和燕恁高歌一笑當筵一樶棹紅兒唱粉頰有餘妍靑童舞羅袖倍蹁躚簷雪色宛轉照金鈿盆梅馥旖旎散朱軒提如意憑將兩眉展重剪燭握手話姻緣尾聲玉爐香銅壺箭此際謾消繾綣聽取新聲字字妍擬閨怨未刻張旭初刷子帶芙蓉用歌戈韻刷子序紅粉命常薄笙臺人去聲斷誰和雙魚無覔難將幽恨傳他蹉跎香篆冷空餘繡幕眉峯鎖羞添翠螺玉芙蓉愁無那傷心事多任雲鬟零落髻見矬錦芙蓉錦纒道枉存活苦躭承愁緣病魔魂夢遶關河怪連宵依希枕上摩挲道别後東西飄泊何曾把恩情放過玉芙蓉珠彈顆靑衫証佐恨鶯聲驚拆鳳凰窩普天帶芙蓉普天樂鏡中華心頭火到惹得枯腸餓悔前春容易抛離到如今恩愛隨波玉芙蓉成躭閣砂鍋打破端的是妬花蜂蝶暗搬唆朱奴挿芙蓉朱奴兒載花船憑誰把舵斷絃琴隨他結褁今生冤債前生作空到處求神拜佛玉芙蓉鞋尖破多因恨磨幾畨兒向蒼苔跌足濕淩波尾聲花事䦨春將暮怕炎威薰蒸難過況復秋冬怎奈何歳時傷逝巳刻梁少白破齊陣引用齊微韻破陣子帳掩香消人去房空珮冷魂歸齊天樂桃李春風梧桐秋雨又是經年隔歲破陣子尾忽憶綢繆生前阻夢見依俙覺後疑人間長别離刷子序端陽蒲酒啓瑤席雕梁燕兒依舊雙棲奈物是人非一旦雲鎖空閨堪悲香艾裊鬟釵巳委蘭湯膩臂絲曾繫夜涼時倚醉窗西半䦨殘月曉鶯啼普天帶芙蓉七夕普天樂鵲橋橫雙星㑹玉露潤金風細羡誰家乞巧樓頭笑聲喧玉倚香偎恨獨拆鴛鴦􅍟目斷盈盈銀河水妬牛郞織女夫妻任天長團圞到底玉芙蓉尾笑人間爲何途路便抛離尾犯序中秋中吕長空一鏡輝萬里全無一點纎翳此夜當年記雙凭玉肌徙倚空追念香鬟霧鎖空追念弓鞋露綴嫦娥寡蟾宮獨守天遠信音稀錦纒道重九雁來期正秋風寒雲亂飛把酒􅍟斜暉問芳卿爲甚的便蕙損蘭摧想蕭關黃葉盡起念漢殿紫莄誰佩歲月轉淒其衾餘枕剰初寒未授衣辜負登高節􅍟黃花羞揷滿頭歸傾杯序長至一名汲煞尾時移日漸長轉候灰又節値書雲歲捱幾度寒砧幾聲殘角幾箇孤鴻别館的滋味慘年華過眼暑來寒往一生無幾線空添要見伊還共日俱遲玉芙蓉除夕空傾栢葉杯枉泛椒花蕋總迎新愁看斗柄春回誰憐今歲今宵盡又早明年明日催消長夜撥寒罏死灰這傷心只有歲寒知小桃紅元宵與越調異燈影下人叢裏火蛾轉笙歌沸家家盡簇神仙隊花容誰似娘行比歸來空倚書幃立寒窗底獨展畵裏崔徽摧拍上已大石記祓除流觴水湄記游衍踏青翠堤記郊原路迷挈榼提壺處處徘徊香輦雕鞍歩步追隨今安在海角天涯魂欲斷日平西一撮棹清明人何處墓上草新齊悲風起棠梨上𥿄錢飛孤墳小殘月冷走狐狸青衫淚盡是杜鵑啼痛殺青松底又添一新鬼天地永日夕想魂兮無煞刷子序首句應用四字前各曲疑犯别調未詳春怨巳刻陳秋碧錦庭樂用亷纎韻錦纒道被兒餘枕兒單春寒較添夜雨響空簷曉來呵殘紅滿簾滿庭芳更那看掩重門􅍟鶯花鬼病懨懨這病危如燈熖這恨深如天塹普天樂病和愁兩厮兼病當心坎愁在眉尖前腔錦鱗稀塞鴻遙書沉信淹江樹眼空瞻怯梳粧塵緘寶奩常則是倚䦨干數歸程屈損春纎霧帳雲屏虚占海誓山盟無驗線和針懶去拈靈犀一點無計拘鉗前腔憶王孫乍交歡情投意忺永遠効鶼鶼自離家新生棄嫌料應他在天涯被秦樓歌管相漸金粉花容嬌艶血色羅裙紅茜美甘甘笑語甜未知將我唇上曽呫前腔影伶仃竚蒼苔鮫綃涙黏無語􅍟銀蟾暎孤燈蕭蕭短簷幾回價寄佳音怕人知躱躱潜潜是則是前生少欠苦則苦終常作念把恩情做了水底鹽羊腸龜卦今後休占尾聲合浦珠豐城劒願配合莫教抛閃看玉簿姻緣許再僉擬冬閨怨巳刻史叔考傾杯賞芙蓉用家麻韻傾杯序隔墻新月上梅花綉閣吹燈罷驀忽地冷了瑤琴撇下箜篌倚了薰櫳放了琵琶玉芙蓉那些箇春宵一刻千金價畢竟夜靜三更萬事差人牽掛控心猿意馬這浮雲遊子何日别京華玉芙蓉相思夢見他夢裏多歡耍醒來時依然人在天涯鴛鴦􅍟􅍟成虛話做蝴蝶紛紛過别家奴生怕怕那金鷄和鐵馬悄不覺催雲送雨到窗紗普天樂犯新増體普天樂聽更籌頻頻下淚滴滿鮫綃帕料多情别有嬌娃把我認做冤家當初來嫁星辰應犯孤和寡使今朝錦帳文鴛做了路柳墻花朱奴帶錦纒朱奴兒鎭日裏籹聾作啞捱一刻勝如一夏問張郞何日眉重畵玉簪兒打得酸牙錦纒道覷腰瘦不堪把饑時不飯渴時不用茶弄得人憔悴一廻煩惱一廻嗟尾聲海山盟丢開罷枉自去燒龜叩瓦把美滿恩情做了浪滚沙寄中都趙姬未刻王伯良傾杯賞芙蓉用車遮韻傾杯序一徑春風轉狹斜滿地荼䕷雪愛殺他門掩靑桐人在紅樓到處焚香直恁淸絕玉芙蓉盈盈悄臉花雙靨嫋嫋柔軀柳一捻紗窗夜記銀燈未滅掛一幅美人圖畵半簾月雁過聲換頭裙摺猩紅乍湼邀人褪榴花幾葉枕邊絮語脂香烈儘憑他漏聲接軟迷離玉襯花貼嬌怯偎粉頰兠郞肯惜靈犀洩好處廻身劣處嚙普天樂乍相逢芳心熱便相憐柔腸結常消受雨擁雲遮一時間將鶯燕攔截經年短鋏自看花來爲你費盡周折朱奴兒急分手靑衫哽咽頻作念錦字重叠寄得香囊餘淚血一點點將幽情描寫殷勤說休辭䟦踄難道便心如鐵小桃紅與越調異轉眼處春光謝屈指又朱明也消魂最是秋風冽牽情窗外驚飛雪看來都是冤和孽悔當初輕散輕別尾聲到如今成吳越做不得抱花蝴蝶先寄烏絲一𥿄斷腸帖正宫一調昔人以惆悵雄壯爲的葢取其有悲歌激烈之氣也固詞不難於呌囂而難於得體不難於縱放而難於就䋲是選諸作可爲各極其致本宫南詞之法程或者其在斯歟騷隱識大石調閨思刻依原稿王西樓念奴嬌序用江陽韻麗譙落月正野烏城上啼殘萬瓦明霜畵角聲中嗚咽處吹徹老梅爭放悽愴太灝宸遊乍臨靑闕土牛簫鼓天街景物果堪賞人爭攘紛紛綵仗簇擁勾􅉭尾犯序中呂換頭成行仕女簡春忙巧剪春旙彩燕雙雙試舞翩翩闘釵頭鳳凰惆悵偏我慮天涯人遠偏我慮山高水長又慮他心兒放萍踪梗跡兀自殢他鄕錦纒道以下俱正宮迅時光蚤花朝催開衆芳紅紫闘春粧最無情㶚陵岸上柳絲千丈留得住離人征鞅留不住離人去腸落得意傍徨夢飛度楚陽臺上雲山嘆渺茫生受處鄰雞忽唱錯教神女惱襄王傾杯序淒涼從君去冷綉房寂寞了梅花帳想揮淚陽關分袂河橋約在端陽准擬還鄕眼睜睜教我窮冬捱盡又過靑陽天便教人霎時相見又何妨玉芙蓉風和蝶戀香水暖魚翻浪正園林開到荼䕷海棠乍晴乍雨花容老輕暖輕寒愁味長相思恨牽纒怎當總朱顔消瘦不比舊時龎小桃紅註前歡娛事皆巳往淒涼事總親嘗雲迷楚峽空餘嶂彩鸞飛去臺虚厰秦樓更没簫吹響每日的教我怨悵裴航尾聲歸來有日同鴛帳還問他别來無恙只怕他做了天涯浪蕩麗情未刻王伯良賽觀音用眞文韻怕着羞添着恨看點點羅衫淚痕只落得燈前倫揾這叚相思誰道假和眞前腔我口兒推心兒肯悔那日停針閉門空惹個蝶驚蜂褪嬌軟肝腸做了硬心人人月圓他去後風雨無憑凖縱有靑鸞難傳信隔花陰眞是天涯近嬴得箇懨懨成病損纔知道眼前人更有誰爲温存前腔連日來打疊胭和粉便取次摧殘一葉身天公折罰甘心認這􅍟面惺惺背面親衷腸事待告訴靑天君不知聞尾聲謾說有情魂夢堪尋趂且捱他幾箇惡黃昏辨取和葉和根總付君大石名詞絕少卽一二傳世之作按其句調强半未稱入彀寥寥碩果足當一斑而謂其盡風流藴籍之㫖則吾豈敢所錄麗譙落月一套坊刻多訛今得停雲館袖珍樂府舊刻叅之似屬本來面目遂爲釐正其同雲萬里等詞因其命題皆屬咏物與是選意不相合容俟别刻以快大觀嶺樵隨筆白雪齋選訂樂府吳騷合編卷之一終

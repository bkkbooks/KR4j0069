front:
  text: 白雪齋選訂樂府吳騷合編卷之一
  hash: sha256:be52fe8124d76a900b3bb7d1251cd08edcc194fa52ce0cb5ea356a5dad45f07e
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4j0069_SBCK_001-1a}
body:
  text: 騷隱居士選輯半嶺道人刪訂仙呂題情翻北詞巳刻沈伯英醉扶歸用尤侯韻效于飛鴛侶天生就須知他前生福慧是雙修看星河織女共牽牛信三生夙帳原非謬這些兒都是舊根繇似驂鸞仙子騎鯨友皁羅袍標格江梅清秀更腰肢宮様纎媚輕柔尊前皓齒映明眸星前宻意符深呪廻風舞燕盈盈畵樓隔花鶯語聲聲好逑當杯暗覺春心逗月上海棠以下仙呂入雙調恩未休良緣不讓桃源後關情是丁香枝上荳􅞦稍頭笑生花夜月芙蓉眉着暈春風楊柳氷絃奏怕并州孤客綠鬢先秋江兒水莫學章臺柳臨岐盻遠遊等閒折入他人手結就雙雙鴛鴦扣歌翻楚楚琵琶袖錦帳重茵消受把個眼去眉來博得箇天長地乆僥僥令當壚心旣有題柱志須酬莫向風塵忙奔走只合向碧紗窗將夙願勾尾聲休嗟當日難成就兩下終須是匹儔着甚多情先自愁題情原稿未刻李文瀾醉扶歸用蕭豪韻聽𫾣窗夜雨知多少好一似愁人枕上淚珠抛熱急急心頭惡根苗看他兠底都來到可憐虚度可憐宵矻碀碀恨把牙尖咬江兒水仙呂入雙調點點燈花落沉沉香篆消冷淸清幾陣風兒峭滴溜溜雙眼何曾合悶懨懨一枕愁腔調想想思思顚倒幾轉柔腸一寸寸因他斷了皁羅袍夢到何曾身到兩頭單落得意綰心交口調滋味實難消眼傳恩愛如多少東墻咫尺相逢路遥西廂何處相思病熬哄心腸沾得些兒好香柳娘南呂看靑靑柳條看靑靑柳條牽人懷抱韶華肯逐東風老這些兒掛着那些兒掛着見景兒便偷瞧借名兒將他呌把絲桐謾調把絲桐謾調孤鸞自嘲離鴻誰噪尾聲花星一點空相照銀漢何時渡鵲橋把今世裡姻緣心上了紀情未刻沈伯明醉扶歸用家麻韻喜萍浮一葉相逢乍感天教兩意不爭差露水兒恩情且休誇風波倒惹動天來大只道章臺弱柳受攀踏却是餘桃苦被人驚訝步步嬌以下俱仙呂入雙調只得强赴徵歌向侯門下請不滿風流假繇他喬坐衙落得詞塲添個佳話留戀着那冤家明朝忍把孤㠶駕園林好悵逢時情同聚沙恨别時似風飄墜瓦何日似當年初嫁應不乆泛星槎須記取信非遐江兒水慘淡杯中月夢裏笳情堪腸斷人堪畵層叠叠離愁難禁架絮叨叨私語無休罷念念心心牽掛把袂相看只落得如癡似啞玉交枝更深殘蠟亂紛紛情珠似麻靑衫共濕眞堪咤料非關淚落琵琶一個翻身抱石欲待學浣紗一個險些又逐江魚化驚殺了病休文腰圍瘦麽忙殺了快袁宏休誇倚馬川撥掉情非耍賸今宵天一涯霎時間片片風花霎時間片片風花問重逢怕香塵路雜渴相思怎療他怪林稍啼曉鴉尾聲梁谿咫尺非巫峽只索把剰雲相迓認取桃源萬樹霞題情白雪齋改本張伯起醉扶歸用先天韻相思欲見渾難見眞箇是别時懊恨見時憐記當初未見悵無緣及至見來又結就愁千件見和不見奈何天怕見了又心兒軟步步嬌似下四曲俱仙呂入雙調夢遶高唐還留戀雲雨忙收卷似遺香在枕邊寂寞空餘舊時歌扇盻不到羅袖擁香肩看雙星移入參商殿江兒水陌上朝來遇阻萬千隔簾凝望梨花面泪眼迷離渾如茜東西𡵨路天來遠聚散人生飛電難割捨萬種思量無數迎人嬌倩園林好留一盻清波欲濺覻半面明霞欲燃何事蕭郞偃蹇似線斷晩風鳶空悲哽夜啼猿五供養歸來月轉看屋梁落影幃薄風牽舊愁流水急新恨海潮煎轆轤輾轉𫾣心碎砧聲一片只索向孤檠下影兒前衾裯泪冷寂無言僥僥令雙調膠絃聲歷落燼篆思聯綿加上些雨雨風風來厮纏吟不盡寫離愁千丈箋尾聲心頭掌上提千遍恍忽地耳邊嬌顫又是何處鶯聲溜的圓春寒夜午月浸花釀情種逗人吟懷走筆愁重未堪斵句倦來聊展名詞雖意態固巳擅塲奈韻律尚多失譜遂爾一時翻變庶乎全調諧和誰則日削方而圓我惟知引竹而肉云爾騷隱閨思白雪齋藏本巳刻杜圻山八聲甘州用魚模韻梨花小雨向紅窗支枕香冷燻爐因他禁害添却幾多愁苦别來望裡書頓杳憶到逢時夢也無怎教竟常如皓月同孤前腔換頭慵梳任塵蒙奩鏡不禁這香殘粉冷脂枯相思無那偏值鳥啼春暮非關薄倖心如石只是紅顔命合孤可堪畵梁間燕子將雛不是路風景蕭疎花自飄零鳥自呼可惜顔非故腰枝一捻瘦將無恨糢糊綠陰芳草天涯路目斷王孫隔楚巫愁無數白頭吟吟就情空訴竟成擔悞竟成擔悞棹角兒序連理枝無端剷鋤竝頭花等閒摧仆比目魚蠻將剖分交頸鴛反成單獨只落得冷瑶琴閒錦瑟空珠戸魂斷長途相思孽債前生罪辜難道是參商作祟偏照奴奴前腔雪濤箋忙將恨書霜毫筆難描離緒强擡身幾度思量空搔首一畨延竚多因是好中堪愛生嗔恩成怨將奴輕負無憑無據何時問渠怎能勾魂如倩女飛渡衡廬尾聲見時漫把前情訴訴時節怕又多閒語總是煩惱如山從教一笑除贈徐瓊英巳刻梁少白八聲甘州用江陽韻紅樓繡榜記風情千古猶見徐娘儀容聰俊月下素蛾相倣宮眉秀靨難描寫高髻雲鬟别様籹堪憐向廻廊花底端相前腔換頭念年少綺羅生長見家常偏愛淺淡衣裳清歌飛動天外野雲䬙颺門盈海内文章客斷盡江南刺史腸等閒將覉人忘却他鄕不是路何處劉郞引入桃源一徑長忙投訪見樓臺罨畵舞鸞凰珮鏗鏘分明閬苑飛仙降邂逅相將入洞房魂飄蕩似鴛鴦一􅍟相偎傍踏翻春浪踏翻春浪解三酲生受處錦衾羅帳促急裡蝶趂蜂狂燈兒剔處歡心暢東風横燕鶯忙亂茸茸林花着雨胭脂濕軟怯怯水荇牽風翠帶長金鈎上看烏雲撒處旖旎聞香前腔頃刻間霧迷青嶂霎時裡花落河陽長亭一曲陽關唱青衫袖涙千行最堪憐半江露滴芙蓉冷恰正是兩岸風凋楊柳黃情難忘總笑歌深處獨自淒涼尾聲姑蘇東望添惆悵一騎重看入豫章却指金陵是故鄕代周非月賦别阿蟬原稿刻袁鳬公八聲甘州用尤侯韻冤家聚首似漆膠相和魚水相投嬌歡宻愛没遮攔媚眼横秋魂銷反覺少話頭心醉頻忘酒政紏放情繡幃中緊抱濃勾皁羅袍自小平康馳驟竝無人像你放誕風流可憐香影墮青樓做了水中萍草風中柳攢眉强笑牽衣詐留昨宵今晚何年罷休因此上傾心願締鸞凰偶羽調排歌鼎貯名香筵集勝流證盟心怎顧嬌羞誰知平地起戈矛頓聳香兒逐楚囚焚鴛被破彩舟江城不許韻人遊羡你多瀟洒咱也不怨尤兩人從此倍綢繆掉角兒序到來朝偏教逗遛重歡聚知音羣友垂虹亭月色勝前載花舟酒香依舊問歸期生離况話兒兠眉兒皺可勝僝僽緊携素手相看淚眸恨不得月波深處竝頭消受尾聲暫分離應不乆只在我梁溪歸後與你端午金閶再和酬擬閨人托鴈寄情改刻沈青門八聲甘州用齊微韻相思無底這幾時教人獨守香閨從他别後杳没數行書寄多管是戀新忘舊好因此上將人輕棄遺心癡何日裏得展秋眉前腔換頭情衷訴與誰枉教奴暗數歸斯空庭徙倚落得腸斷魂離關山阻隔人又遠瘦損香肌他怎知凄其挨不過月轉花移不是路黙黙傷悲忽聽得南來一雁兒聲嘹嚦呀呀哀怨過樓西夣驚回慌忙推枕披衣起囑付靈禽莫浪飛煩稍逓半函都是燈前淚許多愁味許多愁味解三酲蓼花灘莫教濡滯蘆荻岸擇伴相依趂西風一翅翔天際薄倖客蚤尋覔總利名韁鎖身縈繫難道春色全無隴上梅相煩累向那人傳示切莫遲遲前腔聞他在漢南湘水又道在渭北燕磯又道在長安客裏曾留跡又道在錦江湄總天涯浪蕩無消息望你逐處追尋他極蚤歸相煩累若得箇上林隹信不負逢伊尾聲枉叮嚀空歡喜驀地騰騰飛起却是南柯一覺裏詠輕雲贈王秋卿巳刻梁少白蘇臺王子小字輕雲性度通明風儀秀整高歌淩乎白雪游藝擅乎朱絃同心學結似西陵松下之蘓香翰盈箋類萬里橋邊之薛北溪華子攜之草堂心聲頓起于筵前目色橫生乎燈下悵佳人之難得感勝會之不常遂搆斯篇以應來命桂枝香用魚模韻江東日暮亂山無數天邊長鎖春陰嶺畔半橫秋樹陽臺夢紆陽臺夢紆襄王凝竚朝行何處暮天低迷却南來雁關河未有書不是路曾上衡廬見一片飛來萬里餘蒼梧遠飄揚踪跡定何如路崎嶇重重隔斷瀟湘渚何日乗風下九嶷休回顧翠華不見迷歸路幾時還遇幾時還遇長拍舞按霓裳舞按霓裳歌停金縷送月來被人間留住這是蕋宮仙馭軃雲鬟遊戲天衢盡駕絳綃輿引飛瓊控兩兩彩鸞歸去幾見瑤池傳曲遠更洞口笑人迂問仙姬何事冐雨濕羅襦又不知春山鎖翠何日還舒短拍襯煖成綿襯煖成綿催寒做雨伴茶煙細繞簷隅何處是郞居任千里隨風遍訪無拘曾渡秋風汾水至今共塞非雁空飛尾聲山中住原無侶數被淸風引去終有日歸來返故閭旅思白雪齋藏本屠長卿桂枝香用車遮韻靑燈殘夜蕭條旅舍夢雖多燕約鶯期事巳共水流花謝聽𫾣窗敗葉𫾣窗敗葉助人凄切杳難休歇鼓鐘絕無限衾裯冷難消心上熱不是路情種些些打起愁城千萬疊無明夜懨懨心病費周折去程賖一鞭風雨和殘雪信斷衡陽鴻雁帖眞抛撇佳期自分成吳越我涙痕似血你寸心似鐵長拍合浦珠分合浦珠分延平劒别問雙環是何時節向君平問卜怕人知不敢明說枉自把錢跌想五行八字合受顚蹶有限眉峯無限恨靑衫上淚成血急整片㠶歸也又恐怕江寒夜靜空載明月短拍歸思迷離歸思迷離愁心哽咽怪家山霧黯雲遮驚夢怕啼鴂逢驛使隴梅徒折冷落繡幃香煖恨陽關當日唱三叠尾聲好姻緣多磨滅料應是前生欠者把玳瑁簪燒羅帕裂擬劉采春寄元微之有引未刻王伯良唐劉采春故越州名妓微之刺郡時眷愛甚至故白樂天謔微之詩有因循歸未得不是戀鱸魚之句註言戀鏡湖春色耳葢指采春也采春雅善樂府所作羅嗊諸曲迄今猶艶人口余意微之去郡後采春當有詞寄戲爲擬此桂枝香用蕭豪韻江南春早天涯人杳倩他驛使無憑寄去梅花不到斷腸來幾朝斷腸來幾朝朱絃新調紅牋殘稿恨難抛燕寢香仍在旗亭柳正嬌不是路翠冩丹描萬壑千巖畵一條山陰道風流太守自才豪喜相桃你玉皇案畔司花巧神女峯頭待雨喬多顚倒尊前誤采春紅小淺顰輕笑淺顰輕笑長拍鏡水鱸魚鏡水鱸魚吳堤芳草白傅謾勞狂誚西陵話别憶消魂幾度江潮淚點在氷綃怨使君薄倖負人年少吟就聲聲羅嗊曲酬不得可憐宵無奈蝶煩蜂惱把金釵買卜零亂雲翹短拍司馬情多司馬情多靑衫恨悄問何人此夜江臯更錦水寄風騷一字字校書詩好我怎比崔娘妖麗題尺素千里托廻飈尾聲算前期眞難料菖蒲花謝五雲高春色靑靑總易消歡㑹原稿巳刻王百榖桂枝香用蕭豪韻今宵何夕月痕初照等閒間一見尤難平白地兩邊凑巧向燈前見他向燈前見他似夢中來到何曾心料怕人瞧驚臉兒紅還白熱心兒火様燒不是路緣分難消欲笑含羞分外嬌低低道道忍教虚度可憐宵夜迢遥陽臺分得春多少剰雨殘雲别様嬌怕燈兒照枕邊力怯鶯聲俏半推半要半推半要長拍點簡風流點簡風流綢繆懷抱霎時間粉褪香消雙眉鎖黛瘦東風一捻纎腰慵整翠雲翹怕分離寸寸柔腸如絞有約明朝窗外月休洩漏這根苗守盟言心上牢牢柰情翻意覆生出波濤短拍珮綰雙鸞珮綰雙鸞情同匹鳥願靑靑柳色常嬌珍䕶最長條怕攀折添人煩惱怎效連枝竝蒂竟生生世世莫相抛尾聲暗中天地焚香告切莫犯參商酉昴羡煞雙吹碧玉簫辛未秋日紅橋庄居詠遇巳刻梁少白二犯月兒高用先天韻月冷靑松殿秋閒廢宮苑偃息長林下滿壁生蒼蘚瘦比黃花猶意那人面西窗亂葉淸霜剪宋玉悲深淒涼紈扇天别恨巳三年除非是再續鸞膠方歸舊庭院按此曲中一叚犯五更轉後一叚似犯梧葉兒姑闕之桂枝香秋鴻巳遠春鶯方囀誰知路入花溪有箇
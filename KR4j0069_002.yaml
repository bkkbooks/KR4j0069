front:
  text: 白雪齋選訂樂府吳騷合編卷之二
  hash: sha256:097614e16b31c8cd5cd88d450dbffbef7d722fcbe4cb650e562b4fd1fcd3812e
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4j0069_SBCK_002-1a}
body:
  text: 騷隱居士選輯半嶺道人删訂中吕題恨未刻張伯起泣顔回用家麻韻解語一枝花被霜凌雪妬芳華香消玉減零落了鬒髻堆鴉雙蛾恨鎖遠山橫冷淡無人畵一霎時平地風波兩邊廂對面天涯前腔換頭堪憐𥿄帳冷梅花相思夜夜空到窗紗夢中親見訴不出許多情話魂搖魄亂那些兒一刻千金價陰霾障二六巫峯邊聲噪十八胡笳長拍仙吕悶擁離鸞悶擁離鸞愁縈意馬兩鴛鴦驚散汀沙檻猿籠鳥更那堪路遠途雜血淚洒杜鵑花雁聲孤漏沈沈怎禁牽掛一𥿄魚牋難盡冩轉教人萬縷春情亂似麻眼前雖望斷七香車豈無緣向太湖石畔㡌亥烏紗短拍同前子晉風流子晉風流潘郞温雅奈不在宋玉東家空懸望眼巴巴悄無言粧聾做啞待得債緣滿也看彩鸞飛雙駕赤城霞餘文强寛懷抱終難罷鎭日無端自咬牙恨一似明妃馬上琵琶閨怨未刻陳秋碧泣顏回用家麻韻薄倖忒情雜不比尋常作耍出門容易而今海角天涯歸期歲晚轉頭來過了春和夏去時節霜老芙蓉却又蚤水冷蒹葭前腔換頭奸猾心性最難拿瞞人利齒伶牙悠揚不定猶如風裏楊花千思萬想恁從來色膽天來大恐習學竊玉偷香唐突了相府高衙撲燈蛾恩情如捻沙淸苦似嚼蠟知他在那廂偎笑臉虛擔着許多愁病也不索尋消問息到頭來終有個還家風流罪招繇細數從頭兒一椿一件自詳察前腔風兒颼颼亂刮雪兒紛紛宻洒淒淒的鳳枕單鴛帳冷薄怯怯繡衾寒壓也懨懨的銀燭爆花嗚嗚的城上吹笳鼕鼕的殘更正煞呀呀的曉天啼散樹頭鴉尾聲文君再把香車駕只恐琴心調弄差反與相如做話靶此曲原與三弄梅花北詞相和成套而韻選中獨載南詞諒亦别有所本且易煩就簡而詞氣頗無叚續之病因爲錄刻嶺樵秋懷翻元詞未刻沈伯英泣顔回用監咸韻風露怯靑衫窗冷月斜燈暗濁醪吞恨黃菊帶愁同簪天南地北悔隹期却被虚名賺哭哀哀似泣露寒蛩氣絲絲如做蠒春𧖟駐馬聽沈約羞慚都道年來腰瘦減潘安驚慘自嘆如今兩鬢鬖鬖鴛衾錯送玉清庵鸞交空閃藍橋站休笑休譚我這吟肩慣壓相思一擔漁家燈墨憨齋謂犯兩休休紅芍藥剔銀燈三曲名之日兩紅燈風流謎着緊包含因緣簿忒煞􅮡自從他暗與香囊别時痛剪春衫更堪剖破菱花鑑都斷了雁帖魚緘憨憨秋光過三鎭日把離愁自攬千秋歲病難甘轉覺文章淡更秋思撩人心坎憔悴空擔憔悴空擔無意把兎毫龍香頻蘸綠綺斷紅葉黯高唐賦空掇賺舉目羞披覧說甚讀書人自來餓眼偏饞尾聲須有日看花結果了偷香膽且寧耐紅愁綠慘管受用翠幄牙狀金鳳毯春遊巳刻高東嘉泣顏回用蕭豪韻舊名好事近誤論詳後東野翠煙消喜遇芳天晴曉惜花心性春來起得偏蚤教人探取問東君肯與我春多少見丫鬟笑語回言道昨夜海棠開了前腔換頭今朝特地到西郊端的是萬紫千紅爭巧花情酒債一生被他縈擾雕鞍駿馬會王孫貴戚把金樽倒有時節沉醉花前把金丸墜落飛鳥千秋歲杏花稍間着梨花雪一點點梅豆靑小流水橋邊流水橋邊只聽得賣花聲聲頻呌鞦韆外行人道粉墻內隹人笑笑道春光好把花籃旋簇食櫑高挑前腔俊多嬌他只顧貪歡笑却不道冷被人瞧綠柳陰中緣柳陰中藏身暗折花枝來到低聲問奴容貌比花貌爭多少又被才郞惱道花枝勝似奴貌妖嬈越恁好又名走山畵眉閙花深處閙花深處滳溜溜酒斾招牡丹亭左側尋女伴鬭百草翠巍巍柳條翠巍巍柳條見忒楞楞曉鶯兒飛過樹梢撲簌簌落紅舞翩飜粉蝶兒飛過畵橋一年景四季中惟有春光好向花前暢飮月下歡笑前腔乍晴還乍雨乍晴還乍雨暖融融景致饒見游人往來貪歡笑舞鮫鮹閙咳咳笑高閙咳咳笑高見骨碌碌小車兒乗着艶嬌嬌滴滴眼兒弓彎彎小脚兒一捻舞腰十分俏難畵描蕩漾春心了怎教人對景辜負年少紅繡鞋此曲與譜中三體俱不相合不知所本聽一派鳳管鸞簫鸞簫見一簇翠圍珠遶珠遶捧玉鐘酒沉倒歌金縷舞纎腰任明月上花稍前腔花枝明月多嬌多嬌三般凑逞妖嬈妖嬈一様妝最波俏花陰下閙炒炒醒來時不覺夜深了意不盡從教酩酊眠芳草高把銀燭花下燒韶華易老休把春光虚度了春恨翻元詞未刻沈伯英石橊花用東鐘韻碧桃花外忽聽一聲鐘醉魂驚散夢巫峯那堪雨雨更風風恨香消獸冷花落鏡塵蒙嘆雲寒西樓燕子空舊桃源路迷仙洞單守着伴孤燈矮屏風悶彈哀怨泣絲桐駐馬聽帶結頻鬆瘦骨誰禁愁緒冗眉峯難縱鎖住雙蛾幽恨重重瑤臺人遠信勞鴻彩雲聲斷簫閒鳳怨綠羞紅百般難把悶懷相送剔銀燈看花去誰與同探舊叢待月處簾櫳誰共日長又怕更偏永都不見紅團綠擁他似飄蓬全無定踪教我愁對着落紅舞風漁家燈註前從别後帳冷芙蓉許多時曲罷梧桐餘寒在簾控金鈎誰寄錦箋鸞封袖中怕濕瓊珠迸恨王孫芳草花驄對靑銅空陪笑容全不比崔徽畵中尾聲剰雨收殘雲逈朝暮相思萬種十二峯頭總是空感舊王伯良漁家傲用眞文韻我只道再到天台訪玉眞溪邊路尚有桃花還存舊人昨夜忽傳靑鸞信開緘不忍空孤負前度劉郎這些時心慘片雲又誰知粉謝香消巳七八春剔銀燈好姻緣幾年厮渾惡相思半生作狠恨孤辰伴着紅鸞運說嫁字是伊先肯啼痕紅衫半湮盻不到荆釵布裙攤破地錦花秀才們終則是拏不穩欲吐又吞匆匆的誤了侯門從此靑樓鏡别釵分見無因竟化做了杜鵑魂麻婆子血書血書題不了猩猩一𥿄存繡履繡履香不散纎纎三寸新分明記得夢中身眞娘墓草痛難認有淚有淚臨風隕泉下不知聞不用尾聲散曲中向無石橊花曁漁家傲長套今得前曲固足補昔人之闕且情文韻調無不到家允稱作手騷隱閨情未刻楊德芳瓦盆兒用尤侯韻西陵渡口西風吹不到木蘭舟憔悴殺一雙眸俺這裡淚珠和雨滴江流他那裏背前盟别上了靑樓敢只是那人兒兩意投因此上戀新忘舊毎日家枉費心慢咨嗟空僝僽辜負却花月好春秋橊花泣石橊花碧紗窗下簪折鳳凰頭恩山誓海總成愁香殘粉冷幾時休當年雲雨都向夢中求泣顔回言不應口這相思何事多顚覆滿襟懷飯廢茶荒這都是恨惹情兠喜漁燈與雁魚錦第四曲不同幾回耐着心兒守歸期難候消和息眞箇藏䦰魚雁總沉浮同心兩字俱差謬再休題花老鶯愁休休相思盡勾只恨我明珠暗投攤破地錦花慢追求扯碎了鴛鴦扣苦不自繇驀忽地上了心頭夢斷高唐魂冷莊周恨悠悠雲雨暗玉簫樓麻婆子怪你怪你多薄倖金釵當酒籌笑我笑我忒情重香囊緊護收你一般恩愛兩般丢我黃花何日逢重九寂寞躭憔瘦做織女盻牽牛尾聲風風雨雨敲窗牗珠涙難量升斗只落得花自凋零人自愁題情白雪齋藏本與時刻異高深甫瓦盆兒用庚靑韻相思到底爲他害得不分明金屋夢玉關情只爲着别離兩字等閒輕因此上鴛鴦陣擺做了愁兵未知道自别來他心可至誠他應恨魚沈雁靜不道我仲宣愁相如渴躭孤另枉教我欹枕對殘燈橊花泣石橊花誰知一别蹤跡便飄零怪煙雨隔江城只見天邊圓月幾回明紗窗半掩一派冷淸淸泣顔回淒涼淚傾把不住幾陣渾身冷飮弓蛇空自心驚照石鏡見他無影喜漁燈註前音書欲寄情難罄雲樹瞑相思債欠下了前生今日却怎生怎生掃却心頭病虗擔着雨剰雲凝風情全無半星斷人腸寒蛩幾聲尾聲絮叨叨眞難聽攪得我神魂不定好一似吞却金鍼和線攖憶舊未刻卜大荒瓦盆兒用先天韻落紅滿地驀忽又蚤晚春天愁黯黯恨綿綿惱一畨蜂鬚蝶翅趲韶年最無奈冷淒淒夜月咽啼鵑只辦取悶支頥撥殘獸鼎煙詫香塵糝盈琴面幾時得訴離悰在枕邊重留戀煞强似剰枕伴孤眠橊花泣石榴花閒將往事細推原何心去整花鈿鳳釵敲損雀鬟偏殘粧儘膩瘦臉淚常懸泣顔回愁腸萬轉這人兒漸巳生爻變濕胭脂淺暈桃腮裙摺縐石榴羅軟喜漁燈註前怎堪靜鎖深庭院難自遣鴛鴦拆翡翠巢顚兩葉眉可憐可憐怕覩雙飛燕還羞種竝蒂嬌蓮燈前合歡帶剪覔黃耳音書倩傳尾聲風流子在那邊欲待尋他夢裏言又恐陽臺驛路遠秋夜傷舊未刻梁少白瓦盆兒用蕭豪韻虗堂坐雨西風蕭瑟起林臯聽落葉小窗敲怎禁他雲房獨掩夜寥寥空嬴得淚痕濃黯淡了鮫鮹誰憐我破題兒新秋第一宵你何處絕無音耗想那里郵亭稀雁魚少書難到詠楚些魂斷倩誰招橊花泣石榴花簾櫳深處常獨伴那多嬌今只剰影瀟瀟只見粧臺塵鎖翠鈿抛羅衣帶結猶繫紫絲縧泣顔回記恩多怨少十年心難􅍟傍人道漫追他舊日風儀祗憐伊病來容貌喜漁燈註前幾回欲覔巫山廟怕飛夢杳陽臺下空雨暮雲朝雖則是遇伊遇伊又被鷄驚覺鴛衾冷轉覺無聊烟消風花露草好添香寒灰怎燒尾聲蓬山隔雲路遙再休想同吹月下簫腸斷東風第五橋秋日閨情巳刻毛蓮石好事近用東鐘韻墨憨齋定名顏子樂詳後泣顏回風月兩無功枉把心機牢籠巫山雲雨一旦杳然無踪刷子序隨風奈向樓頭譙鼔聽沉响又打三鼕普天樂寂寞恨更長漏永便做了歡娛夜短却共誰同錦纏道以下俱正宫路難通料隔着雲山萬重空蹙損兩眉峯暗銷魂没情没緒倦理殘絨有愁來全仗酒哄醒來時依舊還同暮皷又晨鐘韶光荏苒歸期尚未逢怕染潘郞鬢被他依舊笑春風普天樂同上減芳容愁越重罷却了描鸞鳳雕簷畔鐵馬叮咚紗窗外絮聒寒蛩砧聲又攻更那堪雁聲嘹嚦長空古輪臺中吕恨無窮西風蕭瑟助秋容别來望裏關河夐寒衣誰送寄與君家料想是覔却芳容誤我佳期一塲春夢欲將心事問孤鴻想當時曾共翠被生寒馥香温軟到如今蓬鬆兩鬢釵橫髻亂修眉懶畵别後苦匆匆思前事教人心下氣沖沖尾聲聽敗葉𫾣窗縫悶對殘燈午夜風展轉無眠珠涙湧代寄呂姬小喬巳刻梁少白好事近用車遮韻泣顔回書寄秣陵賖奈樓前雲水重疊落花飛絮那堪暮春時節刷子序淒切夜雨曉風臺榭空梁燕誰遣來傳說普天樂道佳期休虚度也絮叨叨恰如窗下分别橊花泣石橊花追思當日别館酒初設逢迎處繡簾揭匆匆禮數甚周折泣顏回看趍承舉止羞怯腰圍一捻似縈欄弱柳絲牽惹鬬纎軀掠水蜻蜓試輕衣逗風蝴蝶此曲犯體第五句較譜未合詳論於後錦纏道正宫玳筵列滿華堂會當年俊傑初相見甚干涉料姻緣前生未定難道就和恊怎知伊多情的姐姐含情處眼波雙借翠帶兩偷結佳期宻邇相將不暫撇宴罷催歸去笑蹁躚同上七香車千秋歲那冤業只道難消受誰知道蚤便寧貼公瑾當年公瑾當年渾如綴着喬家枝葉春衣褪雲鬟卸相偎處身兒趄故把羅幃扯怕花燈斜照回過桃頰普天樂正宫向蒼穹把盟香爇負心的天難赦繡囊中雙貯烏雲羅衫上􅍟粘靑血從今記者這恩情忍教中道輕絕鮑老催黃鍾帝城鳳闕靑樓雖是多歡悅銀蟾長恨空圓缺奈山鬰盤水潺湲雲明滅腮懸玉筯啼應裂胎含荳􅞦春方洩心摧銕馬秋爭掣古輪臺記初别疎林處處下黃葉那堪逆旅西風夜孤村茅舍況枕塊衾鐵酒醒處依稀蘭麝敗壁蟲吟破幃燈射夢魂中猶記語些些道我音書頻寫雁南來蚤寄回帖休常恁雨散雲收氷消瓦解水流花謝莫遣坐銷歇恩難捨還期同宴錦堂月尾聲遇良辰逢佳節管領着歌臺舞榭日日春風醉狹斜寄趙袁卿巳刻梁少白好事近用尤侯韻泣顔回人去莫登樓況當風景三秋蘓臺雲冷敎人目斷長洲刷子序悠悠試看霜空征雁分明寫一字字離愁普天樂空悲怨團圓未乆爲甚匆匆頓拆燕侶鶯儔錦纏道正宫記緣繇爲當時情和意投年少更風流這姻親朝朝暮暮來往扁舟意仙姬初難匹偶誰知道便容消受遂爾兩綢繆巫陽縹緲雲深雨不收靈鵲千羣駕似
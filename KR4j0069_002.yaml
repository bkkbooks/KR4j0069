愁淒風逗把玉簪𫾣折鴛鴦脰羅襟扯斷芙蓉扣哭盡紅衾淚應枯眞箇是天還知道和天瘦大砑鼓同上或作迓并州欠滯留一回蝶夢片晌鷹鞲誰教蓮子栽成藕又誰教波浪打眠鷗似露水姻緣終難到頭撲燈蛾傷心燕子樓腸斷章臺柳剰粉與殘脂只留取淹人衫袖也鎭懨懨病酒爲伊長日鎖眉頭悔當初錯將放手成差謬枉教織女怨牽牛尾聲你多情難學臨卭走我薄倖空躭桃葉愁縱骨化形銷恨未休得書未刻王伯良橊花泣用新定居蘧韻石橊花經年驛使望斷隴頭書驀忽地寄雙魚不知書中消息是何如泣顔回急開鈐印雙朱匆匆看取打頭來便寫着相思句那些兒幾字蠅頭恰分明滿𥿄明珠喜漁燈幾畨讀到傷心處淚零似雨你爲我病損柔軀說覔人寄書寄書書去魂亦去𥿄梢上涙點沾濡何須千言萬語殢人情一行起居撲燈蛾别時新月生約定登樓處兩下遞思量問記否臨𡵨私語也清秋時序數歸期巳近茱莄儘盻殺暮雲春樹只教我對西風黯慘自嗟吁尾聲萍踪浪跡難憑據因循辜負你個女相如眞是腸斷蕭娘一𥿄書時本皆以橊花泣誤作石橊花而不知石橊花自有本調如譜中朔風􅏮􅏮及前所選碧桃花外一體是也今改正其橊花泣第三句應以譜中忍將身命掩黃沙句爲法今俱用三字作二句第四句應以撥雲見日枯樹再開花句爲法今用泣顔回第四句體不知果何所本至於首句點板照譜似非起調今從俗本宫名作輩出未能悉收所恝然者如折梅逢使諸曲向來膾炙人口奈用韻旣雜而所接漁家傲等闋實欠體裁削方爲圓旣有礙於古詞而扭曲作直猶不便於按拍故不敢違心以逢世云嶺樵漫識南呂題情照江東白苧改刻金白嶼紅衲襖用侵尋韻嚲香肩鬆臂金削纎腰寛帶錦這些時懶把生綃理針絍羞將寶鴨添水沉自别來還至今幾曾時放下心不能勾一霎徘徊兩意綢繆也只落得長夜孤眠伴繡衾五更轉冷鳳幃虚鴛枕對金樽誰共斟淒涼此際難消任誰料冤家薄情特恁到今來猶記得花前飮閒窗寂静空顚窨彷彿逢君梅花月蔭浣溪沙他負心眞忒甚枉教人肺腑簽針金錢不准年來䜟錦瑟空閒月下吟身􅏮􅏮不繇人不迷魂没合煞空勞我吊膽提心東甌令心中印口中噙到向那陽臺曉夢尋清宵淚滴衫兒袵桃花冷胭脂沁畵欄月轉粉墻陰無奈漏沉沉大砑鼓或作迓逢人覔信音奈衡陽雁杳湘浦魚沉傷秋漫把閒愁禁怎當他夕陽歸鳥下疎林撇却歡娛翻成病侵節節高秋來意更深漫思尋音書欲冩還厮噤空追審不見臨因些甚兎毫血蘸尖兒浸鸞箋墨灑行兒淋一緘離思逐雲飛遍身香汗和衣滲金蓮子倩塞禽多情定見機中錦料應是長吟還短吟爲甚的惡姻緣更重重遠水又遙岑尾聲算來人世多䜛譖大都常是負初心誰似我海様相思直到今按此曲爲白嶼得意之筆但其本領原優於北調脫畧南詞楚學齊言未免有礙復閲少白江東白苧詞中乃有改作而詞意格調自然曲合固知少白爲曲中聖也騷隱原評寄楊姬幼眞有序未刻張叔周𬗟維戊子縱步秦淮偶度虹橋之楊氏欣逢閬苑之玉娟盈盈十五芳春皦皦三千絶世嬌來笑語渾疑一騎塵飛倦倚迷離郤訝沈香亭畔方幸繡幃之春暖俄驚錦䌫之秋風寂寞扁舟嘆文鴛之暫隻淒涼寶瑟傷彩鳳之常孤斷弦何日續鸞膠朔風兹厲錦字一朝傳雁足芳草向榮重以血涙詩新加之繡囊縑素鍾情獨至寓意良深圖報愧乏瓊瑶寄意聊𢋫律吕庻雙簪玉鳳期髻綰乎靑絲而六幅名花詎帶寛於團扇紅衲襖用庚青韻記初逢秋月盈乍相看紅玉映兩點涓涓眼波淨雙彎藹藹眉黛輕展羅襦飄麝氷啓朱唇語燕鶯那更額印芙蓉臉暈桃花也霧髩雲鬟翠靨明五更轉教我意馬馳心猿競他掩靑團秪笑迎筵開玳瑁金樽罄一曲淸歌碧天雲靜背畵欄偷自把香肩並心招目允幽期訂有分劉郞巳入天台佳境浣溪沙龜甲重流蘇整裊薰籠一縷煙凝輕拈荳􅞦嬌還倩細吐丁香欵不驚幽夢醒不覺得透酥胸浥香汗喘吁吁耨耨低聲東甌令迷香窟殢花營一片春心不恁撑朝雲暮雨歡無竟又重九西風冷蕭蕭落葉短長亭執手暗叮嚀大迓鼓扁舟度石城花濃帝里莫負深盟鴛鴦隊散憐孤影鸞凰巢拆痛哀鳴死别生離音沈路㝠節節高雙魚千里程語叮嚀生綃血淚斑斑剰新詩哽音律清揮毫正香囊萬縷裁花勝鍼鍼線線堪人敬寄語湘裙六幅花腰圍未必剛相稱金蓮子賦别情花箋天様應難罄把紈扇共烏雲付卿更看這鳳頭簪一雙雙綰髪誓今生尾聲一緘書權折證扺多少同心兩兩結西陵怎做得薄倖王魁負桂英紀遇照墨憨齋改刻高深甫太師引用眞文韻花飛陌上春將盡妬東風殘香逐塵溪山下水流花恨林臯外雨缷春魂令人一見情難忍禁不住眉鈎目引分明是巫山彩雲向人間出落賣弄精神鎖窗寒斷人腸風雨紛紛恍惚相憐意自勤看他多情多趣宜喜宜嗔形容玉軟衣衫烟潤全不是尋常丰韻此心因他撩惹不繇人便敎兠地銷魂三叚子黃鍾風掀練裙襯丹霞梨花吐雲春生笑顰濕胭脂櫻桃綴唇腰肢妬雪飄輕俊身裁艶月憐淸潤瀟洒飛烟風流絕塵東甌令身嬌怯性温存幾轉秋波玉澑頻春心寄托鴛鴦陣蜂蝶牽愁悶靑樓朱箔見無門此恨向誰論三換頭前二句五韻美中四句蠟梅花後四句似犯梧葉兒譜亦未詳姻緣妬人從來無准恩情未眞怎生便親自笑没根牽引似浪裏萍飄泊恨誰曾憐憫惜别愁成病難忘見是恩封揲游魂何處是漁郞可問津解三酲倚雕闌低頭自忖怪畵槳頃刻平分雨窗寂寞今宵恨從此後惱晨昏雙魚未許能吞餌尺素何繇得到君忙偷揾止不住盈盈望眼滴滴啼痕三學士自分相逢無遠近這其間事涉寒温如今天近人難近畢竟是寒温没半分野水平川愁隱隱芳草路怨埋輪節節高青山隔暮雲惜殘春尋花問柳空勞頓
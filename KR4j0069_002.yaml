留香羅半幅詩一首做一箇香囊兒緊收怕見那綉鴛鴦一雙雙交頸睡沙頭尾聲等待他來時候薰香重整舊衾裯把往事從前一筆勾寄王桂父有序巳刻梁少白無翼而飛者聲也不根而固者情也聲繇虗發故隨地而馳情自實生毎從恩而使非今獨爾自古爲然余性喜纒綿意偏感慨一承他人之微盻卽爲我輩之所鍾而況以楚館之神姬値秦臺之逸史心堅匪石契同若蘭陟馬鞍而宵誓同效弟子之和南駕鷁首而晨游獨憐夷吾之敗北感投囊之盈袖悵寄翰之連箱能無報惠之章遂著閒情之賦香遍滿用蕭豪韻雲容月貌尋常淡粧難畵描出落丰神年尚小一團都是俏還憐情性調總然萬種嬌不易得千金笑懶畵睂蘭房聲價一何高才調當年似薛濤因此上元郞不憚路途遙爭奈他枇杷花下音書杳怎能勾直至成都萬里橋金絡索金梧桐匆匆歲月消寂寂音容悄曾記蘭舟避跡濳移棹春山暗裹游東甌令怕相抛執手偎依厮纒着偸忙背語回身蚤針線箱側坐防人驀地瞧解三酲誰知覺懶畵眉至今猶認夢中遭寄生子今日呵又不是水遠山遙爲甚麽無消耗浣溪沙你情自投我恩難報最堪憐兩地蕭條憑誰訴與娘行道我不似靑樓名倖薄雖見許恐無憑話未眞實只落得夢斷魂勞劉潑㡌畫樓頻倚想雙蛾俏對簾櫳淒楚無聊瑶琴謾寫相思調音韻喬彈出些孤凰操秋夜月初夏交記那日人曾到蠅頭小字親相召誰知病滯文園老空回帖草草枉歸程渺渺東甌令難消受印心苗未必空亾坐本爻紅鸞幾日輪佳造必定有花星照那時節華燈燁燁影搖搖偷卸翠雲翹金蓮子鸞鳳交恩情美滿同歡樂這一叚姻緣兒怎抛恰正是遇雲英一雙雙仙子渡藍橋尾聲共引入蓬萊島仙源此去路非遙洞口雙吹碧玉簫閨怨未刻願道行香遍滿用尤侯韻别來時候孤鴻幾畨書未修恨叠秋雲無奈陡離情休未休何時却斷頭相思含兩眸血染楓林痩懶畵眉蘆花吹白上人頭鏡裏蕭疎不耐秋𫾣窗落葉冷颼颼人怯黃花痩把有限柔腸殢無限愁梧桐樹犯啇調梧桐樹愁躭白苧秋病怕黃昏後月暗燈殘冷落還生受常時有約何曾就人隔重門音書便有怎暗投五更轉鸞求雉雊無心奏帳冷香消只索把被兒空摟浣溪沙我心共口不自繇怎生忘口裏心頭心頭却怨參商驟口裏常躭歲月憂空厮守我這裏愁他别來乆不知他心有心丢劉潑㡌便教相見也難如舊想甚麽情意常投厖兒一半因他痩背地流淚濕靑衫透秋夜月生前欠修命兒裏孤星守背後人前名兒醜因他沾手難丢手見三星一鈎怨河分兩宿東甌令琴絃絕鏡塵浮鸞鳳空留釵竝頭同心帶綰何曾乆離恨常相守燈花鵲噪總休休歡喜夢中求金蓮子還自羞黃昏夜雨重門叩他别後歲月如讐恨殺那等閒間把靑霜容易白人頭尾聲風流滋味都嘗透那知我害不了的相思還有除非是夢裏尋他續斷頭閨情未刻王伯良香遍滿用尤侯韻從他别後相思那日不淚流想在心頭提在口想他没斷頭提他不自繇人前怕着羞瞞不得羅衫袖懶畵睂婦人家情性忒嬌柔他當日匆匆說遠游枕函邊悔不苦相留錯放却臨岐手嬴得恩愛無多倒覔箇愁梧桐樹犯啇調梧桐樹他離情挽不留我病眼看成疚送阻紅閨折不上長亭柳他蕭蕭馬去空回首我黯黯燈殘獨倚樓五更轉黃昏掩上紗窗繡從此經年做箇空房自守浣溪沙他囑付頻留連乆繫人心賣箇溫柔慢道受些憐惜償些瘦經得淒涼耐得愁情緒陡我爲他近新來對粧臺幾時得好好梳頭劉潑㡌他說道天河見鵲歸非謬誰知似籠鳩一放難收到如今荷花謝了芙蓉又煞逗遛只是我下不得將他咒秋夜月書信修寫罷纎纎手心事重重題難就啼痕點點封來皺有新詩一首并靑絲一綹東甌令親將寄幾時收他兩字平安報未酬多情恰喜多消受冷落殺淸秋候爲郞憔悴替郞憂又寒色到衣篝金蓮子歲月遒把金鞍盻斷君知否更莫問門前紫騮怪連宵眼睜睜和夢兒也不肯就牀頭尾聲説與他便相逢今非舊風流人去減風流只剰得常鎖眉梢翠一鈎傷逝巳刻凌初成香遍滿用魚模韻芳時輕度流光自來如轆轤把皓齒明眸容易誤可憎人巳無風流分巳孤英雄淚欲枯這冤苦慿誰訴懶畵睂錦浪愁看戲雙鳬忍聽垂楊聒晩烏淒涼更自恨居諸天公獨解將人妬只揀心疼的便下手毒梧桐樹犯啇調梧桐樹潘安果幾多沈約腰如許張敝何郞一箇箇揉碎了姻緣簿也是無端撞入桃源路一笑相逢便自情意孚五更轉乗槎巧向銀河渡月夕花朝鎭把琴心厮訴浣溪沙理舊絃酬新曲傲殺他卓女當壚燈前看繡青鸞譜席上同傾綠蟻壺良宵度也懷揣道秀才們何處福到今日生闖入怨府愁窟劉潑㡌西風一夜嬌花仆美前程到此囂虛夜臺前猶試他金蓮步㝠使符生板障陽臺路秋夜月空嘆吁恁恩情成畵虎蕙帳鸞牀都如故博山沉水閒無數那裏是他去所怎生爲咱計處東甌令空有行雲賦會眞圖擬得崔徽舊日模死臨侵儘着霜毫秃寫不出千愁簇顚來倒去眼糢糊百忙裹响銅壺金蓮子有計無問還丹道士在甚途便能助玉人兒體蘇也贖不了擁衾裯獨􅹽跧腸斷一春餘尾聲月明徙倚空庭步影隨身還疑伴侶怎禁得剗地回頭一個無閨思巳刻古詞針線箱周眞文韻自别來杳無音信昨夜裏燈花未准五行中合受淒涼運眞箇是惱人方寸有時節獨立在垂楊下可奈枝上流鶯和淚聞合愁悶損縷金衣上一點點都是啼痕此調時腔皆作觧三酲唱殊爲可㗛前腔過一日勝似三春看看的春光將盡害着不疼不痛懨懨病漸學道帶圍寛褪正是落紅滿地胭脂冷早雨打梨花㴱閉門合前解三酲仙吕待寫下滿懷愁悶更說與外人不信廻文錦詞徒織就倩誰訴與斷腸人幾畨待撇尋思别事因爭奈一夜歡娛百夜恩合縈方寸非因害酒只爲傷春前腔換頭海棠嬌等閒憔悴損又不見當時花下人東風不𬋩離人恨苦吹散楚臺雲如癡似醉悠悠勞夢魂恨不得飛上靑山立化身合前尾聲恨薄情無憑准終朝思省淚珠湮這様傷心空自忍春閨白雪齋改刻史叔考針線箱用歌戈韻萬斛愁等閒堆埵終日裏長眠短臥看嬌鶯乳燕啣花朶俏不學繡簾穿破嫩紅香斷送在雕欄外九十日春光似擲梭愁城大悶無聊空自怨粉羞螺紅衫兒換頭爲甚的躭饑餓爲甚的受攧簸爲甚的淚眼滂沱爲甚的蟬鬢婆娑總差訛做下了平地風波將人來結果雖只是紅顏命薄忍教人没下落太師引換頭相思闖破重門鎖夢魂兒天涯任過你雖做無情喬木怕難辭有意絲蘿若還肯將錯就錯愁甚麽有舟無舵敢只是那傍人調唆又添個做媒的學了蕭何醉太平仙吕換頭蹉跎花情柳思做半牀春病一枕沉疴追思往事眞個是夢裡南柯騰那空憐孤另似姮娥除却你便當數我良宵躭閣人間天上都是愁窩三學士數尺紅綃雙足褁驀忽地線斷絲磨浮生巳信霜前草弱質誰憐燭底蛾十二時辰都折挫只恨自敢嫌他大砑鼓或作迓佳期無奈何洛腸逢我花謝偏多騰騰熖烈祅神火咫尺藍橋漲白波有限光陰都歸病魔尾聲珠淚彈衫兒汚一點傷心無那跳不出情山與愛河此曲子猶先生向有改作頗稱致家病中偶爾閱及妄爲効顰竟忘其工拙也附識嶺樵訪桃花美人巳刻張少谷懶畵睂用尤侯韻玉人家傍碧湖頭楊柳靑靑一徑幽璧桃花裏露紅樓輕輕試把門兒扣只見他正捲朱簾上玉鈎不是路謾整搔頭乍見花前尚害羞分離乆三春轉眼又經秋共登樓殷勤細把相思剖翻惹凄凉淚暗流慙拖逗你眞情豈似章臺柳教我怎生消受怎生消受掉角兒仙吕囀春鶯重聽歌喉向朝雲再依紅袖可憐人皎皎氷肌更如蔥纎纎素手且邀懽弄銀箏調寳瑟度新詞翻舊譜共傾杯酒櫻桃笑口秋波兩眸繡牀前醉鬆羅帶慢擁衾裯尾聲風情却喜渾如舊趂枕上月明時候殢雨尤雲樂未休幽期巳刻沈青門懶畵睂用庚靑韻寶花欄十二玉亭亭月轉層樓香霧凝嬌娥有約在初更徘徊立徧蒼苔徑驀被柳影風搖幾度驚不是路悄悄㝠冥只見他轉過沉香六角亭簾櫳映依俙環珮夜無聲乍逢迎對籠雙袖梨花冷寶釧金寒玉腕氷嬌癡性却纔相迓還相倩戰驚不定戰驚不定掉角兒序仙吕香枕挨銀泥翠屏煖裀鋪紫藤花櫈解酥胸釦脫珍珠吐丁香臉偎他杏怎禁他任狂蜂隨浪蝶倒靑鸞顚繡鳳喘吁厮應親親氣命低呌幾聲悄一似東風未曉月底聞鶯尾聲分明人在神仙境一叚巫山夢未醒明夜還來花下等題情巳刻沈伯英懶畵睂用魚模韻落日遙岑淡烟孤蕭寺昏鐘分外疎陽關剛唱一聲初早離人耳畔添淒楚生斷送黃公舊酒壚不是路歌酒呼盧奈酒債歌聲都被愁思拘關情處離離江樹片㠶速漫躊躇把沈魚落雁輕發付倩魚雁何年好寄書愁雲暮眼看生隔藍橋路好生難渡好生難渡掉角兒序仙吕喚人歸賔鴻亂呼撮怨恨秋光無數恰住着送客西風又添起助愁白露今夜裏明月洲黃蘆岸翠薇山靑村塢何處棲宿玉銷香㫁花殘月孤這的是五行刼運合受催促尾聲安排好夢尋他去只怕一夜淸霜㫁綠蕪渺渺長途將我魂夢阻題情巳刻照江東白苧詞沈靑門懶畵睂用尤侯韻小名兒牽掛在心頭總欲丢時怎便丢渾如吞却線和鈎不疼不痛常拖逗只落得一縷相思萬縷愁不是路無了無休鎭日縈牽不自繇難窮䆒只因幾度送雙眸謾追求假若他不應花前口爲甚麽還將熱話兠休相誘有心待共鬆羅扣不如蚤些成就蚤些成就掉角兒序任勾差隨時應酬趂埋冤總然承受不爭差性命心肝好一似爹娘骨肉又何曽氣兒呵情兒抝話兒嘲龎兒訕一些相鬪隨衙聽候朝來暮休但得個尤雲殢雨勝似封侯尾聲慿將風月都投首不信冤家不轉頭終有日飛上紅香燕子樓怨離詞未刻龍子猶繡帶兒用車遮韻離情慘何曾慣者特受這個磨折終不然我做代缺的情郞你做過路的妻妾批頰早知這般冤債誰肯惹被人罵做後生無藉靑樓裏少甚調風和弄月直恁蠢魂靈依依戀着傳舍前腔換頭作業千般様牽腸掛肚怎能彀一筆銷蔑似這般軟欵趨承再休提伶俐幇貼悲咽偶將飛燕閒問也你想不想舊時王謝心兒裏知伊冷熱只奈何得少年郞清清捱着長夜太師引他去時節一似無牽扯只教人捶胸呌絶自没個隻字兒傷犯也何曾敢眼角差别野鴛鴦心性終飛越說將起薄情難赦還㗛你自看做尋常狹邪把絕調的琵琶輕易埋滅前腔幾畨中熱難輕捨又收拾心狂計劣譬說道昭君和畨去那漢官家也只索抛撇姻緣離合都是天判寫天若肯容人移借便唱箇諸天大喏算天道無知怎解這離别三學士空計香偷和玉竊少磨勒恁様豪俠謾道書中自有千鍾粟比着商人終是賖此情若何粧臺說道從别後我消瘦些前腔没巴臂的相思無了歇怎當得這半世鬰結畢竟書中那有顔如玉我空向窗前讀五車此情若向粧臺説問從别後你可也消瘦些不用尾聲怨夢未刻龍子猶大勝樂用歌戈韻俗以聖誤劣冤家難遣心窩怪雙眉常自鎖恩辜義寡我也丢得過直恁的費吟哦料想是露凝荷葉空留戀祗不過水上桃花知怎麽合此恨終没結果則索高擎慧劒斬斷情魔前腔便比你做賽瓊花獨一無多被攀折須不可假如你在花前月下難忘我也只是空記念怎騰那明知是有團有散官筵席反害了無夜無明乆病痾合前不是路夢裹差訛化却鴛鴦做一窠知他是人間天上鬼婆娑笑呵呵霎時相問還相賀虧殺你跳出淸洪萬丈波情如火一塲歡喜天來大被鳥聲啼破鳥聲啼破掉角兒序仙吕眼兒前恍惚婆娑舌兒尖淋漓香唾枕兒上愁擔還挑被兒中愛河重墮想他柳如芽花似朶影難拿風難縳閙市張羅合當初會少如今夢多惱殺人魂來魄往可奈他何前腔誓今生決不念他又誰知夢中提我嘉相逢白日難求惡相思夜間怎躱恨他去無踪來無影慣懡㦬頻趺蹉瞌睡哥哥合前尾聲劣冤家能作禍常把芳魂撩我畵箇眞兒供養他春懷未刻王伯良梁州序用庚青韻粧慵玉鏡香消金鼎日午華堂人靜王孫芳草知他何處閒行謾有楊花飛素桃萼飄紅巳遍靑苔徑無聊常殢酒病難勝鎭日懨懨倚翠屏雲髩亂不堪整前腔換頭悵江南舊事無憑盻天涯斷鴻難倩漸西樓月滿畵闌愁凭常恨歸期空訂嘶騎不來一似缾沉井綠窗銀燭暗又深更立盡梧桐影半明誰似我恁孤另按南九宮譜梁州序以荆釵記家私迭等一曲爲則此曲其正體也諸如琵琶記新篁池閣一體皆犯賀新郎者乃世誤以爲梁州序而反以前調爲古梁州又或名之日梁州小序謬矣夏閨巳刻陳秋碧梁州新郞用家麻韻梁州序西園暮景南軒初夏長日端居多暇樓頭楊柳陰陰漸可藏鴉無奈關心杜宇惹恨鶬鶊占定荼䕷架芭蕉分綠也上窗紗閒看兒童捉柳花賀新郞合珠箔捲金鈎掛怪無端一夜東風大花亂落謾嗟呀前腔瑶臺寂靜畵欄幽雅一樹薔薇低壓鴛鴦兩兩飛來煖傍晴沙爲甚金鍼閒却綵線丢開刺繡都停罷舊巢新燕子語窗紗又見蛺蝶雙雙入菜花合前前腔換頭枕痕橫臉玉生霞篆烟微麝香消鴨對銀箏無緒雁行空駕幾度閒尋舊譜試學新聲欲演還抛下絲絲梅子雨潤窗紗無奈少女風前爛熳花合前前腔對香奩朱粉慵搽臨寶鏡靑螺羞畵病懨懨多半爲他瀟灑堪笑鸚􅛥解語鸜鵒能言把薄倖提名罵開遲紅芍藥映窗紗爲甚送盡春風始見花合前節節高蓮舟戲女娃笑聲譁蘭橈水濺凌波襪貪懽耍兩髻乂雙鬟亞靑靑荷葉無多大折來莫把絲牽掛合翠羽飛來綠葉叢玉盤欹側瓊珠下前腔乗陰傍水涯數歸鴉那看淚染鮫鮹帕音書假辜負咱多嬌姹歸期總是虗脾話長房縮地憐無法合前尾聲芳時一任東風嫁對良辰懽情未洽難道經秋不到家閨怨巳刻沈靑門梁州新郞用尤侯韻梁州序朱明佳景綠陰淸晝盡日飛花鴛甃夢驚芳草風簾搖拽金鈎正是屏山人悄沉水煙消此際堪憔瘦楚天人共遠謾凝眸倚遍西江十二樓賀新郞合春巳盡愁如舊怕黃昏寂寞難消受懽會少别離又前腔斜陽芳草淡烟疎柳又是棲鴉啼後悶來無語凭欄錯認歸舟空有藍橋心約紅葉情詞底事成虗謬舊遊人在否水空流雲鎖當年望月樓合前前腔換頭嘆巫峯雨歇雲收恨陽臺釵分鏡剖記臨岐執手淚盈衫袖只恐關河迢遞落日長堤千里空回首相思分兩地恨悠悠辜負今宵月滿樓合前前腔立斜暉目斷荒丘倚危樓聽殘寒漏浸紗厨月冷斷魂時候記得前春遊賞月下花前有箇人携手揚州孤夢破倦追遊更與何人上翠樓合前節節高花間鶯燕儔動離愁孤鸞羞舞菱花剖相思乆恨未休人消瘦羅衣寛褪芙蓉釦鮫鮹不禁啼痕透合但願延平劒再逢珠還洛浦圓如舊前腔瑤臺月影收露華浮看江空夜靜天啣斗頻搔首徹夜愁濃如酒任香消寶篆寒金獸誰憐獨自個空僝僽合前尾聲分離不似今畨驟望斷煙波萬頃秋愁滿天涯無盡頭詠遇片心樓改本唐六如梁州新郞用皆來韻梁州序飛瓊伴侣神他姿態一種風流無賽輕籠淡掃娉婷别様安排那更蘭心柔膩蕙質温存性格偏堪愛錦春浮簇處好紅白偏占屏前第一釵賀新郞合秦臺畔巫山外把眞情暗裏相傾待惟願取永和諧前腔霞籠杏臉春生銀海乍見靈心先解匆匆幽恨低從曲裏傳來暗把酒浮花瓣香結鮫鮹勾却前生債千金同一刻暢奇哉不用情傳雙鳳釵合前前腔換頭錦雲明花滿樓臺翠烟浮柳擎飛蓋喜靑春遊冶瀟洒襟懷正好偎紅倚翠爲雨爲雲牢結同心帶香肩雙竝處樂無涯輕却當年十二釵合前前腔自慚無華國雄才怎消受傾城睂黛喜瓊花玉樹竝蒂同栽最好是芙蓉帳裏明月窗前底事無聊賴嬌癡剛半醉鬢雲歪珊枕欹斜墮玉釵合前節節高簫聲起鳳臺彩雲開銀蟾湧出瓊瑤界香浮靄花戸埋三星在雙雙携手深深拜江枯石爛情無懈合盟言從此記心懷莫教犯却神前戒前腔佳期莫浪猜命中該鳳幃香煖春如海心兒快絕世才無瑕色當壚重遇臨卭客從今牢佔鶯花寨合前尾聲這姻緣應無賽似趙璧隋珠合彩願世世蟠桃會裏來春閨巳刻張伯起梁州新郞用先天韻梁州序瓊樓人靜綺窗塵遠簾幙春風輕軟花開花落相思易惹難痊正是晝長人困鳳管簫然此際情無限啼鶯聲亂也攪春眠兩地牽愁各一天賀新郞合韶光逝難留戀對東風無語空長嘆人别後幾時見前腔荼䕷香軟海棠枝懶雨重紅芳消減羅帷岑寂玉爐飛斷沉烟謾把絲桐閒整别雁離鴻總是傷春怨䦨干凭欲遍夜如年露滴香埃月滿天合前前腔換頭掛斜暉柳帶蒼烟舞雕簷桃花紅艷更瑶堦人悄漏傳銀箭落得西樓閒倚望入雲林人共天涯遠當年携手處草芉芉畨做愁雲怨雨天合前前腔落晴霞影亂文軒㵼寒濤冷侵眉靛更江空風送一聲歸雁只恐關河迢遞信斷衡陽離恨慿誰遣銀缸燒盡也不成眠人去空遺離恨天合前節節高垂楊月影圓漏將殘花稍露滴珍珠濺重門掩聽杜鵑啼紅怨流光頻向愁中變惜春不禁芳心亂合殷勤分付與東風莫教凋盡桃花片前腔榆英落翠鈿舞簷前空堦風送香塵淺春宵半蝶夢䦨鄕心轉玉人此夜應腸斷啼痕界破梨花面合前尾聲倚樓空把歸舟盻對景敎人思悄然何日重逢續斷絃惜别有序巳刻凌初成余身作秣陵之旅客心作吳門之故人正苦孤踪忽來仙斾兩情俱暢一意爲歡猛傳突起之獍竟致頓歸之狼狽徒使靑衫濕淚反看綠鬂蒙塵不禁寂寥謾形歌詠梁州新郞用先天韻梁州序擔囊京國閒吟空院追憶芳塵悽怨柔腸斷處從天降下輜軿依舊自腰欺弱柳步蹴金蓮歌罷桃花扇相逢先一笑態嫣然夜月輕彈念五絃賀新郞合方歡㑹諧心
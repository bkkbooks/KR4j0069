落東甌劉潑㡌篋中錦字堆成垜百千行無奈情何新詩幾首沾香唾東甌令堪誇彩筆屬靑蛾士女隊有他麽尾聲譜麗詞從酬和燈前宛轉費吟哦誰識新翻子夜歌閨怨巳刻古調羅江怨用庚青韻卽羅帶風又名楚江情香羅帶一更夜氣清瑤堦露零殘燈隱隱昏復明强將針指度閒情也思量薄倖全無志誠今宵那搭花徑行一江風撇得人冷冷清清門掩孤幃靜紅鴛被似氷紅鴛被似氷靑鸞夢未成又感起相思病前腔用江陽韻二更露正涼金爐燼香簷前鐵馬聲韻掦悶推鴛枕喚梅香也把銀缸點上羅衾欵張知他在誰家繫馬嘶綠楊多管是路柳墻花引得他心飄蕩月兒過粉墻月兒過粉墻風兒透𥿄窗怎受得淒涼況前腔用齊微韻三更玉漏遲殘燈影移堦前促織相伴啼蚤知他不是個致誠的也姻緣匹配如何便依到如今只落得空怨悲他將那訴過盟言只做個牙疼誓芭蕉細雨催芭蕉細雨催梧桐淸露垂都做了相思淚前腔用先天韻四更睡思纒騰騰困眠分明夢裏來近前我罵他薄情相負是何緣也他臉兒又厚口兒又甜牀児前跪膝稱可憐怎下得將他惡語相埋怨一輪明月圓一輪明月圓千金良夜天欲共効于飛願前腔用江陽韻五更覺夜長教奴怎當終宵錦被閒半牀方纔得睡又驚慌也梅香來報那人在堂春風欵欵入洞房怪他來揭起羅幃强把他攔擋傷心淚兩行傷心淚兩行薄情𥿄半張他認宿在平康巷按南宫譜云舊譜謂末後三句是怨别離但怨别離本調無可考而此三句與一江風後叚分毫不差只以一江風唱之爲是曲中思量薄倖二句梁少白以爲似皁羅袍非也此二句卽琵琶記香羅帶內擔閣你度靑春二句但毎句多一字耳閨怨白雪齋藏稿未刻失名羅江怨用東鍾韻又一體香羅帶懨懨病漸濃誰來和哄春思夏感秋又冬把滿懷心事訴天公也一江風天不憐人一任你遭磨弄恩多也是空情多也是空都做了南柯夢前腔伊西我在東何時再逢花箋漫寫封又封叮嚀囑付與鱗鴻也誰料浮沉不把我音書送思量也是空埋冤也是空都做了巫山夢前腔恩情逐晚風心意懶慵伊家做作無始終盟山誓海耳邊風也不記當初多少恩情重虧心也是空癡心也是空都做了蝴蝶夢前腔惺惺似懵懂落伊彀中無言暗把珠涙傾口心誰想不相同也一片眞情若個能知重得便宜也是空落便宜也是空都做了邯鄲夢閨情巳刻楊夫人羅江怨用車遮韻又一體香羅帶空亭月影斜東方旣白金鷄驚散枕邊蝶長亭十里唱陽關也一江風相思相見相見何年月涙流襟上血愁穿心上結鴛鴦被冷雕鞍熱前腔黃昏畵角歇南樓雁疾遲遲更漏初長夜愁聽積雪溜松稠也𥿄窗不定不定風如射墻頭月又斜牀頭燈又滅紅爐火冷心頭熱前腔關山望轉賖征途倦歷愁人莫與愁人説遥瞻天闕望雙環也丹靑難把難把衷腸寫炎方風景别京華音信絕世情休問涼和熱前腔靑山隱隱遮行人去急羊腸鳥道馬蹄怯鱗鴻不至空相憶也惱人正是正是寒冬節長空孤鳥滅平蕪遠樹接倚樓人冷闌干熱代金陵馬瑶姬寄渤海君巳刻梁少白九疑山用眞文韻香羅帶江東日暮雲寒鴉遠村關河千里勞夢魂三年不見倍傷神也犯胡兵黛眉都瘦損往來空寄信總然要打聽近行蹤無人可問懶畵眉鳳城車騎日紛紜只得勉强支持病裏身奈蕭郞不是箇中人醉扶歸最憐有線無針引因此上杜陵來往没寒溫到不如崔生日夜常親近梧桐樹香囊刺繡新畫扇描蘭俊自着春衫束得腰身緊寄時萬縷縈方寸瑣窗寒一星星意眞情懇偶聞君和水館締深盟這忘機鷗鷺休親大迓鼓相逢期孟春上元佳節燈火黃昏尺書何事無慿凖解三酲今回首又過春分長江且是東風順况一騎丹陽便到白門還思忖劉潑㡌紅顔定是多薄命莫負恩看舊日緣和分尾聲秋來又見歸鴻陣倚樓南望正斜曛拚却和淚緘書再寄君惜别巳刻元辭十様錦用江陽韻繡帶兒幽窗下沉吟半晌追思俏的嬌娘娉婷態不弱似鶯鶯妖嬈處可比雙雙非奬宜春令最堪誇他性格兒温柔難描畵他身材停當說不盡風流可喜萬般模様降黃龍相當月下星前吐膽傾心把誓盟深講行携坐兩願盡老今生同俲鸞凰醉太平誰想驀然平地浪波揚信知道禍從天降霧迷雲障被冤魔苦苦打散鴛鴦浣溪沙情慘悽心悒快閣不住淚珠汪汪勞神役思意倉皇忘飡廢寢徒懸望要見無繇百計忙除非是夢兒裏求到伊行啄木兒憐香惜玉相偎傍尤雲殢雨多歡暢那禁敗葉𫾣窗驚分天一方鮑老催此情怎忘羅衣尚存蘭麝香銀牋枉寫離恨章人何在謾嘆息空惆悵惱得潘郞兩鬢似霜下小樓咱這裏因他狂蕩他因咱痛感傷幾畨拚却不思量欲待將他丢放怎做得鐵打心腸雙聲子江淹恨韓生忿怎比得咱悲愴鶯啼序千般事纔離了心上又蚤來攢蹙睂傍天憐愁狀便教他相見何妨尾聲情人蚤得同鴛帳免使我心勞意攘爇一炷盟香答上蒼懷舊巳刻白雪齋改本張靈墟十様錦用眞文韻繡帶兒燈兒下低頭自忖消磨了幾箇黃昏夢回時殘月孤蓬花落後細雨重門堪憫宜春令是前生犯却勾陳怪今生又逢羊刅愁悶怎討得一宵恩愛膁了半生緣分降黃龍難論無底深恩月下花前目成心允幽期宻訊受盡了從前多少寒温醉太平慇懃錯將紅荳種愁根惡根苗苦縈方寸思量不盡這千般旖旎半天丰韻浣溪沙性兒醇情兒順最相應暗裏温存可憐冤債是前因河陽天遠難投逩算何日方酬㫁續恩絮叨叨說與他們啄木兒相逢非是言無准匆匆自恨情難盡又早雨打梨花欲㫁魂鮑老催花香酒尊人生飛駛逐電奔韶光九十没半分人不見謾嘆息空勞頓夢遶巫山一片雲下小樓只落得那夢中秦晉總牽愁秋與春桃源有路歎埋輪羡殺蜂忙蝶趂到省得痩減精神雙聲子水中魚沙中雁怎討得愁中信鶯啼序心中事描寫在𥿄上又相將化作啼痕其間怎忍自甘心寂寞病臥愁呻尾聲緣慳咫尺如天峻相思一曲不堪聞只恐啼徹哀猿也斷魂閨情巳刻梅禹金十様錦用齊微韻繡帶兒秦樓上月明如水難禁處鳳管頻吹恨悲秋宋玉偏多到今朝共我同悲追悔宜春令恨來時錦帕燒除愁絕處玉簮𫾣碎徘徊不覺啼花怨柳似痴如醉降黃龍羅幃燈火追隨帶影成三怎如他對魂消心苦似寸燭風前到底成灰醉太平蛾眉羞將胭粉畵葳𬎼怕綵雲收琉璃還脆似蜂攢花蕊怎消得千般狼藉萬般憔悴浣溪沙髻雲鬆釵金墜盻蕭蕭徑路無媒江南空有蚤春梅隴頭驛使應難會咫尺如同萬里違多因是有馬虺􅯁啄木兒空教蹙損春山翠繡幃錦帳情難遂恐容易香消土一坯鮑老催凄凉訴誰幽窗夜深啼子規鴛鴦枕倒牀亂搥鴻難覔雁不來書多僞心旌擺斷又搖神斾上小樓醒時易愁愁時難寐眞箇柔腸九曲廻相思路遠又崔巍莫說寄書的難到便那人兒有夢難歸雙聲子恨裏茶愁邊酒都化做心中淚鶯啼序心中淚啼殘帕上一行行又蚤成堆尾聲飄殘雲雨收環珮蝶祟蜂魔似鬼寂寞求凰一二徽惜别巳刻高深甫十様錦用家麻韻繡帶兒河橋路征㠶初掛瀟瀟水冷蒹葭生怕尋夢裏陽關蚤輕分眼前巫峽冤家宜春令明知是長短隨緣畢竟的縈牽難罷這心頭怪風塵離别夢魂驚諕降黃龍因他秋水烟霞掌上輕盈淩波瀟灑娉婷如畵勾引得漁郞路失桃花醉太平嗟呀蒼茫風露去無涯水中央櫓聲吚啞怎生禁架這雙眸望斷一天愁壓浣溪沙鴛枕邊燈篝下兩綢繆意不爭差等閒蜂蝶浪排衙新詞醉寫氷絲帕風月心傾綠髩娃儘郵亭唱入琵琶啄木兒懽娛一刻千金價金錢卜動游魂卦難道是水上萍踪鏡裏花鮑老催而今淚洒那堪人去愁轉加深林古樹棲暮鴉山與水魚共雁伊和咱端的是水遠山長魚雁遐下小樓惹得些没頭牽掛假疑眞怎捉拿三更夢不到天涯教我鸞孤鳳寡一擔兒總自撑逹雙聲子漏聲悽寒宵害先巳把供招押鶯啼序從前事幾多恩愛倒翻成無限波查還相訝何日月重圓枯木重華尾聲姻緣須記臨岐話莫把我别後相思當假又只怕回首恩情似搦沙按十様錦十二紅俱譜中所不載但兩調向爲人所習見且步驟亦自調胋故爲破格之收以僃一體問其所本則不可得而知也附識南呂名作如林閱之如入萬花谷中令人目迷五色然而姚黃魏紫疎影暗香自足玄賞是選不能盡收而惟以近乎感嘆傷惋之㫖者錄爲上乗其餘剰香殘蕋當留别墅以待陽春嶺樵白雪齋選訂樂府吳騷合編卷之二終

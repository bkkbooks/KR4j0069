倩人扶醉倒黃公舊酒壚懷華亭秋水作巳刻梁少白金絡索用先天韻金梧桐瑤臺一綘仙原住朝雲殿裊娜腰肢秋水雙眸剪塵緣未掃除東甌令思牽纏謫向人間十八年暫辭王母離真境針線箱聊逐東風上舞筵解三醒垂楊線懶畫睂睂兒葉葉更堪憐寄生子為傷春怕立簾邊蚤落盡桃花片五更轉南吕羡畫梁棲雙燕奈姻親獨未完檀郎慢自慢自多留戀好事蹉跎光陰如箭念往回空逗留無方便蒼天甚日從人願月轉回廊夜香庭院簇御林今迢遞路幾千笑花神未有權任風開落飄蒼蘚但芳心至死香不變恨綿綿幾多心事都付十三絃琥珀貓兒墜那人何處消渴在文園羸得文君眼望穿陰雲終散月終圓嬋娟須有日飛向蓬萊還寤生前尾聲淸宵白晝難消遣含羞未敢向人言只恐靑樓作話傳四時閨情巳刻常樓居金絡索用家麻韻金梧桐東風轉歲華院院燒燈罷陌上淸明看細雨紛紛下天涯蕩子心東甌令盡思家只見人歸不見他合歡未久難拋舍針線箱追悔從前一念差解三酲傷情處懶畫睂懨懨獨坐小窗紗寄生子只見片片桃花陳陳楊花飛過了鞦韆架前腔用先天韻楊花亂滚綿蕉葉初成扇翠蓋紅衣出水新蓮現金爐一縷微爇沉煙睡起紗厨雲髻偏無端好夢誰驚破風外鶯聲柳外蟬羞臨鏡千愁萬恨對誰言只見舊恨睂尖新淚腮邊界破殘粧面前腔用尤侯韻間階細雨收翠幕新涼透衰柳殘荷正值愁時候近來都減却舊風流爭奈新愁接舊愁白雲望斷天涯遠人在天涯無盡頭相思病無明徹夜幾時休只見雁過南樓月下西樓人比黃花瘦前腔用東鐘韻銀臺綘蠟籠翠幄金鈎控錦帳紅爐獨自無人共月明初轉過小房櫳不放淸光照病容愁聽畫角聲三弄吹落梅花一夜風關山夢魚沉雁杳信難通孤眠人最怕隆冬正值嚴冬做不就鴛鴦夢代吕姬霏茵賦别改刻騷隱生金絡索用先天韻金梧桐郵亭繫赤騶别酒頻斟勸執手叮嚀兩下相留戀思君萬種情東甌令憶君言滿望生死皈依共百年被孽風吹散于飛翼針線箱鋼鏟分開並蒂蓮解三酲天涯遠懶畫睂那堪繡被冷紅鴛寄生子從今後衰草平川何處把行蹤盻前腔同前韻人離在眼前别恨和心纒剩雨殘雲都是相思劵歸期在那些待君旋莫使深閨望眼穿怪一鞭鞍馬驚幽夢何處鱗鴻覔錦箋空悲怨非君分淺是妾無緣從今後翠冷花鈿更香燼黃金篆前腔用寒山韻斜暉映落霞野樹連秋漢颯颯金風生拆雙飛雁觸處可憐人滯君難打迭離魂逐去鞍奈半肩行李重催促一曲驪歌唱欲闌愁無限淮陰匹馬甚時還從今後夢裏巫山只落得空牽絆前腔同前韻寒衣贈白裘别語盟靑案無限離情叮囑千千萬􅏰􅏰淚眼看背君彈想去後思君病漸怕春深花落重門悄夜永蘭膏照影單空長嘆相看心事一般般從今後瘦損朱顔甚日得重歡宴寄别未刻龍子猶金絡索用江陽韻金梧桐曾叨金屋光自小章臺養學得靑謳聲繞芙蓉帳連環輕解開東甌令做野鴛鴦惆悵東風沒主張抵多少夢回王謝堂前燕針線箱抵多少魂逐臨卭弦卜凰解三酲無名網懶畫睂背人深處儘思量寄生子正是舊恨難忘新恨難降亂滚滚桃花浪前腔劉郎續阮郎濮上兼梁上風月場頭自把年華誑流光似水花眼前忙滋味靑樓也算嘗也有個千金難買燈前笑也有個一面能牽去後腸空勞攘離亭羞贈舊時香這是前世餘殃今世承當折罰在平康巷前腔五陵裘馬狂七步才華廣那富貴風流浪宕終難仰當時遇可人在金閶海水難將升斗量俊眸慙妾非紅拂俠骨知君似李郎把真情講十年脂粉付滄浪却不道柳折須長花採須芳這緊慢教人望前腔春郊女伴將月夜遊人訪怯舞辭歌覿面渾如強孤燈夜永時自倣徨覔得甜桃懶去嘗情癡妾似離魂女負義君非李十郎頻來往相思病種入膏盲只怕今日西廂明日東墻蚤晚無的當宛轉歌原注云譜所載末云一聲聲呌得淒涼愁鎖在睂尖上本只二句即琵琶記空爭著間是間非祗落得垂雙淚亦二句也唱者郤增偏要爭間是間非句陋甚而時曲只見片片桃花陳陳楊花浣紗記那時節異國飄零音信難憑俱用三句不知何據譜分注寄生子而寄生子本調竟缺今從俗終為未安尚須查正子猶識招夢未刻沈伯英金甌線解酲用戈歌韻金梧桐相思沒奈何離恨難消破欲倩遊魂入夢尋則箇當初苦憶他東甌令眼難合但合眼依稀得見多如今夢裏也潛逃躲針線廂怨殺那不做美無情狠睡魔解三酲把芳魂鎖慣呵雲叱雨特地張羅浣溪樂南吕浣溪沙你曽送神女來高唐左與襄王結就絲蘿偏生把我多摧挫直恁地書生緣分薄大勝樂如何是可把降魔寶劒暗裡摩挲春太平宜春令我心才動他却笑呵道何須煩君太阿你自體疲力倦赤繩枉向君邊過假饒他倩女離魂也搖不動你希夷高臥醉太平但得你少眠一和須教送與微步淩波奈子落瑣窗奈子花謝尊神呼醒南柯奈狂生才愧東阿洛神擬賦愁懷無那閣筆處淚珠雙墮瑣窗寒儘教收入變聲歌做成一串珠顆尾聲酒在樽茶留火不醒不醉睡溫和不信芳魂不見過三籟止載浣溪沙春太平二曲於宜春令套曲之後謂二曲偶從譜末帙中得之得句頗俊苦無全套收之然與驀忽地一套筆致如出一手故附録於此不知此亦詞隱先生筆刻情癡寱語中三籟能辨之似非門外漢矣子猶先生筆按商性屬金於令屬秋故昔人謂此調貴乎悲傷宛轉良有以也夫傷離寫恨自餘感悼情有固然但其間必有一種真正蕭瑟寂歷之氣淒楚動人庶乎近是本調名筆繁多懸此以為選的遺珠錯落更俟續收嶺樵漫筆雙調夜思巳刻陳海樵鎖南枝用庚青韻黃昏後鼓一更知君讀易臨小亭燈火隔簾明人聲四鄰靜停樽待掃徑迎猛可的月移花渾疑是君影前腔用魚模韻天街靜二鼓餘思君此時猶讀書庭草未曽除囊螢燦如許門雙掩榻半虗猛可的竹生風長疑是君語前腔用先天韻三更轉夜半天知君此時猶未眠鐵馬傍風傳銀河繞簷轉臨牀畔當案前試展寄來書渾如對君面前腔用東鐘韻譙樓鼓剛四咚思君不來尊巳空鬼病害得我帶圍鬆佳期數得我指頭痛燈初暗睡正濃可喜的共君眠原來是一夢前腔用齊微韻殘更斷星斗稀思君出門來也未隔水一雞啼喧林亂鴉起人將至喜上睂休問我夜來情但看我枕邊淚題東未刻龍子猶鎖南枝用支思韻曽留下柬帖兒千恩萬愛彼一時恨不得把全副肝花嘔向這幾箇鴛鴦字就是鐵人見心也慈害相思都為此前腔換頭將他謹藏笥不許他人瞷我私每遇悶時開看只當一度相逢一度歡娛事強婚帖賽誓詞再不消費第二張𥿄前腔燭流淚𧖟挂絲只道恩情到底常似兹誰知日久見人心漸漸不如始雖柬帖時有之比當初渾不似前腔換頭當初血瀝瀝幾行字如今虛飄飄一片詞他的話比先前加美細勘真情百分無一二一場好枉被嗤情願抱當初柬帖兒死金閶紀遇有序未刻龍子猶白氏為花館名家而來姬尤後來之最秀東山許元燮則其破瓜之交也元燮作金閶紀遇傳自詫奇緣余譜為新詞傳諸好事來姬字掌珍蓋元燮所贈云珠性圓走而掌又有翻覆之義元燮愼守寶矣佳人再難得其勿效章臺柳往事哉錦堂月用庚靑韻晝錦堂花滿金庭春深玉柱誰爭五湖煙景生長繁華風流少年馳騁月上海棠攬蘇臺西苧餘香咏銅雀東風司令頻追省休得要秋到傷春老來索鏡堂上集賢賔晝錦堂換頭寂靜淨几明窗翻今閲古别有酒狂詩興天上人間除非草木無情月上海棠鳳尾草也解榮枯連理木偏能齊整集賢賔倘藍橋幸玉杵價豈辭高等集賢賔商調下三曲同偶春花鳥來使星問秦淮柳色誰青屈指尋常桃與杏但無雙不産金陵自有煙花首領論小字夜來厮稱他都是靈秀稟就是珠十斛也買不出這娉婷集賢聽黃鶯集賢賔盈盈二七方待齡似豆􅞦香凝妙舞淸歌都絶頂更步打場中超乘琴棋井井凡百技諸般佳品黃鶯兒小妖精豪門巨室歡喜竟何曾黃鶯兒金屋久聞名信還疑喜又驚白家蠻素剛同姓泛扁舟幾程歷煙波幾汀恨金閶不比天涯近到蓬瀛間花怎惹許自有飛瓊黃鶯帶一封黃鶯兒我是黃卷課靑燈暫偷間訪玉京奈娘行做出喬行徑眼兒望得盲腳兒站得疼等間的未許通殷聘一封書鏡中形谷中聲三復關雎心未平一封書仙吕下六曲同終宵自飮氷把虔誠感巨靈重來到錦營覩光輝百倍榮畫閣深深頻致請萬喚千呼不肯行似蘭馨似珠明捧出雕盤真水晶一封羅一封書羞答答臉頳悄低頭倚畫屏梨花一枝春帶雨縱飛燕新粧不恁爭皂羅袍金叉十二端詳可憎靑樓十二供他使令從前春夢到此安排定皂羅袍珍重娘行伸敬這姻緣天大怎教我造次應承他是玉皇殿上校書丞怕書生福淺難僥幸欲行還往可喜香浮酒淸欲留還去可憐好事未成把佳期來日從容訂皂羅歌皂羅袍意馬心猿紛競悔登時腼腆推調紅繩倚閭人望得眼睜睜一封書怎敢違尊命排歌留無計蚤恨轉增長條攀折巳無憑人難再城可傾香衾覆枕鬪心兵甘州歌八聲甘州高唐神有靈借巫雲一片教他野渡舟橫十分不穩穩的是隻形孤影魂顚夢倒神未寧忽聽得雨驟風狂閙五更排歌披衣起合掌聽千聲方便謝神明想是明河㵼洛木升從天降下美前程甘州解酲甘州歌靑鴉喜笑迎儘東山屐齒忘却伶俜時來心肯不惜買花錢贈傾囊聊表叉鈿情肆席重陳山海盟解三酲雙雙並對氤氲使者禮拜通誠解三酲唱一曲今宵歡慶把前身認做鶯鶯畫堂中萬福聲相應杯到處巳酩酊今日裏花燭洞房把嬌客稱賽過那玉殿爐傳金榜登魂消賸看不盡溫柔窈窕向燈下停睛解酲姐姐此調及下二犯曲皆譜中不載解三酲只為兒女情長憐夜短縱有歌舞如雲無暇評惜花人耳畔私央倩一句句巳應承正蘭湯試浴看他雲髻傾又蚤攢簇蛾睂愁未經好姐姐妾薄命一點在素綃君親證墮落風塵忒煞輕好姐姐仙呂入雙調宛轉鴛鴦交頸有的是惜玉憐香權柄霎時到手勸君聊住停昏還醒千金不換須臾頃魂繞陽臺第幾層姐姐撥棹好姐姐自慙這麗質怎勝從此後心腸難硬俺和伊情分一似海樣盈川撥棹甚日得雙鸞共乘願今朝天慢睛願天天且莫明撥棹入僥僥川撥棹蚤聽得疏鐘遠寺鳴見窗隙微光枕畔呈淚斑兒兀自熒熒淚斑兒兀自熒熒僥僥令只見他星眼朦朧餘羞態又見他鬢縱橫倍可矜僥僥令雙調風流原有種今日總輸卿一任風波休輕散須記著賀新郎第一聲尾聲貪花採得花中聖五湖年少不虗生喚作明珠掌上擎雙調健捷激裊蓋如文章家之以筋力勝而不欲其以浮靡見長者也聲音之道可想見焉本調名目有限詞亦如之不能僃美中如子猶先生金閶紀遇一套似亦賣弄家私而故為破格鋪排者如以尋常章法律之殊非作者之意而亦非選者之心矣原評録後嶺樵附識凡紀事之詞全要節次清楚而過脈絶無痕迹如太史公伯夷屈原等傳以事實議論相御而行其敘事又須明顯使人一覽而知方妙此是子猶勝場硯齋主人原評白雪齋選訂樂府吳騷合編卷之三終
